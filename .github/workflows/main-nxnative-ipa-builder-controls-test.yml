      - name: Explain experimental and game-dependent settings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_REVIEW'
          """Presentation-only annotations, applied AFTER guarded Pocket source checks."""
          from pathlib import Path

          NOTES = {
              'DM_RENDER_SCALE': ('Render scale (experimental)', 'Effect depends on the game and renderer; internal resolution may not change. Restart before comparing. Lower values do not guarantee less heat or higher FPS.'),
              'DM_DYNAMIC_RESOLUTION': ('Dynamic resolution (game-dependent)', 'Requires game support. A visible toggle may have no effect. Restart before comparing; leave off if the game is already smooth.'),
              'DM_FRAMEGEN': ('Frame generation (experimental)', 'Game and renderer support varies. Interpolated pictures do not increase game simulation speed; artifacts and extra GPU work are possible. Restart before comparing.'),
              'DM_FPS_TARGET': (None, 'A target is not a performance guarantee. Higher values may affect game speed and heat. Restart before comparing; use the working default first.'),
          }

          def annotate(text):
              rows = []
              seen = set()
              for line in text.splitlines():
                  parts = line.split('\t')
                  key = parts[0]
                  if key in NOTES:
                      if key in seen or len(parts) < 8:
                          raise ValueError('Settings guidance: duplicate or malformed row for '+key)
                      seen.add(key)
                      label, note = NOTES[key]
                      if label is not None:
                          parts[6] = label
                      # Preserve engine-specific advice as well as our caution. Idempotent.
                      if note not in parts[7]:
                          # Remove the old generic guarantee, not engine-specific details.
                          parts[7] = parts[7].replace('Lowers resolution to keep the device cool and save battery.', '').strip()
                          parts[7] = (note+' '+parts[7]).strip()
                      line = '\t'.join(parts)
                  rows.append(line)
              if not {'DM_RENDER_SCALE', 'DM_DYNAMIC_RESOLUTION'}.issubset(seen):
                  raise ValueError('Settings guidance: expected display settings were not found')
              return '\n'.join(rows)+'\n'

          path = Path('dm/games/settings.tsv')
          original = path.read_text(encoding='utf-8')
          updated = annotate(original)
          # Never change options, defaults, visibility, groups or metadata.
          before, after = original.splitlines(), updated.splitlines()
          assert len(before) == len(after)
          for old, new in zip(before, after):
              a, b = old.split('\t'), new.split('\t')
              assert len(a) == len(b)
              assert all(x == y for i, (x, y) in enumerate(zip(a, b)) if i not in (6, 7))
          path.write_text(updated, encoding='utf-8')
          print('Added English settings support notes; defaults, gates, renderer and game fixes are unchanged.')
          PY_REVIEW

      - name: Verify host UI and applied source patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os, re
          from pathlib import Path
          root = Path('dm/ios/Sources')
          pad = root / 'DmGamepad.m'
          if not pad.is_file():
              raise SystemExit('Host UI check: DmGamepad.m is missing; the engine layout may have changed.')
          swift = root / 'GameMenu.swift'
          target = swift if swift.is_file() else pad
          text = target.read_text(encoding='utf-8', errors='replace')
          for required in ('2D Controls (Simple)', '3D Controls (Full)', 'Tap (Touchscreen)', 'Trackpad (Drag & Tap)', 'Control Mode', 'Display', 'Controls', 'Performance', 'Other Settings', 'Next launch'):
              if required not in text:
                  raise SystemExit('Host UI check: expected control-menu labels or groups were not found; the engine source may have changed.')
          if swift.is_file() and 'dm_pad_layout_set' not in text:
              raise SystemExit('Host UI check: control selection handler was not found in GameMenu.swift.')
          header = root / 'DmGameMenu.h'
          if swift.is_file() and header.is_file() and 'dm_quit_menu' in header.read_text(encoding='utf-8', errors='replace') and 'dm_quit_menu()' not in text:
              raise SystemExit('Host UI check: the engine Quit action was not preserved.')
          if not swift.is_file() and ('buildTopMenuElements' not in text or 'setPadLayoutMode' not in text):
              raise SystemExit('Host UI check: legacy control-menu handler was not found.')
          legacy = Path('dm/gfx/nvn/nvn_mtl_legacy.inc')
          if legacy.is_file():
              t = legacy.read_text(encoding='utf-8', errors='replace')
              if 'TONTON_SHADER_CHAIN' in t:
                  raise SystemExit('Patch check: legacy renderer still references TONTON_SHADER_CHAIN.')
              if 'g_ext_ev_val' in t:
                  declared = t.find('static _Atomic uint64_t g_ext_ev_val;')
                  present = t.find('static int present_now(')
                  if declared < 0 or present < 0 or declared > present:
                      raise SystemExit('Patch check: legacy renderer event declaration is missing or appears too late.')
          # Conservative source audit: literal Han characters in host UI source
          # or settings rows trigger review. Game text is not included.
          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          checked = [p for p in root.rglob('*') if p.is_file() and p.suffix in {'.swift', '.m', '.mm', '.h'}]
          settings = Path('dm/games/settings.tsv')
          if settings.is_file(): checked.append(settings)
          for p in checked:
              if han.search(p.read_text(encoding='utf-8', errors='replace')):
                  raise SystemExit(f'Host UI source audit: Han character found in {p}. Review the source before building. Game text is not audited.')
          print(f'Host source checks passed: {len(checked)} files scanned; control labels and selected legacy patches checked.')
          print('These checks do not test compilation, runtime menu availability, touch accuracy, or game language.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Host source checks\n- Control labels and selected patch markers found; host UI sources scanned for literal Han characters.\n- Not a device test or a guarantee about game text, escaped strings, all resources, or touch behaviour.\n\n')
          PYTHON

      - name: Apply A Short Hike legacy MSAA workaround
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && env.DETECTED_TITLE_ID == '01004890117B2000' && inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        env:
          DEVICE_INPUT: ${{ inputs.device }}
          MODE_INPUT: ${{ inputs.build_mode }}
          CACHE_INPUT: ${{ inputs.shader_cache }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_SHORT_HIKE'
          """A Short Hike-only legacy MSAA integration. No shader-evidence export."""
          import hashlib
          import json
          import os
          from pathlib import Path

          TITLE = '01004890117B2000'
          ENGINE = 'b5ac83de5c3c01ab30b3e0dbac8eaf32fe2f9b14'
          DEVICE = 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
          EXPECTED = {'dm/gfx/nvn/nvn_mtl_legacy.inc': '351268eb459d0038826f8a20f374001ac4e1b9b497ef73c69f872bf8531b68cb',
                      'dm/ios/tools/build_ipa.sh': '174019237dd0fd3b4bd92b753ffc1eacc20a9224ec97415cde79a415a4f1af22'}
          DECISION = '''static unsigned ash_msaa_decide(unsigned requested, int eligible, int supports_requested, int supports_four) {
              return requested == 8 && eligible && !supports_requested && supports_four ? 4 : requested;
          }
          '''
          HELPER = '''// ASH-MSAA-v1: experimental host-only quality reduction for ONE title.
          // Never change NVN descriptors, guest allocation sizes, layouts, or getters.
          ''' + DECISION + '''static NSUInteger ash_msaa_samples(const tex_t *t, int packaged) {
              unsigned requested = t->d.samples;
              if (DM_GAME_PROGRAM_ID != 0x01004890117B2000ull || requested != 8) return requested;
              int eligible = !packaged && !t->has_layout && !(t->d.flags & NVN_TEXTURE_FLAGS_IMAGE);
              int s8 = [g_dev supportsTextureSampleCount:8], s4 = [g_dev supportsTextureSampleCount:4];
              unsigned actual = ash_msaa_decide(requested, eligible, s8, s4);
              if (!s8) {
                  static _Atomic unsigned reports;
                  if (atomic_fetch_add_explicit(&reports, 1, memory_order_relaxed) < 16)
                      MLOG("[ASH-MSAA-v1] %s requested=8 actual=%u supports4=%d eligible=%d target=%d ser=%llu; sample-index semantics unverified",
                           actual == 4 ? "fallback" : "NOT remapped", actual, s4, eligible, t->d.target, (unsigned long long)t->serial);
              }
              return actual;
          }
          '''
          SAMPLED_OLD = '''    id<MTLTexture> mt = tex_mtl(t);
              g_texture_sampled = false;
              return mt;'''
          SAMPLED_NEW = '''    id<MTLTexture> mt = tex_mtl(t);
              if (DM_GAME_PROGRAM_ID == 0x01004890117B2000ull && t && t->d.samples == 8 && mt && mt.sampleCount == 4) {
                  static _Atomic unsigned reports;
                  if (atomic_fetch_add_explicit(&reports, 1, memory_order_relaxed) < 8)
                      MLOG("[ASH-MSAA-v1] sampled remapped texture ser=%llu: per-sample shader reads are NOT proven safe", (unsigned long long)t->serial);
              }
              g_texture_sampled = false;
              return mt;'''
          PASS_ANCHOR = '        pass_dims(pd, (NSUInteger)physical_colors, &g_pass.tw, &g_pass.th);'
          PASS_TRACE = '''        if (DM_GAME_PROGRAM_ID == 0x01004890117B2000ull && g_pass.samples > 1) {
                      static _Atomic unsigned reports;
                      if (atomic_fetch_add_explicit(&reports, 1, memory_order_relaxed) < 8) {
                          unsigned mismatch = 0;
                          for (int ai = 0; ai < physical_colors && ai < 8; ai++) {
                              id<MTLTexture> at = pd.colorAttachments[ai].texture;
                              mismatch |= at && at.sampleCount != g_pass.samples;
                          }
                          mismatch |= dt && dt.sampleCount != g_pass.samples;
                          mismatch |= stt && stt.sampleCount != g_pass.samples;
                          MLOG("[ASH-MSAA-v1] pass actual=%u attachment_mismatch=%u", g_pass.samples, mismatch);
                      }
                  }
          '''
          PSO_ANCHOR = '    d.rasterSampleCount = k->samples ? k->samples : 1;'
          PSO_TRACE = '''
              if (DM_GAME_PROGRAM_ID == 0x01004890117B2000ull && d.rasterSampleCount > 1) {
                  static _Atomic unsigned reports;
                  if (atomic_fetch_add_explicit(&reports, 1, memory_order_relaxed) < 8)
                      MLOG("[ASH-MSAA-v1] pipeline actual=%lu", (unsigned long)d.rasterSampleCount);
              }'''
          RESOLVE_ANCHOR = '    if (c->flags & DM_COPY_RESOLVE) {   // Downsample: multisample resolve into the single-sample destination (depth takes sample 0); with equal sample counts it is a plain whole copy'
          RESOLVE_TRACE = '''
                  if (DM_GAME_PROGRAM_ID == 0x01004890117B2000ull && c->src->d.samples == 8) {
                      static _Atomic unsigned reports;
                      if (atomic_fetch_add_explicit(&reports, 1, memory_order_relaxed) < 8)
                          MLOG("[ASH-MSAA-v1] resolve actual=%lu->%lu", (unsigned long)s.sampleCount, (unsigned long)d.sampleCount);
                  }'''
          HOOK = '    python3 "$IOS_SOURCE/tools/prepare_legacy_resources.py"'
          PROFILE_GUARD = '''    # Check the actual profile after the builder's provisional-profile creation.
              ASH_PROGRAM_ID=$(gp program_id)
              python3 -c 'import sys; sys.exit(0 if sys.argv[1] == "01004890117B2000" and int(sys.argv[2], 16) == 0x01004890117B2000 else "A Short Hike: final profile identity mismatch")' "$GAME" "$ASH_PROGRAM_ID" ||
                die "A Short Hike final profile guard failed"
          '''
          NEW_HOOK = PROFILE_GUARD + HOOK


          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise ValueError('A Short Hike: source anchor changed; refusing patch')
              return text.replace(old, new, 1)


          def apply(root, env):
              for key, value in {'DETECTED_TITLE_ID': TITLE, 'ENGINE_REV': ENGINE,
                                 'DEVICE_INPUT': DEVICE, 'CACHE_INPUT': 'false',
                                 'MODE_INPUT': 'Build IPA (Default)'}.items():
                  if env.get(key) != value:
                      raise ValueError('A Short Hike: incorrect ' + key + '; no files changed')
              # DM_GAME is a preliminary workflow hint here, not the final builder profile.
              # Unprofiled games start as DEFAULT; the NSP builder creates a title-specific
              # provisional profile later. The packaging hook verifies that final identity.
              profile = env.get('DM_GAME')
              if profile not in (TITLE, 'DEFAULT'):
                  raise ValueError('A Short Hike: unexpected preliminary profile; no files changed')
              if profile == 'DEFAULT' and (root / 'dm/games' / TITLE).exists():
                  raise ValueError('A Short Hike: DEFAULT conflicts with an existing title profile; no files changed')
              originals = {}
              for name, digest in EXPECTED.items():
                  data = (root / name).read_bytes()
                  if hashlib.sha256(data).hexdigest() != digest:
                      raise ValueError('A Short Hike: unknown or already-patched source: ' + name)
                  originals[name] = data.decode('utf-8')
              inc_name, sh_name = EXPECTED
              inc = originals[inc_name]
              inc = replace_once(inc, 'static MTLTextureDescriptor *tex_desc(const tex_t *t, int packaged) {',
                                 HELPER + 'static MTLTextureDescriptor *tex_desc(const tex_t *t, int packaged) {')
              if inc.count('d.sampleCount = t->d.samples;') != 2:
                  raise ValueError('A Short Hike: multisample descriptor sites changed')
              inc = inc.replace('d.sampleCount = t->d.samples;', 'd.sampleCount = ash_msaa_samples(t, packaged);')
              inc = replace_once(inc, SAMPLED_OLD, SAMPLED_NEW)
              inc = replace_once(inc, PASS_ANCHOR, PASS_TRACE + PASS_ANCHOR)
              inc = replace_once(inc, PSO_ANCHOR, PSO_ANCHOR + PSO_TRACE)
              inc = replace_once(inc, RESOLVE_ANCHOR, RESOLVE_ANCHOR + RESOLVE_TRACE)
              sh = replace_once(originals[sh_name], HOOK, NEW_HOOK)
              changes = {inc_name: inc, sh_name: sh}
              # All guards completed before writing anything.
              for name, text in changes.items():
                  (root / name).write_text(text, encoding='utf-8')
              report = {'test': 'ASH-MSAA-v1', 'workflow_revision': 'main-pocket-integration-v1',
                        'preliminary_profile': profile, 'title': TITLE, 'engine': ENGINE,
                        'before': EXPECTED, 'after': {n: hashlib.sha256(t.encode()).hexdigest() for n, t in changes.items()},
                        'apple_compiled_here': False, 'gameplay_verified': False,
                        'scope': 'Capability-checked 8-to-4 host-only experiment; GPU-only non-image textures. Guest descriptors/layouts unchanged.',
                        'unresolved': ['Per-sample shader semantics and readback', 'Tier1 sampler resource limits', 'SIMD shuffle pipeline compilation']}
              print('A Short Hike: title-scoped legacy MSAA workaround installed. User-confirmed on A12Z; this build still needs device verification.')
              return report


          if __name__ == '__main__':
              report = apply(Path('.'), os.environ)
