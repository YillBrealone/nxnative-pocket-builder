          CHECKERS={'legacy':'"""Fail closed before publishing an IPA without the checked diagnostic hooks."""\nimport hashlib, json, os, plistlib, re, struct, zipfile\nfrom pathlib import Path\n\nEXPECTED = {\n    \'main\': (\'7c463c12553bab2d98dd6d579d60af07\', [(40, 0x895edc, 0xf94007f4)]),\n    \'sdk\': (\'5bb30f7980902b19b8babdc891061ef2\', [(38, 0x34e5e8, 0xaa1303e0), (39, 0x34f480, 0x12002008)]),\n}\ndef check(ok, message):\n    if not ok: raise RuntimeError(\'Disco diagnostic verification failed: \' + message)\ndef table(text):\n    return [line.replace(\'\\\\t\', \'\\t\').split(\'\\t\') for line in text.splitlines()]\ndef branch(word, off):\n    check(word & 0xfc000000 == 0x14000000, \'expected unconditional branch at \' + hex(off))\n    imm = word & 0x3ffffff\n    if imm & 0x2000000: imm -= 0x4000000\n    return off + 4 * imm\n\ndef verify(ipa):\n    if hashlib.sha256(Path(\'dm/host/hle_svc.c\').read_bytes()).hexdigest() != \'5223149963b36528800ecda7f6556a9356729407306f5e7e0b9838918189c344\':\n        raise RuntimeError(\'Disco Legacy host source changed before packaging verification\')\n    with zipfile.ZipFile(ipa) as z:\n        infos = [n for n in z.namelist() if re.fullmatch(r\'Payload/[^/]+\\.app/Info\\.plist\', n)]\n        check(len(infos) == 1, \'exactly one application required\')\n        base = infos[0].rsplit(\'/\', 1)[0] + \'/\'\n        info = plistlib.loads(z.read(infos[0]))\n        check(info.get(\'CFBundleShortVersionString\') == \'1.0.13\', \'requires Disco 1.0.13\')\n        check(info.get(\'CFBundleIdentifier\', \'\').lower() == \'org.nxnative.01006c5015e84000\', \'wrong title\')\n        check(info.get(\'DMCommit\') in (\'b5ac83de5c3c\', \'b5ac83de5c3c+dirty\'), \'wrong engine\')\n        executable = info.get(\'CFBundleExecutable\')\n        check(isinstance(executable, str) and \'/\' not in executable, \'invalid executable name\')\n        b = z.read(base + executable)\n        check(struct.unpack_from(\'<I\', b)[0] == 0xfeedfacf, \'expected thin 64-bit Mach-O\')\n        for marker in [b\'[disco-alloc-v1] ARMED\', b\'[disco-alloc-v1] RESERVE_FAIL\', b\'[disco-alloc-v1] METADATA_MAP_FAIL\', b\'[disco-alloc-v1] PROVIDER_ZERO\', b\'[disco-alloc-v1] TREE_SUMMARY\']:\n            check(marker in b, \'missing host callback marker \' + marker.decode())\n        for marker in (b\'[disco-legacy-compact-v1] CONFIGURED\', b\'[disco-legacy-compact-v1] ACTIVE\', b\'[disco-legacy-compact-v1] unsupported runtime memory layout\', b\'legacy renderer (Metal 4 pipeline archive unavailable)\'):\n            check(marker in b, \'missing Legacy fix/renderer marker \' + marker.decode())\n        sections = {}; p = 32\n        for _ in range(struct.unpack_from(\'<I\', b, 16)[0]):\n            cmd, size = struct.unpack_from(\'<II\', b, p)\n            check(size >= 8 and p + size <= len(b), \'bad load command\')\n            if cmd == 0x19:\n                count = struct.unpack_from(\'<I\', b, p + 64)[0]\n                for j in range(count):\n                    name, seg, va, n, fo = struct.unpack_from(\'<16s16sQQI\', b, p + 72 + j * 80)\n                    sections[seg.rstrip(b\'\\0\').decode(), name.rstrip(b\'\\0\').decode()] = (va, n, fo)\n            p += size\n        evidence = []; module_layouts = {}\n        for mod, (bid, hooks) in EXPECTED.items():\n            fix = dict((r[0][2:], r[1]) for r in table(z.read(base+\'dm/\'+mod+\'.fixups.tsv\').decode()) if len(r) >= 2 and r[0].startswith(\'# \'))\n            check(fix.get(\'BUILD_ID\') == bid, \'wrong guest \' + mod + \' build\')\n            gates = table(z.read(base+\'dm/\'+mod+\'.gates.tsv\').decode())\n            patch = int(fix[\'PATCH_OFF\'], 0)\n            check(patch >= 0, \'unsupported negative patch layout for inspected \' + mod)\n            whole = sections.get((\'__TEXT\', \'__dm\'+mod+\'img\'))\n            x0 = sections.get((\'__TEXT\', \'__dm\'+mod+\'x0\'))\n            x1 = sections.get((\'__TEXT\', \'__dm\'+mod+\'x1\'))\n         