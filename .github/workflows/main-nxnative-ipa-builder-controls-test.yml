'invalid instruction address for \' + mod)\n                for lo, size, fo in ranges:\n                    if lo <= a and a + 4 <= lo + size:\n                        return struct.unpack_from(\'<I\', b, fo + a - lo)[0]\n                raise RuntimeError(\'Diagnostic instruction address outside checked code ranges for \' + mod)\n            if mod == \'sdk\':\n                ids = {int(row[2], 0) & 255 for row in gates if len(row) == 4 and row[1] == \'obs\'}\n                check({22, 23, 24}.issubset(ids), \'missing existing SDK region gates\')\n            for oid, off, original in hooks:\n                matches = [row for row in gates if len(row) == 4 and row[1] == \'obs\' and int(row[2], 0) == oid and int(row[3], 0) == off]\n                check(len(matches) == 1, \'missing/duplicate gate \' + str(oid))\n                ret = int(matches[0][0], 0)\n                start = branch(word(off), off)\n                check(12 <= ret - start <= 128, \'gate entry/return mismatch\')\n                check(word(start) == 0xa9bf7bfd, \'gate must preserve x29/x30\')\n                check(word(ret) == 0xa8c17bfd, \'gate must restore x29/x30\')\n                check(word(ret + 4) == original, \'original instruction not preserved\')\n                check(branch(word(ret + 8), ret + 8) == off + 4, \'wrong gate continuation\')\n                evidence.append({\'module\': mod, \'id\': oid, \'offset\': hex(off), \'original_word\': hex(original)})\n        return {\'test\': \'disco-legacy-compact-v1\', \'checker_revision\': 2, \'module_layouts\': module_layouts, \'verified_packaged_hooks\': evidence,\n                \'engine_stamp\': info.get(\'DMCommit\'), \'executable_sha256\': hashlib.sha256(b).hexdigest(),\n                \'scope\': \'Packaging/instruction verification; not proof of device execution or gameplay.\'}\n\n','nx':'"""Fail closed before publishing an IPA without the checked diagnostic hooks."""\nimport hashlib, json, os, plistlib, re, struct, zipfile\nfrom pathlib import Path\n\nEXPECTED = {\n    \'main\': (\'7c463c12553bab2d98dd6d579d60af07\', [(29, 0x895edc, 0xf94007f4)]),\n    \'sdk\': (\'5bb30f7980902b19b8babdc891061ef2\', [(27, 0x34e5e8, 0xaa1303e0), (28, 0x34f480, 0x12002008)]),\n}\ndef check(ok, message):\n    if not ok: raise RuntimeError(\'Disco diagnostic verification failed: \' + message)\ndef table(text):\n    return [line.replace(\'\\\\t\', \'\\t\').split(\'\\t\') for line in text.splitlines()]\ndef branch(word, off):\n    check(word & 0xfc000000 == 0x14000000, \'expected unconditional branch at \' + hex(off))\n    imm = word & 0x3ffffff\n    if imm & 0x2000000: imm -= 0x4000000\n    return off + 4 * imm\n\ndef verify(ipa):\n    check(hashlib.sha256(Path(\'dm/host/hle_svc.c\').read_bytes()).hexdigest() == \'73c740e13d51ff95ae5ab1243c45125fc7b0de3a68f7c99fd0faabaa66dfb72b\', \'NX2Apple final host source drift\')\n    with zipfile.ZipFile(ipa) as z:\n        infos = [n for n in z.namelist() if re.fullmatch(r\'Payload/[^/]+\\.app/Info\\.plist\', n)]\n        check(len(infos) == 1, \'exactly one application required\')\n        base = infos[0].rsplit(\'/\', 1)[0] + \'/\'\n        info = plistlib.loads(z.read(infos[0]))\n        check(info.get(\'CFBundleShortVersionString\') == \'1.0.13\', \'requires Disco 1.0.13\')\n        check(info.get(\'CFBundleIdentifier\', \'\').lower() == \'org.nxnative.01006c5015e84000\', \'wrong title\')\n        check(info.get(\'DMCommit\') in (EXPECTED_STAMP, EXPECTED_STAMP+\'+dirty\'), \'wrong engine\')\n        executable = info.get(\'CFBundleExecutable\')\n        check(isinstance(executable, str) and \'/\' not in executable, \'invalid executable name\')\n        b = z.read(base + executable)\n        check(struct.unpack_from(\'<I\', b)[0] == 0xfeedfacf, \'expected thin 64-bit Mach-O\')\n        for marker in [b\'[disco-alloc-v1] ARMED\', b\'[disco-alloc-v1] RESERVE_FAIL\', b\'[disco-alloc-v1] METADATA_MAP_FAIL\', b\'[disco-alloc-v1] PROVIDER_ZERO\', b\'[disco-alloc-v1] TREE_SUMMARY\']:\n            check(marker in b, \'missing host callback marker \' + marker.decode())\n        for marker in (b\'[disco-va-fix-v1] CONFIGURED\', b\'[disco-va-fix-v1] ACTIVE\', b\'[disco-va-fix-v1] unsupported runtime memory layout\'):\n            check(marker in b, \'missing Disco virtual-address marker\')\n        sections = {}; p = 32\n        for _ in range(struct.unpack_from(\'<I\', b, 16)[0]):\n            cmd, size = struct.unpack_from(\'<II\', b, p)\n            check(size >= 8 and p + size <= len(b), \'bad load command\')\n            if cmd == 0x19:\n                count = struct.unpack_from(\'<I\', b, p + 64)[0]\n                for j in range(count):\n                    name, seg, va, n, fo = struct.unpack_from(\'<16s16sQQI\', b, p + 72 + j * 80)\n                    sections[seg.rstrip(b\'\\0\').decode(), name.rstrip(b\'\\0\').decode()] = (va, n, fo)\n            p += size\n        evidence = []\n        for mod, (bid, hooks) in EXPECTED.items():\n            fix = dict((r[0][2:], r[1]) for r in table(z.read(base+\'dm/\'+mod+\'.fixups.tsv\').decode()) if len(r) >= 2 and r[0].startswith(\'# \'))\n            check(fix.get(\'BUILD_ID\') == bid, \'wrong guest \' + mod + \' build\')\n            gates = table(z.read(base+\'dm/\'+mod+\'.gates.tsv\').decode())\n            x0 = sections[\'__TEXT\', \'__dm\'+mod+\'x0\']; x1 = sections[\'__TEXT\', \'__dm\'+mod+\'x1\']\n            patch = int(fix[\'PATCH_OFF\'], 0)\n            def word(a):\n                for lo, size, fo in [(0, x0[1], x0[2]), (patch, x1[1], x1[2])]:\n                    if lo <= a and a + 4 <= lo + size:\n                        return struct.unpack_from(\'<I\', b, fo + a - lo)[0]\n                raise RuntimeError(\'Diagnostic gate address outside executable sections\')\n            if mod == \'sdk\':\n                ids = {int(row[2], 0) & 255 for row in gates if len(row) == 4 and row[1] == \'obs\'}\n                check({22, 23, 24}.issubset(ids), \'missing existing SDK region gates\')\n            for oid, off, original in hooks:\n                matches = [row for row in gates if len(row) == 4 and row[1] == \'obs\' and int(row[2], 0) == oid and int(row[3], 0) == off]\n                check(len(matches) == 1, \'missing/duplicate gate \' + str(oid))\n                ret = int(matches[0][0], 0)\n                start = branch(word(off), off)\n                check(12 <= ret - start <= 128, \'gate entry/return mismatch\')\n                check(word(start) == 0xa9bf7bfd, \'gate must preserve x29/x30\')\n                check(word(ret) == 0xa8c17bfd, \'gate must restore x29/x30\')\n                check(word(ret + 4) == original, \'original instruction not preserved\')\n                check(branch(word(ret + 8), ret + 8) == off + 4, \'wrong gate continuation\')\n                evidence.append({\'module\': mod, \'id\': oid, \'offset\': hex(off), \'original_word\': hex(original)})\n        return {\'diagnostic\': \'disco-alloc-v1\', \'verified_packaged_hooks\': evidence,\n                \'executable_sha256\': hashlib.sha256(b).hexdigest(),\n                \'scope\': \'Packaging/instruction verification; not proof of device execution or gameplay.\'}\n\n'}
          rev=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          root=Path(os.environ['RUNNER_TEMP'])
          if rev==STANDARD:
              result={'status':'not-applied','engine':rev,'reason':'Standard engine unchanged; no Disco fix claimed'}
          else:
              if rev not in NX and rev!=LEGACY: raise SystemExit('Unknown engine at Disco verification')
              ns={'__name__':'combined_checker','EXPECTED_STAMP':rev[:12]}
              exec(compile(CHECKERS['legacy' if rev==LEGACY else 'nx'],'combined_checker','exec'),ns)
              result=ns['verify'](root/os.environ['IPA_FILENAME'])
              result['engine']=rev;result['status']='verified';result['scope']='Packaged exact guest hooks, fix markers and host source; not full-game validation'
          (root/'combined-disco-verification.json').write_text(json.dumps(result,indent=2)+'\n')
          print('Combined Disco verification:',result['status'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## Combined Disco integration test\n'+json.dumps(result)+'\n')
          PY_VERIFY_DISCO

