                      try:
                          names.append(strings[name_off:end].decode('utf-8'))
                      except UnicodeDecodeError as exc:
                          raise BuildError('invalid PFS0 name') from exc
                  return names


          '''
                  bt = bt.replace(anchor, helper + anchor, 1)
                  compile(bt, str(builder_py), 'exec')
                  builder_py.write_text(bt, encoding='utf-8')
                  print('Applied missing package-name helper (PFS0; other formats use normal extraction).')

          # 1. Fix iPad legacy renderer (nvn_mtl_legacy.inc) & OpenGL cursor lag (hle_gl.m):
