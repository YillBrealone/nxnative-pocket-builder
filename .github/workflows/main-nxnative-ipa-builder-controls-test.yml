         \'executable_sha256\':patch.sha(b),\'module_sha256\':patch.sha(image),\n                \'guarded_cleanup_verified\':True,\'fmod_error_reporting_verified\':True,\'sdk_diagnostic_probes_enabled\':False,\'allocation_errors_preserved\':True,\n                \'test_candidate\':True,\'device_validated\':False}\n\n\n# V3 host reservation test: this checks packaged policy presence and declared\n# SDK observation gate. Applying the cap at runtime still needs the device log.\nBOOT_MARKER = \'[golden-idol-reserve-v3] policy sdk-cap=0x40000000 target=main+0x46ed288; overall reservation unchanged\'\nAPPLY_MARKER = \'[golden-idol-reserve-v3] apply sdk-cap=0x40000000 requested=%#llx effective=%#llx instance=%#llx\'\n\ndef verify_reservation_policy(ipa):\n    with zipfile.ZipFile(ipa) as z:\n        infos=[n for n in z.namelist() if re.fullmatch(r\'Payload/[^/]+\\.app/Info\\.plist\',n)]\n        patch.require(len(infos)==1,\'reservation policy app identity\')\n        prefix=infos[0].rsplit(\'/\',1)[0]+\'/\'\n        info=plistlib.loads(z.read(infos[0]))\n        b=z.read(prefix+info[\'CFBundleExecutable\']);s=sections(b)\n        cs=s.get((b\'__TEXT\',b\'__cstring\'))\n        patch.require(cs and cs[2]+cs[1]<=len(b),\'host policy string section\')\n        strings=b[cs[2]:cs[2]+cs[1]]\n        for marker in [BOOT_MARKER,APPLY_MARKER]:\n            patch.require(marker.encode()+b\'\\0\' in strings,\'v3 compiled policy marker missing\')\n        obs=z.read(prefix+\'dm/sdk.obs.tsv\').decode()\n        patch.require(patch.parse_fixups(obs).get(\'BUILD_ID\')==patch.SDK_BUILD_ID,\'observer SDK identity\')\n        sd=s.get((b\'__TEXT\',b\'__dmsdkimg\'))\n        patch.require(sd and sd[2]+sd[1]<=len(b),\'observer SDK image\')\n        sdk=b[sd[2]:sd[2]+sd[1]];gates=[]\n        for line in obs.splitlines():\n            if not line or line.startswith(\'#\'):continue\n            fields=line.split(\'\\t\',3)\n            patch.require(len(fields)==4,\'observer table format\')\n            off,oid,original,why=fields\n            if int(oid,0)!=25:continue\n            patch.require(why.startswith(\'StandardAllocator::Initialize(\'),\'observer type 25 description\')\n            a=int(off,0)\n            patch.require(0<=a<0x601a40 and a%4==0,\'initialization observer code offset\')\n            w=patch.word(sdk,a)\n            patch.require(w&0xfc000000==0x14000000,\'initialization observation branch missing\')\n            target=patch.target(a,w)\n            patch.require(0xc20000<=target<len(sdk),\'initialization observation block bounds\')\n            gates.append(a)\n        patch.require(gates,\'SDK initialization observer 25 missing\')\n        return {\'reservation_policy_version\':3,\'sdk_cap_bytes\':0x40000000,\n                \'reservation_policy_present\':True,\'sdk_init_observation_sites\':gates,\n                \'runtime_cap_application_verified\':False,\'overall_reservation_changed\':False}\n\nverify_module = verify\ndef verify(ipa,report):\n    result=verify_module(ipa,report)\n    result.update(verify_reservation_policy(ipa))\n    return result\n\nif __name__==\'__main__\':\n    tmp=Path(os.environ[\'RUNNER_TEMP\'])\n    report=json.loads((tmp/\'golden-idol-audio-patch.json\').read_text())\n    result=verify(tmp/os.environ[\'IPA_FILENAME\'],report)\n    (tmp/\'golden-idol-audio-verification.json\').write_text(json.dumps(result,indent=2)+\'\\n\')\n    print(\'[golden-idol-integrated-v1] cleanup/error reporting and host reservation policy verified; runtime cap marker retained\')\n'}
