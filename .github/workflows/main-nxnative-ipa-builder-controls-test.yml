          files={'dm/ios/tools/golden_idol_audio.py':'"""Golden Idol Legacy integration: retained cleanup and error-only reporting.\nRuns before embedding/signing; never edits executable memory at runtime.\nNo allocation is faked, no guest error is changed to success, no memory limit changes.\n"""\nimport hashlib\nimport json\nimport os\nimport struct\nimport sys\nfrom pathlib import Path\n\nTITLE = \'010058702078C000\'\nENGINE = \'b5ac83de5c3c01ab30b3e0dbac8eaf32fe2f9b14\'\nBUILD_ID = \'9592d51a7ada503f475054506ba2fe3a\'\nTEXT_END = 0x32c7df8\nPATCH_OFF = 0x4760000\nMARKER = b\'[golden-idol-audio-v1] partial sound cleanup; allocation error preserved\\0\'\nGUARDS = {19914864: (1984, \'4634d0c9b0a2b8b6dffe7ca2fcaa855af246ac8058178ed21e6421dcd5db9326\'), 19864468: (308, \'9323b4083e65d8fd42df1fc21f31019238edcb67e158d8947f384e8d8c0ac91e\'), 19909016: (172, \'c7806d2c4ff579a1794173a4d23ab79cbb1aa61704b90612dc83a1062c1c32e5\'), 19634800: (1004, \'78061dd00938a992ebad57a0b87671223b7d85381ff89c5203481b0f452fb2b8\'), 20110000: (84, \'931db312cb804b0f120dbc7db81f0e3b409ec7c1ca83fe21bb01eaffdf3e8322\'), 20048768: (1136, \'2dec09d14096eb7f4b06a7bb7a6041fe3df763e7a740998f4a2f423916cb3bf8\'), 20109056: (8, \'2b59db05426e0f313d72b30f3398c65721de2562a59dc46ceeba224f98d0b876\'), 23765088: (16, \'13a80030d3978930edf3410b884e5e73abaea37aad51721498eb4d3a360c6727\')}\nSITES = {0x12fe09c: bytes.fromhex(\'156969f8\'),\n         0x131ebc4: bytes.fromhex(\'081140b9\'),\n         0x132d700: bytes.fromhex(\'e0031f2a\')}\nPUTS = 0x16aa060  # checked against this build\'s ELF JUMP_SLOT and PLT below\nPUTS_GOT = 0x42473b8\n\ndef require(ok, msg):\n    if not ok: raise RuntimeError(\'Golden Idol audio test: \' + msg)\n\ndef sha(b): return hashlib.sha256(b).hexdigest()\ndef word(b, p): return struct.unpack_from(\'<I\', b, p)[0]\ndef B(pc, dst, link=False):\n    d = dst-pc\n    require(d % 4 == 0 and -(1<<27) <= d < (1<<27), \'branch range\')\n    return (0x94000000 if link else 0x14000000) | ((d/