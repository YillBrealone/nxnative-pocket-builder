98b595aa21\')})\nSDK_BUILD_ID=\'f118ae1c2e7728471aaf1a0d58484968\'\nSDK_GUARD=(1235760, 1520, \'95cd0cdbc79703e423951a9b4d204cd34bbca05a90d514da4be291ad61c18987\')\ndef validate_sdk(image):\n    a,n,h=SDK_GUARD\n    require(sha(image[a:a+n])==h,\'reviewed SDK allocator code changed\')\n\ndef validate_original(image):\n    require(PATCH_OFF < len(image) < 0x7000000, \'unexpected image length\')\n    for a,(n,h) in GUARDS.items():\n        require(sha(image[a:a+n]) == h, \'reviewed code changed at \'+hex(a))\n    for a,b in SITES.items():require(image[a:a+4] == b, \'patch site changed at \'+hex(a))\n\ndef patch_bytes(original):\n    validate_original(original)\n    at=(len(original)+15)&~15\n    extra,sink=payload(at)\n    out=bytearray(original)+bytearray(at-len(original))+extra\n    updates={0x12fe09c:B(0x12fe09c,at),\n             0x131ebc4:0x52800048,  # mov w8,#2: enable FMOD errors only\n             0x132d700:B(0x132d700,sink)}\n    for a,w in updates.items():struct.pack_into(\'<I\',out,a,w)\n    report={\'schema\':1,\'title\':TITLE,\'engine\':ENGINE,\'build_id\':BUILD_ID,\n            \'before_sha256\':sha(original),\'after_sha256\':sha(out),\n            \'before_size\':len(original),\'after_size\':len(out),\'stub_offset\':at,\n            \'changes\':{hex(a):{\'before\':SITES[a].hex(),\'after\':struct.pack(\'<I\',w).hex()} for a,w in updates.items()},\n            \'scope\':\'partial-sound cleanup guard; original allocation error preserved; FMOD error-only output\',\n            \'device_validated\':False}\n    return bytes(out),report\n\ndef validate_patched(image, report):\n    require(report.get(\'schema\')==1 and report.get(\'title\')==TITLE and report.get(\'engine\')==ENGINE and report.get(\'build_id\')==BUILD_ID, \'receipt identity\')\n    require(len(image)==report[\'after_size\'] and sha(image)==report[\'after_sha256\'], \'patched image/evidence mismatch\')\n    n=report[\'before_size\'];at=report[\'stub_offset\']\n    require(PATCH_OFF<n<0x7000000 and at==(n+15)&~15, \'receipt length/offset\')\n    expected,sink=payload(at)\n    require(image[at:]==expected and not any(image[n:at]), \'stub/marker changed\')\n    require(word(image,0x12fe09c)==B(0x12fe09c,at), \'cleanup branch\')\n    require(word(image,0x131ebc4)==0x52800048, \'error-only filter\')\n    require(word(image,0x132d700)==B(0x132d700,sink), \'error sink branch\')\n    restored=bytearray(image[:n])\n    for a,b in SITES.items():restored[a:a+4]=b\n    require(sha(restored)==report[\'before_sha256\'], \'non-UI/non-audio bytes changed\')\n    validate_original(restored)\n    _,canonical=patch_bytes(restored)\n    require(report==canonical, \'noncanonical receipt\')\n\ndef parse_fixups(text):\n    return dict(line[2:].split() for line in text.splitlines() if line.startswith(\'# \'))\n\ndef apply(out, names):\n    require(os.environ.get(\'DETECTED_TITLE_ID\')==TITLE, \'unexpected workflow title\')\n    require(os.environ.get(\'ENGINE_REV\')==ENGINE, \'unexpected engine revision\')\n    if \'main\' not in names:return\n    root=Path(out);meta=parse_fixups((root/\'main.fixups.tsv\').read_text())\n    require(meta.get(\'BUILD_ID\')==BUILD_ID, \'unreviewed game build; no patch applied\')\n    require(int(meta[\'TEXT_END\'],0)==TEXT_END and int(meta[\'PATCH_OFF\'],0)==PATCH_OFF, \'unreviewed module layout\')\n    sdk_meta=parse_fixups((root/\'sdk.fixups.tsv\').read_text())\n    require(sdk_meta.get(\'BUILD_ID\')==SDK_BUILD_ID,\'unreviewed SDK build\')\n    validate_sdk((root/\'sdk.patched.bin\').read_bytes())\n    p=root/\'main.patched.bin\';receipt=root/\'golden-idol-audio.json\'\n    image=p.read_bytes()\n    if receipt.exists():\n        report=json.loads(receipt.read_text());validate_patched(image,report)\n    else:\n        image,report=patch_bytes(image)\n        validate_patched(image,report)\n        temp=p.with_suffix(\'.golden-tmp\');temp.write_bytes(image);temp.replace(p)\n        receipt.write_text(json.dumps(report,indent=2)+\'\\n\')\n    temp=Path(os.environ[\'RUNNER_TEMP\'])\n    (temp/\'golden-idol-audio-patch.json\').write_text(json.dumps(report,indent=2)+\'\\n\')\n    # stdout belongs exclusively to gen_embed\'s linker flags.\n    print(\'[golden-idol-integrated-v1] cleanup/error reporting embedded; SDK allocation diagnostic probes omitted\',file=sys.stderr,flush=True)\n','dm/ios/tools/verify_golden_idol_audio.py':'"""Fail-closed publication check for the Golden Idol Legacy test candidate."""\nimport json\nimport os\nimport plistlib\nimport re\nimport struct\nimport zipfile\nfrom pathlib import Path\nimport golden_idol_audio as patch\n\n\ndef sections(b):\n    patch.require(len(b)>=32 and struct.unpack_from(\'<I\',b)[0]==0xfeedfacf,\'expected thin Mach-O64\')\n    count,size=struct.unpack_from(\'<II\',b,16);p=32;end=32+size;out={}\n    patch.require(end<=len(b) and count<1000,\'Mach-O commands\')\n    for _ in range(count):\n        cmd,n=struct.unpack_from(\'<II\',b,p)\n        patch.require(n>=8 and p+n<=end,\'Mach-O command bounds\')\n        if cmd==0x19:\n            patch.require(n>=72,\'segment command\')\n            ns=struct.unpack_from(\'<I\',b,p+64)[0]\n            patch.require(72+ns*80<=n,\'section table\')\n            for j in range(ns):\n                sect,seg,va,sz,fo=struct.unpack_from(\'<16s16sQQI\',b,p+72+j*80)\n                key=(seg.rstrip(b\'\\0\'),sect.rstrip(b\'\\0\'))\n                patch.require(key not in out,\'duplicate section\')\n                out[key]=(va,sz,fo)\n        p+=n\n    patch.require(p==end,\'load command total\')\n    return out\n\ndef verify(ipa,report):\n    with zipfile.ZipFile(ipa) as z:\n        infos=[n for n in z.namelist() if re.fullmatch(r\'Payload/[^/]+\\.app/Info\\.plist\',n)]\n        patch.require(len(infos)==1,\'one app Info.plist required\')\n        prefix=infos[0].rsplit(\'/\',1)[0]+\'/\'\n        info=plistlib.loads(z.read(infos[0]))\n        patch.require(info.get(\'CFBundleIdentifier\',\'\').lower()==\'org.nxnative.\'+patch.TITLE.