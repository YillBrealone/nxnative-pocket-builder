name: NxNative - Controls Editor Test

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose engine (touch layout editors: NX2Apple and Legacy)"
        required: true
        type: choice
        default: "iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)"
        options:
          - "iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
          - "iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)"
      build_mode:
        description: "Build full IPA or run a fast 2-minute compatibility survey"
        required: true
        type: choice
        default: "Build IPA (Default)"
        options:
          - "Build IPA (Default)"
          - "Survey Only (Fast 2-min compatibility check)"
      romfs_mode:
        description: "Bundle game files inside IPA or use a separate RomFS"
        required: true
        type: choice
        default: "bundle (Full all-in-one IPA - Default)"
        options:
          - "bundle (Full all-in-one IPA - Default)"
          - "separate (IPA without bundled RomFS; size varies)"
      shader_cache:
        description: "Opt in to GitHub shader cache (may contain game-derived data accessible in a public repo)"
        required: false
        type: boolean
        default: false
      game_url:
        description: "Base Game (.nsp/.xci/.nsz/.xcz/.nup) Google Drive or direct HTTP link (blank = Game_URL secret)"
        required: false
        type: string
        default: ""
      update_url:
        description: "Update Google Drive or direct HTTP link (optional; leave blank if none)"
        required: false
        type: string
        default: ""
      dlc_url:
        description: "DLC Google Drive or direct HTTP link (optional; leave blank if none)"
        required: false
        type: string
        default: ""
      language:
        description: "Default game language (optional, e.g. en-US, ja, fr, es, zh-Hans; unlocked in Start Screen)"
        required: false
        type: string
        default: ""
      show_fps:
        description: "Enable FPS counter by default on Start Screen (stays unlocked in menu)"
        required: false
        type: boolean
        default: true
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 / iOS 27 SDK: nxnative main uses CMMotionManager.deviceMotionBody
    # (iOS 27); the macos-26 image tops out at Xcode 26.x and cannot compile it
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
      PYTHONHOME: ""
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Select and verify the reference Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_XCODE="27.1"
          PREFERRED="/Applications/Xcode_${EXPECTED_XCODE}.app/Contents/Developer"
          if [[ -d "$PREFERRED" ]]; then export DEVELOPER_DIR="$PREFERRED"; fi
          if [[ ! -d "${DEVELOPER_DIR:-/nonexistent}" ]]; then
            echo "::warning::Xcode ${EXPECTED_XCODE} is not on this runner image; using the default toolchain and continuing."
            unset DEVELOPER_DIR || true
            echo "TOOLCHAIN_FALLBACK=1" >> "$GITHUB_ENV"
          fi
          XCODE_VERSION="$(xcodebuild -version)"
          ACTUAL="${XCODE_VERSION%%$'\n'*}"
          if [[ "$ACTUAL" != "Xcode $EXPECTED_XCODE" ]]; then
            echo "::warning::Prepared for Xcode $EXPECTED_XCODE, runner selected $ACTUAL; continuing, but treat this build as off-reference."
            echo "TOOLCHAIN_FALLBACK=1" >> "$GITHUB_ENV"
          fi
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-$(xcode-select -p)}" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Free up runner disk space for large games
        shell: bash
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf \
            /Library/Frameworks/Mono.framework \
            /usr/local/share/android-sdk \
            /usr/local/lib/android \
            "$HOME/Library/Android" \
            "$HOME/.ghcup" \
            "$HOME/.rustup" \
            "$HOME/.cargo" \
            "$HOME/.gradle" \
            "$HOME/.m2" 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /
          FREE_KB="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$FREE_KB" =~ ^[0-9]+$ ]] && (( FREE_KB < 20000000 )); then
            echo "::warning::Less than about 20 GB is free before downloads. Large games may require much more space."
          fi

      - name: Checkout NX2Apple patched engine (Default)
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LNPANDY/NX2Apple
          persist-credentials: false
          # Audited for the experimental editor patch; main remains unpinned.
          ref: 4ab27a53ccb25545fc72dde841320ce5010c399d

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          persist-credentials: false
          ref: 20b59b6e59a9b8f060c19cd3894dacf4e5f4d68a

      - name: Checkout Metal 3 + BC fallback version (2020 iPad Pro / iPhone 15 or older)
        if: inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: widmonstertony/nxnative
          persist-credentials: false
          # Keep this renderer and its translator together, as in the main workflow.
          ref: b5ac83de5c3c01ab30b3e0dbac8eaf32fe2f9b14

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Sync NX2Apple engine patches
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        shell: bash
        run: |
          set -euo pipefail
          python tools/engine.py sync
          echo "NX2_ENGINE_REV=$(git -C engine rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NX2_UPSTREAM_PIN=$(tr -d '\r\n' < .upstream-ref)" >> "$GITHUB_ENV"
          for dir in dm scripts docs ref; do
            if [[ -e "engine/$dir" ]]; then
              rm -rf "$dir"
              cp -a "engine/$dir" "$dir"
            fi
          done
          rm -rf engine

      - name: Apply fs ReadFile EFAULT retry fix (v2)
        # LEGO Marvel Super Heroes spent all 8 retries of the engine's fs ReadFile EFAULT loop without
        # reading a byte ("prepared again at +0", then "failed at +0 (EFAULT)"); the SDK saw an fs error
        # and the guest crashed (main+0x270dd8 on A12Z, main+0x271850 on A19 Pro). v2 retries per stalled
        # offset, caps the attempts for one call, and returns the span zero-filled instead of failing the
        # read, so a permanently read-only page cannot abort the guest. Idempotent and self-verifying.
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dm/host/hle_fs.c ]]; then
            echo "::warning::No dm/host/hle_fs.c at this engine revision - this build does NOT carry the fs ReadFile retry fix."
            exit 0
          fi
          if grep -q "REPREP" dm/host/hle_fs.c; then echo "fs ReadFile retry fix (v2) already applied"; exit 0; fi
          python3 - dm/host/hle_fs.c <<'PYTHON'
          #!/usr/bin/env python3
          """Make fs ReadFile survive guest pages the graphics layer re-protects mid-read.

          dm/host/hle_fs.c reads into guest buffers with pread(). A destination page that
          the graphics layer (dm/gfx/nvn/nvn_dirty.c) write-protected after an upload makes
          pread() fail with EFAULT. The engine prepares the span and retries with a flat
          budget of 8 and nothing that makes progress:

              if (errno == EFAULT && reprep++ < 8) {

          LEGO Marvel Super Heroes (01006F600FFC8000) spends all 8 without reading a byte
          ("[fs] ... prepared again at +0", then "[RED] fs ReadFile ... failed at +0
          (EFAULT)"), the SDK sees an fs error and the guest crashes -- main+0x270dd8 on
          an A12Z iPad, main+0x271850 on an A19 Pro iPhone.

          What this script writes (all three matter):

            1. budget 8 -> 512 attempts per stalled offset, plus a 2048-attempt cap for
               one call so a pathological file cannot spin forever;
            2. the budget counts stalls per offset, so a long read that is re-protected
               repeatedly still finishes instead of spending the budget on progress;
            3. when the budget really runs out the read no longer fails the whole call:
               the diagnostic is logged (rate-limited), the unreadable tail is zero-filled
               and the call returns the full length. A wrong asset is recoverable; an fs
               error aborts the guest.

          The failure path stays honest: errno != EFAULT returns an error exactly as
          before, and the detailed VM-region diagnostic is still printed (first 4 cases).

          Every edit is brace-balanced and is checked before anything is written, because
          this file is compiled: an unbalanced edit fails the iOS build, it does not fail
          the patch step.

          Idempotent: the REPREP marker makes a second run a no-op. If the expected code
          is missing (a different engine revision) it exits non-zero rather than quietly
          building an unpatched engine.

          Usage: python3 hle_fs_readfile_retry.py dm/host/hle_fs.c [--skip-if-absent] [--strict]
          """
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          MARK = "REPREP"          # proves the patch is in
          BUDGET = 512             # attempts per stalled offset
          TOTAL_BUDGET = 2048      # attempts for one ReadFile call, across all offsets
          NOTES = 4                # detailed diagnostics printed per process

          DECL_ADDED = (
              "long reprep_at = -1, reprep_total = 0; unsigned reprep_notes = 0;   "
              "/* fs ReadFile EFAULT retry fix: stalled-offset retry state; see the comment at the EFAULT branch */"
          )

          RETRY_BLOCK = """if (errno == EFAULT) {   /* REPREP fs ReadFile EFAULT retry fix: the graphics layer re-protects guest pages after each
                                             upload, so retry until this offset stops advancing instead of a flat 8 times. LEGO Marvel Super
                                             Heroes spent all 8 with got still 0; the SDK then saw an fs error and the guest crashed. */
                          if ((long)got != reprep_at) { reprep = 0; reprep_at = (long)got; }   /* this read advanced: the budget is for stalls, not for the span's length */
                          if (reprep++ < %d && ++reprep_total < %d) {
                              dm_guest_write_prepare((uint8_t *)buf + got, sz - got); continue; }
                          if (reprep_notes++ < %d) {   /* the destination is not writable host memory: say where, with the protection of its VM region */
                              vm_address_t ra = (vm_address_t)((uint8_t *)buf + got); vm_size_t rs = 0; vm_region_basic_info_data_64_t vi; mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64; mach_port_t obj = MACH_PORT_NULL;
                              kern_return_t kr = vm_region_64(mach_task_self(), &ra, &rs, VM_REGION_BASIC_INFO_64, (vm_region_info_t)&vi, &cnt, &obj);
                              LOG("[RED] fs ReadFile into %%p+%%#zx failed at +%%#zx (EFAULT) after %%d retries: VM region %%#lx+%%#lx protection %%d%%s -- returning the span zero-filled",
                                  buf, sz, got, reprep - 1, (unsigned long)ra, (unsigned long)rs, kr == KERN_SUCCESS ? vi.protection : -1, kr == KERN_SUCCESS ? "" : " (none)"); }
                          else LOG("[RED] fs ReadFile into %%p+%%#zx: page at +%%#zx stayed read-only after %%d retries (zero-filled)", buf, sz, got, reprep - 1);
                          /* Hand the SDK the buffer it asked for instead of an fs error: a wrong asset is recoverable, an fs error aborts the guest. */
                          memset((uint8_t *)buf + got, 0, sz - got);   /* hand back the buffer the guest asked for */
                          got = sz;   /* a full-length read, so the SDK's must-read-in-full overload (h_fs_ReadFileExact) accepts it too */
                          break; }""" % (BUDGET, TOTAL_BUDGET, NOTES)


          def balance(text: str) -> int:
              return text.count("{") - text.count("}")


          def span_end(text: str, start: int) -> int:
              """Index just past the '}' that closes the block opened at/after start."""
              i = text.index("{", start)
              depth = 0
              while i < len(text):
                  c = text[i]
                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1
                  i += 1
              raise SystemExit("hle_fs_readfile_retry: unbalanced braces in the source file; refusing to edit it.")


          def transform(text: str) -> tuple[str, list[str]]:
              notes: list[str] = []
              if MARK in text:
                  return text, ["already patched (idempotent, nothing to do)"]

              before = balance(text)
              keeps = text.count('err_res("pread"')

              # 1. Retry state next to the existing counter.
              m = re.search(r"^(?P<indent>[ \t]*)(?P<decl>[^\n]*\bint reprep = 0\b[^\n]*)$", text, re.M)
              if not m:
                  raise SystemExit(
                      "hle_fs_readfile_retry: no 'int reprep = 0' declaration in h_fs_ReadFile.\n"
                      "This engine revision differs from the one this fix was written against.\n"
                      "Refusing to produce an unpatched build.")
              text = text[:m.end()] + "\n" + m.group("indent") + DECL_ADDED + text[m.end():]
              notes.append("declared retry state next to reprep")

              # 2. Replace the flat-budget retry with the converging one.
              start = re.search(r"if \(errno == EFAULT && reprep\+\+ < (?P<n>\d+)\) \{", text)
              if not start:
                  raise SystemExit(
                      "hle_fs_readfile_retry: no 'errno == EFAULT && reprep++ < N' retry block in h_fs_ReadFile.\n"
                      "Refusing to produce an unpatched build.")
              end = text.index("continue; }", start.end()) + len("continue; }")
              text = text[:start.start()] + RETRY_BLOCK + text[end:]
              notes.append("retry budget %s -> %d per stalled offset (cap %d per call); an unreadable span is now returned "
                           "zero-filled instead of failing the call" % (start.group("n"), BUDGET, TOTAL_BUDGET))

              # 3. The old failure log that followed the retry is now unreachable: drop it
              #    (its diagnostics live inside the new block).
              stale = text.find("if (errno == EFAULT) {", end)
              if stale >= 0:
                  stale_end = span_end(text, stale)
                  if "vm_region_64" not in text[stale:stale_end]:
                      raise SystemExit("hle_fs_readfile_retry: found an EFAULT branch this fix does not recognise; refusing to edit.")
                  stripped = text[stale_end:].lstrip()   # the branch is gone: drop its line's indentation too
                  # The line that followed (the generic pread error return) sits at the same depth
                  # as the branch above it; re-indent it there.
                  if stripped.startswith("return err_res"):
                      stripped = " " * 12 + stripped
                  head = text[:stale].rstrip(" \t")   # also drop the removed branch line's own indent
                  text = head + stripped
                  notes.append("removed the now-unreachable EFAULT failure log")

              # Post-conditions: this file is compiled, so a structurally wrong edit must stop here
              # rather than fail the iOS build an hour later.
              if balance(text) != before:
                  raise SystemExit("hle_fs_readfile_retry: brace balance changed; refusing to write a broken file.")
              if text.count('err_res("pread"') != keeps:
                  raise SystemExit("hle_fs_readfile_retry: the pread failure return was lost; refusing to write a broken file.")
              if text.count("{ \n") or "\n\n\n\n" in text:
                  raise SystemExit("hle_fs_readfile_retry: formatting damage detected; refusing to write a broken file.")
              return text, notes


          def main(argv: list[str]) -> int:
              args = [a for a in argv[1:] if not a.startswith("--")]
              if len(args) != 1:
                  print(__doc__)
                  return 2
              path = Path(args[0])
              if not path.is_file():
                  if "--skip-if-absent" in argv:
                      print("hle_fs_readfile_retry: SKIPPED - no %s at this engine revision, so this build does NOT carry the fs ReadFile retry fix" % path)
                      return 0
                  raise SystemExit("hle_fs_readfile_retry: %s does not exist. On the NX2Apple engine the source "
                                   "appears only after tools/engine.py sync, so this step must run after that." % path)
              original = path.read_text()
              patched, notes = transform(original)
              if patched == original:
                  for n in notes:
                      print("  %s" % n)
                  print("hle_fs_readfile_retry: %s already carries the fix" % path)
                  return 0
              path.write_text(patched)
              for n in notes:
                  print("  %s" % n)
              print("hle_fs_readfile_retry: patched %s" % path)
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv))
          PYTHON
          grep -q "REPREP" dm/host/hle_fs.c
          echo "fs ReadFile retry fix (v2) applied and verified (REPREP present)"

      - name: Apply experimental NX2Apple touch editor
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        shell: bash
        run: |
          set -euo pipefail
          # The editor originated in the contributor's MIT-licensed NX2Apple fork.
          # Pin both the fork revision and the patch bytes; do not fetch a moving branch.
          PATCH_FILE="$RUNNER_TEMP/nxnative-touch-editor.patch"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/bagasromadon/NX2Apple/ba882e3f571caef2f4f0f4f58c572f13d26ca6e4/patches/0056-ios-edit-the-touch-controls-from-the-in-game-men.patch" \
            -o "$PATCH_FILE"
          python - "$PATCH_FILE" <<'PYTHON'
          import hashlib, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          if hashlib.sha256(data).hexdigest() != 'ee64410e35249d930cf446126d0aa258efd92e2a45ec147218cbc4d3dd3daa21':
              raise SystemExit('Editor patch failed its SHA-256 check; no changes were applied.')
          PYTHON
          # Apply only the audited geometry, gamepad, and geometry-test files.
          # The friend's Swift menu/header hunks differ from this engine; the
          # declarations and our existing nested-menu entry are added separately.
          git apply --check --include='dm/ios/Sources/DmGamepad.m' \
            --include='dm/ios/Sources/DmPadGeometry.h' \
            --include='dm/ios/tests/pad_geometry/pad_geometry_check.m' "$PATCH_FILE"
          git apply --whitespace=nowarn --include='dm/ios/Sources/DmGamepad.m' \
            --include='dm/ios/Sources/DmPadGeometry.h' \
            --include='dm/ios/tests/pad_geometry/pad_geometry_check.m' "$PATCH_FILE"
          python - <<'PYTHON'
          from pathlib import Path
          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'Control editor: {label} did not match exactly once; refusing to build.')
              return text.replace(old, new, 1)
          header = Path('dm/ios/Sources/DmGameMenu.h')
          h = header.read_text(encoding='utf-8')
          h = once(h, 'void dm_pad_layout_set(int layout);', 'bool dm_pad_edit_offered(void);\nvoid dm_pad_edit_begin(void);\nvoid dm_pad_layout_set(int layout);', 'menu declarations')
          pad = Path('dm/ios/Sources/DmGamepad.m')
          p = pad.read_text(encoding='utf-8')
          # Keep the newer editor's single-line labels and adaptive card width,
          # but never reintroduce latching or turbo modes.
          p = once(p,
              '_modeSeg = [[UISegmentedControl alloc] initWithItems:@[@"Hold", @"Toggle", @"Turbo"]];',
              '_modeSeg = [[UISegmentedControl alloc] initWithItems:@[@"Hold"]];', 'macro options')
          p = once(p,
              '_modeSeg.selectedSegmentIndex = (mode >= DM_PAD_MACRO_HOLD && mode <= DM_PAD_MACRO_TURBO) ? mode : DM_PAD_MACRO_HOLD;',
              '_modeSeg.selectedSegmentIndex = DM_PAD_MACRO_HOLD;', 'macro selection')
          p = once(p, 'if (macroText && dm_pad_macros_parse(macroText.UTF8String, &m)) _macros = m;',
              'if (macroText && dm_pad_macros_parse(macroText.UTF8String, &m)) {\n        for (int set = 0; set < DM_PAD_SET_N; set++) for (int i = 0; i < DM_PAD_MACRO_MAX; i++) m.items[set][i].mode = DM_PAD_MACRO_HOLD;\n        _macros = m;\n    }', 'saved macro modes')
          p = once(p, 'm->mode = (mode >= DM_PAD_MACRO_HOLD && mode <= DM_PAD_MACRO_TURBO) ? mode : DM_PAD_MACRO_HOLD;',
              'm->mode = DM_PAD_MACRO_HOLD;', 'macro mode save')
          for required in ('edit_one_line', 'edit_capped_font', 'minimumUsableWidth', 'edit_flat_label'):
              if required not in p:
                  raise SystemExit('Control editor readability check failed: ' + required)
          if 'initWithItems:@[@"Hold", @"Toggle", @"Turbo"]' in p:
              raise SystemExit('Control editor must offer hold-only combinations.')
          header.write_text(h, encoding='utf-8')
          pad.write_text(p, encoding='utf-8')
          print('Editor source applied. Combination buttons are active only while held; tap-to-latch and turbo are not offered.')
          PYTHON
          rm -f "$PATCH_FILE"

      - name: Record engine revision and runner tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ENGINE_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WORKFLOW_REV=${GITHUB_WORKFLOW_SHA:-unknown}" >> "$GITHUB_ENV"
          echo "Selected repository commit: $(git rev-parse HEAD)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: "10.0.x"

      - name: Prepare isolated Python download cache
        id: python_cache_key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_CACHE'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import sysconfig

          # Same requirements as the existing installation, not newly chosen version pins.
          REQUIREMENTS = 'lz4\ncapstone>=5,<6\nfonttools\nbackports.zstd\ngdown\nnsz\nzbic\n'
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'nxnative-python-requirements.txt').write_text(REQUIREMENTS, encoding='utf-8')
          identity = {
              'schema': 1, 'requirements': REQUIREMENTS,
              'python': sys.version, 'pip': importlib.metadata.version('pip'),
              'platform': sysconfig.get_platform(), 'macos': platform.mac_ver()[0],
              'architecture': platform.machine(),
              'workflow_revision': os.environ.get('WORKFLOW_REV', 'unknown'),
          }
          key = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('key='+key+'\n')
          print('Prepared public Python-package download cache identity; installation and dependency checks still run.')
          PY_CACHE

      - name: Restore public Python package downloads
        id: python_download_cache
        if: vars.PYTHON_DOWNLOAD_CACHE != 'false'
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Share downloaded responses only, never locally compiled wheels.
          path: ${{ runner.temp }}/nxnative-python-download-cache/http-v2
          key: nxnative-pip-downloads-v1-${{ steps.python_cache_key.outputs.key }}

      - name: Install dependencies
        id: dependency_install
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/nxnative-python-download-cache
          PYTHON_DOWNLOAD_CACHE: ${{ vars.PYTHON_DOWNLOAD_CACHE }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        shell: bash
        run: |
          set -euo pipefail
          DEPENDENCY_START=$SECONDS
          BREW_PACKAGES=(xcodegen zstd spirv-cross unar glslang)
          for attempt in 1 2 3; do
            if brew install "${BREW_PACKAGES[@]}"; then break; fi
            if (( attempt == 3 )); then echo "::error::Homebrew could not install: ${BREW_PACKAGES[*]}"; exit 1; fi
            echo "::warning::Homebrew failed (attempt ${attempt}/3); retrying in $((attempt * 20))s."
            sleep $((attempt * 20))
          done
          PIP_ARGS=(-q -r "$RUNNER_TEMP/nxnative-python-requirements.txt")
          if [[ "$PYTHON_DOWNLOAD_CACHE" == "false" ]]; then
            PIP_ARGS+=(--no-cache-dir)
          fi
          if ! python -m pip install "${PIP_ARGS[@]}"; then
            echo "::warning::Python installation failed; retrying once without the download cache."
            python -m pip install --no-cache-dir "${PIP_ARGS[@]}"
          fi

          # Xcode 26/27 runners ship the Metal shader compiler
          # as a separate on-demand component; the build script requires
          # `xcrun -sdk iphoneos metal` to work.
