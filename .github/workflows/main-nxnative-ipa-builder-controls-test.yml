      - name: Report IPA identity, size, hash and RomFS requirements
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          ROMFS_INPUT: ${{ inputs.romfs_mode }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, plistlib, re, zipfile
          from pathlib import Path
          ipa = Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME']
          sha = hashlib.sha256()
          with ipa.open('rb') as f:
              for block in iter(lambda: f.read(4 * 1024 * 1024), b''):
                  sha.update(block)
          lines = ['## Built IPA', f'- File: `{ipa.name}`', f'- Size: {ipa.stat().st_size:,} bytes ({ipa.stat().st_size / 1e9:.2f} GB)', f'- SHA-256: `{sha.hexdigest()}`']
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("IPA_SHA256=" + sha.hexdigest() + "\n")
          try:
              with zipfile.ZipFile(ipa) as z:
                  prohibited = {'prod.keys', 'keys.txt'}
                  sensitive = [i.filename for i in z.infolist() if Path(i.filename).name.lower() in prohibited or Path(i.filename).suffix.lower() in {'.p12', '.pfx'}]
                  if sensitive:
                      raise SystemExit('IPA contains a file with a credential-like name. Publishing stopped; inspect the IPA locally before sharing.')
                  infos = [i for i in z.infolist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', i.filename) and i.file_size <= 1024 * 1024]
                  if len(infos) == 1:
                      info = plistlib.loads(z.read(infos[0]))
                      for key, label in [('CFBundleIdentifier', 'Bundle ID'), ('MinimumOSVersion', 'Minimum iOS'), ('DMCommit', 'IPA-reported engine commit'), ('DMChain', 'IPA-reported shader chain')]:
                          v = info.get(key)
                          if isinstance(v, (str, int, float)):
                              lines.append(f'- {label}: `{str(v).replace("`", "").replace(chr(10), " ").replace(chr(13), " ")}`')
                  # Decode the generated host settings, including JSON-escaped characters.
                  # This is a targeted audit, not a full game or runtime UI inspection.
                  han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
                  for entry in z.infolist():
                      if re.fullmatch(r'Payload/[^/]+\.app/dm/(?:p\d+/)?launcher\.json', entry.filename) and entry.file_size <= 2_000_000:
                          try:
                              settings = json.loads(z.read(entry).decode('utf-8'))
                          except (ValueError, UnicodeError):
                              raise SystemExit('Could not read generated launcher settings for the English UI audit; publishing stopped.')
                          if han.search(json.dumps(settings, ensure_ascii=False)):
                              raise SystemExit('Generated host launcher settings contain Han characters; publishing stopped for review. Game UI was not audited.')
                  names = [i.filename for i in z.infolist()]
                  bundled = any(re.match(r'Payload/[^/]+\.app/romfs(?:/|\.img$)', name, re.I) for name in names)
                  if os.environ.get('ROMFS_INPUT', '').startswith('separate'):
                      lines.append('- IPA contains a conventional bundled RomFS path.' if bundled else '- No conventional bundled RomFS path was found in the IPA (this is not a complete content audit).')
                      ids = [i for i in z.infolist() if re.fullmatch(r'Payload/[^/]+\.app/romfs\.id', i.filename, re.I) and i.file_size <= 4096]
                      if len(ids) == 1:
                          identity = z.read(ids[0]).decode('utf-8', 'replace').strip().replace('`', '').replace('\n', ' ').replace('\r', ' ')
                          lines.append(f'- RomFS identity recorded in IPA: `{identity}`')
                      else:
                          lines.append('- No unique RomFS identity was found in the IPA; check the engine build logs for requirements.')
                  else:
                      lines.append('- A conventional game-data path was found inside the IPA (not a complete content audit).' if bundled else '- A conventional game-data path was not found inside the IPA; check the build logs (not a complete content audit).')
          except (zipfile.BadZipFile, OSError, ValueError, plistlib.InvalidFileException) as e:
              raise SystemExit(f'Could not inspect IPA metadata ({type(e).__name__}); publishing stopped. Check the build logs.')
          if os.environ.get('ROMFS_INPUT', '').startswith('separate'):
              lines += ['- Separate mode: download the RomFS artifact from this run, extract it, and rename the image to `romfs.img`.', '- Place it in this game app’s Documents folder; the location depends on your sideloader. The image contains game data.']
          else:
              lines.append('- Bundle mode was requested; check build logs if the selected engine uses different packaging rules.')
          lines.append('')
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(text)
          PY

      - name: Publish temporary GoFile download page
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && vars.GOFILE_UPLOAD != 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os, re, subprocess, tempfile, time
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          output = Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME']
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          api = 'https://api.gofile.io'
          token = None
          folder = None
          expiry = None
          published = False

          # Never print the account token or raw API responses to the public job log.
          def call(method, path, body, credential=None):
              payload = json.dumps(body).encode('utf-8')
              headers = {'Content-Type': 'application/json'}
              if credential: headers['Authorization'] = 'Bearer ' + credential
              req = Request(api + path, data=payload, headers=headers, method=method)
              with urlopen(req, timeout=40) as response:
                  result = json.load(response)
              if result.get('status') != 'ok': raise RuntimeError('GoFile API rejected a request')
              return result.get('data', {})

          def valid_uuid(s):
              return isinstance(s, str) and re.fullmatch(r'[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}', s) is not None

          def set_expiry(when):
              data = call('PUT', '/contents/' + folder + '/update',
                          {'attribute': 'expiry', 'attributeValue': when}, token)
              if data.get('expire') != when: raise RuntimeError('GoFile did not confirm expiry')

          try:
              # The old anonymous upload also created a guest account per upload. Here it
              # is created first so the folder can expire BEFORE any file is uploaded.
              account = call('POST', '/accounts', {})
              token, root = account.get('token'), account.get('rootFolder')
              if not isinstance(token, str) or not token or '\n' in token or '\r' in token or not valid_uuid(root):
                  raise RuntimeError('GoFile guest account response was incomplete')
              created = call('POST', '/contents/createFolder',
                             {'parentFolderId': root, 'folderName': 'NxNative temporary IPA', 'public': True}, token)
              folder = created.get('id')
              if not valid_uuid(folder): raise RuntimeError('GoFile folder response was incomplete')
              expiry = int(time.time()) + 5 * 60 * 60
              set_expiry(expiry)  # fail closed: never upload into a folder without a confirmed expiry
              with tempfile.TemporaryDirectory(prefix='nx-gofile-', dir=os.environ['RUNNER_TEMP']) as tmp:
                  config = Path(tmp) / 'curl.conf'
                  response_path = Path(tmp) / 'response.json'
                  # Token is in a mode-0600 file, not the process arguments or console.
                  fd = os.open(config, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, 'w', encoding='utf-8') as f:
                      f.write('header = ' + json.dumps('Authorization: Bearer ' + token) + '\n')
                      f.write('form = ' + json.dumps('folderId=' + folder) + '\n')
                      f.write('form = ' + json.dumps('file=@' + str(output)) + '\n')
                  data = None
                  for endpoint in ('https://upload-ap-sgp.gofile.io/uploadfile', 'https://upload.gofile.io/uploadfile'):
                      response_path.unlink(missing_ok=True)
                      result = subprocess.run(['curl', '--silent', '--show-error', '--fail', '--connect-timeout', '30',
                                               '--max-time', '3600', '--config', str(config), '--output', str(response_path), endpoint],
                                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if result.returncode == 0 and response_path.is_file():
                          try:
                              candidate = json.loads(response_path.read_text(encoding='utf-8'))
                              d = candidate.get('data', {})
                              if candidate.get('status') == 'ok' and d.get('parentFolder') == folder:
                                  data = d; break
                          except (OSError, ValueError, TypeError, AttributeError): pass
                  if not data: raise RuntimeError('GoFile upload failed')
                  url = data.get('downloadPage', '')
                  parts = urlsplit(url)
                  if (parts.scheme != 'https' or parts.netloc != 'gofile.io' or parts.query or parts.fragment
                          or not re.fullmatch(r'/d/[A-Za-z0-9_-]{4,}', parts.path)):
                      raise RuntimeError('GoFile download page was invalid')
              # Prefer five hours from the completed upload; the earlier verified expiry
              # remains a safe upper bound if this refresh fails.
              try:
                  later_expiry = int(time.time()) + 5 * 60 * 60
                  set_expiry(later_expiry)
                  expiry = later_expiry
              except Exception:
                  print('::warning::Could not refresh GoFile expiry after upload; the earlier confirmed expiry still applies.')
              published = True
              when = time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime(expiry))
              print('GoFile download page:', url)
              with summary.open('a', encoding='utf-8') as f:
                  f.write('\n## Temporary GoFile IPA download\n')
                  f.write(f'- [Open the IPA download page]({url})\n')
                  f.write(f'- Folder expiry requested and confirmed by GoFile: {when} (about 5 hours).\n')
                  f.write('- Public until expiry; anyone with access may download and keep a copy. The GoFile page is not a guaranteed direct file URL.\n')
          except Exception:
              # Never print exceptions: a server response could contain a credential.
              print('::warning::GoFile upload or expiry setup failed; check the one-day GitHub IPA artifact instead.')
          finally:
              if not published and token and valid_uuid(folder):
                  try:
                      call('DELETE', '/contents', {'contentsId': folder}, token)
                  except Exception:
                      # If deletion fails, a previously confirmed folder expiry still applies.
                      print('::warning::GoFile cleanup could not be confirmed; any created folder may remain until its expiry.')
          PYTHON

      - name: Upload IPA
        id: ipa_artifact
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ runner.temp }}/${{ env.IPA_FILENAME }}
          archive: false   # v7: upload the one IPA as-is, no zip pass over 5+ GB
          if-no-files-found: error
          retention-days: 1

      - name: Report IPA artifact fallback
        if: always() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && steps.ipa_artifact.outcome != 'skipped'
        env:
          ARTIFACT_OUTCOME: ${{ steps.ipa_artifact.outcome }}
          ARTIFACT_URL: ${{ steps.ipa_artifact.outputs.artifact-url }}
        shell: bash
        run: |
          if [[ "$ARTIFACT_OUTCOME" == "success" && -n "$ARTIFACT_URL" ]]; then
            echo "## GitHub artifact fallback" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Download the IPA artifact]($ARTIFACT_URL) (retained for 1 day; sign in with access to this repository)." >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "${IPA_SHA256:-}" ]]; then
              echo "- SHA-256: \`$IPA_SHA256\` (must match the hash above; a different value means the file changed in transit)." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::IPA artifact upload failed. Check its step log."
            echo "IPA artifact upload failed; check the upload step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare redacted build logs
        if: always()
        env:
          INPUT_GAME_URL: ${{ inputs.game_url }}
          INPUT_UPDATE_URL: ${{ inputs.update_url }}
          INPUT_DLC_URL: ${{ inputs.dlc_url }}
          SECRET_GAME_URL: ${{ secrets.Game_URL }}
          SECRET_UPDATE_URL: ${{ secrets.Update_URL }}
          SECRET_DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os, re
          from pathlib import Path
          from urllib.parse import parse_qsl, unquote, urlsplit
          root = Path(os.environ['RUNNER_TEMP'])
          game = root / 'GameFiles'
          out = root / 'nxnative-redacted-logs'
          out.mkdir(parents=True, exist_ok=True)
          sensitive = set()
          for name in ('INPUT_GAME_URL', 'INPUT_UPDATE_URL', 'INPUT_DLC_URL', 'SECRET_GAME_URL', 'SECRET_UPDATE_URL', 'SECRET_DLC_URL', 'KEYS_URL'):
              value = os.environ.get(name, '').strip()
              for token in re.split(r'[\s,;]+', value):
                  if len(token) >= 6:
                      sensitive.add(token)
                      sensitive.add(unquote(token))
                      try:
                          parts = urlsplit(token)
                      except ValueError:
                          continue
                      for _, val in parse_qsl(parts.query):
                          if len(val) >= 6: sensitive.add(val)
                      for part in parts.path.split('/'):
                          if re.fullmatch(r'[-A-Za-z0-9_]{20,}', part): sensitive.add(part)
          keyfile = root / 'nxnative' / 'prod.keys'
          key_names = set()
          if keyfile.is_file() and keyfile.stat().st_size <= 2_000_000:
              for line in keyfile.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' in line:
                      name, value = line.split('=', 1)
                      if re.fullmatch(r'[A-Za-z0-9_]+', name.strip()): key_names.add(name.strip())
                      value = value.strip()
                      if len(value) >= 6: sensitive.add(value)
                      sensitive.update(re.findall(r'(?i)\b[0-9a-f]{16,}\b', value))
          values = sorted((s for s in sensitive if len(s) >= 6), key=len, reverse=True)
          key_pattern = re.compile(r'(?<![A-Za-z0-9_])(?:' + '|'.join(re.escape(k) for k in key_names) + r')(?![A-Za-z0-9_])', re.I) if key_names else None
          count = 0
          if game.is_dir():
              for folder in list(game.glob('*_build/logs')) + list(game.glob('*_survey')):
                  if not folder.is_dir() or folder.is_symlink(): continue
                  for p in folder.rglob('*'):
                      if not p.is_file() or p.is_symlink() or p.suffix.lower() not in {'.log', '.txt', '.md'} or p.stat().st_size > 25_000_000:
                          continue
                      text = p.read_text(encoding='utf-8', errors='replace')
                      for value in values: text = text.replace(value, '[REDACTED]')
                      text = re.sub(r'https?://[^\s<>"\']+', '[REDACTED URL]', text, flags=re.I)
                      if key_pattern:
                          text = '\n'.join('[REDACTED KEY LINE]' if key_pattern.search(line) else line for line in text.split('\n'))
                      # Avoid copying original paths or filenames, which may themselves
                      # contain private links, account names or other sensitive data.
                      label = 'build_ipa' if p.name == 'build_ipa.log' else 'log'
                      target = out / f'{count + 1:03d}-{label}{p.suffix.lower()}'
                      target.write_text(text, encoding='utf-8')
                      count += 1
          print(f'Prepared {count} text log(s) with best-effort redaction; binary and oversized files were skipped.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\nBuild-log artifacts use best-effort redaction. Review them before sharing; no automatic redactor can guarantee removal of all sensitive data.\n')
          PYTHON

      - name: Upload redacted build logs if available
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NxNative-Build-Logs
          path: ${{ runner.temp }}/nxnative-redacted-logs/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload version-only build environment
        if: always() && steps.build_environment.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NxNative-Build-Environment
          path: |
            ${{ runner.temp }}/nxnative-build-environment.json
            ${{ runner.temp }}/nxnative-python-requirements.txt
            ${{ runner.temp }}/nxnative-python-constraints-candidate.txt
            ${{ runner.temp }}/nxnative-build-metrics.json
          if-no-files-found: warn
          retention-days: 1

      - name: Report failure troubleshooting
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build troubleshooting"
            echo "Open the failed step in this run for its error message."
            echo "If available, download the NxNative-Build-Logs artifact for the detailed build log."
            echo "Do not share prod.keys, private links, game files or unredacted sensitive logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles" \
            "$RUNNER_TEMP/nxnative-redacted-logs" \
            "$RUNNER_TEMP/nxnative-build-environment.json" \
            "$RUNNER_TEMP/nxnative-python-requirements.txt" \
            "$RUNNER_TEMP/nxnative-python-constraints-candidate.txt" \
            "$RUNNER_TEMP/nxnative-build-metrics.json"
