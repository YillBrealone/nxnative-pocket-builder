          - (NSString *)currentSettingValue:(NSString *)env def:(NSString *)def {
              const char *c = getenv(env.UTF8String);
              if (c && *c) return [NSString stringWithUTF8String:c];
              NSString *saved = [NSUserDefaults.standardUserDefaults stringForKey:[@"launcher." stringByAppendingString:env]];
              return saved.length ? saved : def;
          }
          - (UIMenuElement *)menuRowForEnv:(NSString *)env label:(NSString *)label kind:(NSString *)kind def:(NSString *)def options:(NSArray<NSArray<NSString *> *> *)options onVal:(NSString *)onVal offVal:(NSString *)offVal {
              NSString *now = [self currentSettingValue:env def:def];
              NSSet<NSString *> *liveRows = [NSSet setWithArray:@[@"DM_ASPECT_MODE", @"DM_OPMODE", @"DM_SHOW_FPS", @"DM_METAL_HUD", @"DM_TOUCH_SIZE", @"DM_TOUCH_STICK", @"DM_PAD_MAP", @"DM_PAD_MERGE", @"DM_TOUCH_HAPTICS", @"DM_RUMBLE"]];
              NSString *menuLabel = [liveRows containsObject:env] ? label : [label stringByAppendingString:@" (Next launch)"];
              if ([kind isEqualToString:@"toggle"]) {
                  NSString *onV = onVal.length ? onVal : @"1", *offV = offVal.length ? offVal : @"0";
                  BOOL isOn = [now isEqualToString:onV];
                  UIAction *act = [UIAction actionWithTitle:menuLabel image:nil identifier:nil handler:^(__kindof UIAction *a) {
                      (void)a;
                      dm_apply_setting_live(env.UTF8String, (isOn ? offV : onV).UTF8String);
                  }];
                  act.state = isOn ? UIMenuElementStateOn : UIMenuElementStateOff;
                  return act;
              }
              NSMutableArray<UIAction *> *acts = [NSMutableArray array];
              NSString *curTitle = now;
              for (NSArray<NSString *> *opt in options) {
                  if (opt.count < 2) continue;
                  NSString *v = opt[0], *t = opt[1];
                  BOOL sel = [v isEqualToString:now] || (v.doubleValue > 0 && fabs(v.doubleValue - now.doubleValue) < 1e-4);
                  if (sel) curTitle = t;
                  UIAction *act = [UIAction actionWithTitle:t image:nil identifier:nil handler:^(__kindof UIAction *a) {
                      (void)a;
                      dm_apply_setting_live(env.UTF8String, v.UTF8String);
                  }];
                  act.state = sel ? UIMenuElementStateOn : UIMenuElementStateOff;
                  [acts addObject:act];
              }
              return [UIMenu menuWithTitle:[NSString stringWithFormat:@"%@ (%@)", menuLabel, curTitle] image:nil identifier:nil options:UIMenuOptionsSingleSelection children:acts];
          }
          - (NSArray<UIMenuElement *> *)buildTopMenuElements {
              __weak DmGamepad *weakSelf = self;
              int curL = _tap ? 2 : _full ? 1 : 0;
              NSArray<NSString *> *lNames = @[
                  @"2D Controls (Simple)",
                  @"3D Controls (Full)",
                  @"Tap (Touchscreen)"
              ];
              NSMutableArray<UIAction *> *lActs = [NSMutableArray array];
              for (int l = 0; l < 3; l++) {
                  UIAction *a = [UIAction actionWithTitle:lNames[l] image:nil identifier:nil handler:^(__kindof UIAction *act) {
                      (void)act; [weakSelf setPadLayoutMode:l];
                  }];
                  if (l == 2 && dm_opmode() != 0) a.attributes = UIMenuElementAttributesDisabled;
                  a.state = (curL == l) ? UIMenuElementStateOn : UIMenuElementStateOff;
                  [lActs addObject:a];
              }
              UIMenu *layoutInline = [UIMenu menuWithTitle:@"Control Mode" image:nil identifier:nil options:UIMenuOptionsSingleSelection children:lActs];

              NSArray<NSArray<NSString *> *> *aspectOpts = @[
                  @[@"16:9", @"16:9 (Default Widescreen)"],
                  @[@"fill", @"Fill Screen (Full iPad Display)"],
                  @[@"16:10", @"16:10 (Widescreen)"],
                  @[@"4:3", @"4:3 (Retro / Classic)"],
                  @[@"21:9", @"21:9 (Ultrawide)"]
              ];
              UIMenuElement *aspectMenu = [self menuRowForEnv:@"DM_ASPECT_MODE" label:@"Aspect Ratio" kind:@"choice" def:@"16:9" options:aspectOpts onVal:nil offVal:nil];

              NSMutableArray<UIMenuElement *> *displayRows = [NSMutableArray arrayWithObject:aspectMenu];
              NSMutableArray<UIMenuElement *> *ctrlRows = [NSMutableArray array];
              NSMutableArray<UIMenuElement *> *perfRows = [NSMutableArray array];
              NSMutableArray<UIMenuElement *> *otherRows = [NSMutableArray array];
              NSSet<NSString *> *displayKeys = [NSSet setWithArray:@[@"DM_ASPECT_MODE", @"DM_RENDER_SCALE", @"DM_DYNAMIC_RESOLUTION", @"DM_PRESENT_UPSCALE", @"DM_UPSCALER", @"DM_PICTURE_FIT", @"DM_SCREEN_ASPECT", @"DM_FULLSCREEN"]];
              NSSet<NSString *> *perfKeys = [NSSet setWithArray:@[@"DM_FPS_TARGET", @"DM_NFS_FPS", @"DM_ARCEUS_FPS", @"DM_FRAMEGEN", @"DM_SHOW_FPS"]];
              NSMutableSet<NSString *> *seen = [NSMutableSet setWithObject:@"DM_ASPECT_MODE"];

              NSURL *jsonURL = [NSBundle.mainBundle.resourceURL URLByAppendingPathComponent:@"dm/launcher.json"];
              NSData *data = jsonURL ? [NSData dataWithContentsOfURL:jsonURL] : nil;
              NSDictionary *json = data ? [NSJSONSerialization JSONObjectWithData:data options:0 error:nil] : nil;
              NSArray *settings = [json[@"settings"] isKindOfClass:NSArray.class] ? json[@"settings"] : @[];

              for (NSDictionary *s in settings) {
                  if (![s isKindOfClass:NSDictionary.class]) continue;
                  NSString *env = s[@"env"], *kind = s[@"kind"], *label = s[@"label"], *def = s[@"default"] ?: @"";
                  NSString *sec = s[@"section"] ?: @"Game";
                  if (!env.length || !kind.length || !label.length || [seen containsObject:env]) continue;
                  [seen addObject:env];
                  UIMenuElement *el = nil;
                  if ([kind isEqualToString:@"toggle"]) {
                      NSString *onV = s[@"on"] ?: @"1", *offV = s[@"off"] ?: @"0";
                      el = [self menuRowForEnv:env label:label kind:@"toggle" def:def options:nil onVal:onV offVal:offV];
                  } else if ([kind isEqualToString:@"choice"]) {
                      NSArray *opts = [s[@"options"] isKindOfClass:NSArray.class] ? s[@"options"] : @[];
                      el = [self menuRowForEnv:env label:label kind:@"choice" def:def options:opts onVal:nil offVal:nil];
                  } else if ([kind isEqualToString:@"range"]) {
                      double lo = [s[@"min"] doubleValue], hi = [s[@"max"] doubleValue], st = [s[@"step"] doubleValue];
                      if (st <= 0) st = 0.1;
                      NSMutableArray<NSArray<NSString *> *> *rOpts = [NSMutableArray array];
                      for (double v = lo; v <= hi + 1e-6; v += st) {
                          int pct = (int)llround(v * 100.0);
                          if ([env isEqualToString:@"DM_RENDER_SCALE"] && (pct % 10 != 0 && pct != 75)) continue;
                          if ([env isEqualToString:@"DM_RUMBLE_GAIN"] && (pct % 50 != 0)) continue;
                          [rOpts addObject:@[[NSString stringWithFormat:@"%g", v], [NSString stringWithFormat:@"%d%%", pct]]];
                      }
                      el = [self menuRowForEnv:env label:label kind:@"choice" def:def options:rOpts onVal:nil offVal:nil];
                  }
                  if (!el) continue;
                  if ([displayKeys containsObject:env]) [displayRows addObject:el];
                  else if ([sec isEqualToString:@"Controls"]) [ctrlRows addObject:el];
                  else if ([perfKeys containsObject:env] || [sec isEqualToString:@"Performance"]) [perfRows addObject:el];
                  else [otherRows addObject:el];
              }

              UIAction *openSheet = [UIAction actionWithTitle:@"More Settings & Cloud Saves…" image:[UIImage systemImageNamed:@"slider.horizontal.3"] identifier:nil handler:^(__kindof UIAction *a) {
                  (void)a; dm_open_settings_sheet();
              }];
              [otherRows addObject:openSheet];
              NSMutableArray<UIMenuElement *> *menus = [NSMutableArray arrayWithObject:layoutInline];
              NSArray<NSArray<UIMenuElement *> *> *groups = @[displayRows, ctrlRows, perfRows, otherRows];
              NSArray<NSString *> *titles = @[@"Display", @"Controls", @"Performance", @"Other Settings"];
              for (NSUInteger i = 0; i < groups.count; i++) {
                  NSArray<UIMenuElement *> *rows = groups[i];
                  if (!rows.count) {
                      UIAction *none = [UIAction actionWithTitle:@"No settings available" image:nil identifier:nil handler:^(__kindof UIAction *a) { (void)a; }];
                      none.attributes = UIMenuElementAttributesDisabled;
                      rows = @[none];
                  }
                  [menus addObject:[UIMenu menuWithTitle:titles[i] image:nil identifier:nil options:0 children:rows]];
              }
              return menus;
          }
          - (UIMenu *)buildTopNativeMenu {
              __weak DmGamepad *weakSelf = self;
              UIDeferredMenuElement *deferred = [UIDeferredMenuElement elementWithUncachedProvider:^(void (^completion)(NSArray<UIMenuElement *> *)) {
                  completion(weakSelf ? [weakSelf buildTopMenuElements] : @[]);
              }];
              return [UIMenu menuWithTitle:@"" children:@[deferred]];
          }
