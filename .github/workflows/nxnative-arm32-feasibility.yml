# Replace ONLY .github/workflows/nxnative-arm32-feasibility.yml (v2 -> v3).
# Retains its display name. Does not use or modify normal game workflows.
# No game input, secrets, runtime JIT, or changes to architecture rejection guards.
name: NxNative - ARM32 Feasibility

on:
  workflow_dispatch:

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHONNOUSERSITE: '1'

jobs:
  smoke:
    name: Build interpreter and translated ARM32 test IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Stage verified harness payload 1
        shell: bash
        run: |
          cat > .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 2
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 3
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 4
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 5
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 6
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 7
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 8
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 9
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 10
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 11
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 12
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 13
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Stage verified harness payload 14
        shell: bash
        run: |
          cat >> .arm32-harness.b64 <<'PAYLOAD'
          
          PAYLOAD
      - name: Extract and verify v3 harness
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('.arm32-harness.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='c5b8140049debf3fb6b1a6fad6e53a1a7f8fe39751b0c7527183ad91c9ed6aa5'
          files=json.loads(raw)
          assert set(files)==set(['src/arm32_smoke.h', 'src/arm32_smoke.c', 'src/host_main.c', 'src/host_safety.c', 'src/main.m', 'src/translated_tests.c', 'build_ios.sh', 'THIRD-PARTY-NOTICES.txt', 'codegen/Codegen.csproj', 'codegen/Program.cs', 'codegen/fixtures.json', 'codegen/approved-code.json', 'codegen/source-lock.json', 'codegen/Directory.Build.targets', 'codegen/RYUJINX-LICENSE.txt', 'codegen/NuGet.Config', 'codegen/fetch_sources.py', 'codegen/package_fixtures.py', 'codegen/test_translation.py', 'codegen/build_codegen.sh', 'src/v3_runtime.h', 'src/v3_runtime.c', 'src/v3_tests.c', 'codegen/v3-fixtures.json', 'codegen/v3-approved-code.json', 'codegen/v3-cases.json', 'codegen/package_v3.py', 'codegen/test_v3.py', 'codegen/elf_test_link.py', 'codegen/test_v3_guards.py', 'codegen/locks/Codegen.json', 'codegen/locks/ARMeilleure.json', 'codegen/locks/Ryujinx.Memory.json', 'codegen/locks/Ryujinx.Common.json'])
          for name,entry in files.items():
              data=base64.b64decode(entry['base64'],validate=True)
              assert hashlib.sha256(data).hexdigest()==entry['sha256'],name
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Verified and extracted 34 harness/source-lock files. Upstream compiler source fetched separately at a fixed commit.')
          PY

      - name: Set up build-time .NET compiler
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.100'

      - name: Set up host verification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install pinned host-only verification tools
        shell: bash
        run: |
          python3 -m pip install unicorn==2.1.4 capstone==5.0.7 pyelftools==0.32

      - name: Translate synthetic ARM and Thumb fixtures using pinned upstream code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash codegen/build_codegen.sh 2>&1 | tee artifacts/codegen.log

      - name: Original checks and arm64 iOS app build
        shell: bash
        run: |
          set -euo pipefail
          bash build_ios.sh 2>&1 | tee artifacts/build.log

      - name: Upload feasibility IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ARM32-Smoke-IPA
          path: artifacts/ARM32-Feasibility-v3.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports even if build fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ARM32-Smoke-Build-Report
          path: |
            artifacts/*.txt
            artifacts/*.json
            artifacts/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Next steps and limits
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ARM32 feasibility v3 — translated memory and calls
          - Uses pinned S2Arm/Ryujinx LightningJit source to compile **20 synthetic functions during the build**, with review-locked v3 adapters.
          - Memory checks are preflight for fixed-offset fixtures, not a general MMU. Dispatch is a closed allowlist.
          - Generated ARM64 is statically linked into executable TEXT, not executed from writable data.
          - No game loader, .NET runtime, runtime JIT or CPU emulation library is bundled in the IPA.
          - This does **not** enable Rune Factory or general 32-bit Switch support.
          - Extract **ARM32-Smoke-IPA**, import the ad-hoc-signed IPA through Strata, then open ARM32 Smoke.
          - Expected: interpreter **20/20**, baseline translation **10/10**, new memory/call checks **18/18**, total **48/48**.
          - Tap **Share report** and send arm32-smoke-report.txt plus the device model/launch method.
          - If compilation fails, send ARM32-Smoke-Build-Report. If import fails, send the exact Strata error.
          - V2 has a reported A12Z device pass. The NEW v3 Apple build and physical-device test still need validation.
          EOF
