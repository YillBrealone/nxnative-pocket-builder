      - name: Verify payload and run synthetic preflight tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          raw=zlib.decompress(base64.b64decode((root/'arm32-inventory-payload.b64').read_bytes(),validate=False))
          assert hashlib.sha256(raw).hexdigest() == '10a11354bc92eb9377adbe262edf923fc18149e7d183297c37cd71f640d1f1cf'
          files=json.loads(raw)
          assert set(files) == set(['inventory.py', 'requirements.txt', 'run_inventory.py', 'test_inventory.py'])
          dst=root/'arm32-inventory-tools';dst.mkdir(exist_ok=True)
          for name,text in files.items():
              assert Path(name).name==name and name not in ('.','..')
              (dst/name).write_text(text)
          print('Verified and staged',len(files),'inventory inputs.')
          PYTHON
          python -m pip install -r "$RUNNER_TEMP/arm32-inventory-tools/requirements.txt"
          python "$RUNNER_TEMP/arm32-inventory-tools/test_inventory.py"
      - name: Inventory supplied game without rewriting or executing it
        env:
          INPUT_GAME_URL: ${{ inputs.game_url }}
          INPUT_UPDATE_URL: ${{ inputs.update_url }}
          SECRET_GAME_URL: ${{ secrets.Game_URL }}
          SECRET_UPDATE_URL: ${{ secrets.Update_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
          EXPECTED_TITLE: '010051D00E3A4000'
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DETAIL_ARTIFACT: ${{ inputs.detail_artifact }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ENGINE_DIR: ${{ github.workspace }}/inventory-engine
          PRIVATE_WORK: ${{ runner.temp }}/arm32-inventory-private
          REPORT_DIR: ${{ runner.temp }}/arm32-inventory-report
          DETAIL_DIR: ${{ runner.temp }}/arm32-inventory-details
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python "$RUNNER_TEMP/arm32-inventory-tools/run_inventory.py"
      - name: Publish redacted job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arm32-inventory-report"
          REPORT="$RUNNER_TEMP/arm32-inventory-report/SUMMARY.md"
          if [[ ! -f "$REPORT" ]]; then
            printf '%s\n' '# ARM32 inventory did not complete' '' 'Setup, preflight or execution was interrupted. No successful game inventory is claimed.' '' 'Next: check the failed stage; do not disable the normal ARM32 guard.' > "$REPORT"
          fi
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted metadata only (including partial/failure reports)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ARM32-Game-Inventory-Report
          path: |
            ${{ runner.temp }}/arm32-inventory-report/SUMMARY.md
            ${{ runner.temp }}/arm32-inventory-report/inventory.json
          if-no-files-found: warn
          retention-days: 3
      - name: Upload optional private import metadata
        if: always() && inputs.detail_artifact && github.event.repository.private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ARM32-Game-Inventory-Private-Details
          path: ${{ runner.temp }}/arm32-inventory-details/inventory-private.json
          if-no-files-found: warn
          retention-days: 1
      - name: Remove private game files, keys and extraction logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Exact job-owned directories only. No repository files or normal builders are changed.
          rm -rf -- "$RUNNER_TEMP/arm32-inventory-private" "$RUNNER_TEMP/arm32-inventory-details"
          rm -f -- "$RUNNER_TEMP/arm32-inventory-payload.b64"
