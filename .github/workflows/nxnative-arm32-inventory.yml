# REPLACE ONLY .github/workflows/nxnative-arm32-inventory.yml (inventory v1 -> v2).
# v2 adds partial metadata retention and numeric GNU-hash diagnostics; no validation bypass.
# Independent metadata-only job. Does NOT replace either normal builder or the v6 workflow.
# No raw game code, keys, URLs, extraction logs, RomFS or IPA in the default artifact.
name: NxNative - ARM32 Game Inventory

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Base NSP/XCI: HTTPS or Drive file (blank uses Game_URL secret)'
        required: false
        type: string
        default: ''
      update_url:
        description: 'Update NSP/XCI (popup base uses popup update ONLY; otherwise Update_URL secret)'
        required: false
        type: string
        default: ''
      expected_version:
        description: 'Expected effective CNMT version (Rune Factory supplied update = 65536; base only = 0)'
        required: true
        type: string
        default: '65536'
      detail_artifact:
        description: 'Include literal import names in a separate artifact (PRIVATE repositories only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  inventory:
    name: Read-only Rune Factory ARM32 module inventory (no IPA)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out pinned extraction tooling only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seedds/nxnative
          ref: 94a0944755da1a443f42651bf7ee49ab24ed5ee5
          path: inventory-engine
          persist-credentials: false
          sparse-checkout: |
            dm/tools/nx_extract
            dm/tools/nx_extract_bin
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Stage inventory payload 1
