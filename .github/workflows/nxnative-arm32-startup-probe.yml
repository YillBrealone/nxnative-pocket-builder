      - name: Verify payload and run inventory plus CPU-reference tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          raw=zlib.decompress(base64.b64decode((root/'arm32-startup-payload.b64').read_bytes()))
          assert hashlib.sha256(raw).hexdigest() == '5add9844bf39f67ace0d18b5a684ef689f83472a48bd47ac7f5226fe2ed419ed'
          files=json.loads(raw)
          assert set(files)==set(['input_lock.json', 'inventory.py', 'requirements.txt', 'return_synthetic_code.json', 'run_inventory.py', 'run_probe.py', 'startup_probe.py', 'synthetic_code.json', 'test_inventory.py', 'test_probe.py', 'test_returns.py'])
          dst=root/'arm32-startup-tools';dst.mkdir(exist_ok=True)
          for name,text in files.items():
              assert Path(name).name==name and name not in ('.','..')
              (dst/name).write_text(text)
          print('Verified and staged',len(files),'startup reference inputs.')
          PYTHON
          python -m pip install -r "$RUNNER_TEMP/arm32-startup-tools/requirements.txt"
          python "$RUNNER_TEMP/arm32-startup-tools/test_inventory.py"
          python "$RUNNER_TEMP/arm32-startup-tools/test_probe.py"
          python "$RUNNER_TEMP/arm32-startup-tools/test_returns.py"
      - name: Verify game input and observe bounded original startup
        env:
          INPUT_GAME_URL: ${{ inputs.game_url }}
          INPUT_UPDATE_URL: ${{ inputs.update_url }}
          SECRET_GAME_URL: ${{ secrets.Game_URL }}
          SECRET_UPDATE_URL: ${{ secrets.Update_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ENGINE_DIR: ${{ github.workspace }}/startup-engine
          PRIVATE_WORK: ${{ runner.temp }}/arm32-startup-private
          PROBE_REPORT_DIR: ${{ runner.temp }}/arm32-startup-report
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          python "$RUNNER_TEMP/arm32-startup-tools/run_probe.py"
      - name: Publish redacted reference summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arm32-startup-report"
          REPORT="$RUNNER_TEMP/arm32-startup-report/SUMMARY.md"
          if [[ ! -f "$REPORT" ]]; then
            printf '%s\n' '# Startup reference probe did not complete' '' 'Setup or preflight failed, or the run was interrupted. No successful execution checkpoint is claimed.' '' 'Next: inspect the failed stage; do not disable the normal ARM32 guard.' > "$REPORT"
          fi
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted startup report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ARM32-Startup-Probe-Report
          path: |
            ${{ runner.temp }}/arm32-startup-report/SUMMARY.md
            ${{ runner.temp }}/arm32-startup-report/probe.json
          if-no-files-found: warn
          retention-days: 3
      - name: Remove private inputs and extraction/reference logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/arm32-startup-private"
          rm -f -- "$RUNNER_TEMP/arm32-startup-payload.b64"
