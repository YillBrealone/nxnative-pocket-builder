# NEW FILE: .github/workflows/nxnative-arm32-startup-probe.yml
# Runner-side original-code REFERENCE execution, NOT an iOS IPA or game build.
# Leaves both normal builders, ARM32 Feasibility and ARM32 Game Inventory unchanged.
name: NxNative - ARM32 Startup Probe

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Same Rune Factory base NSP/XCI (blank uses Game_URL secret)'
        required: false
        type: string
        default: ''
      update_url:
        description: 'Same v65536 update (popup base uses popup update ONLY; otherwise Update_URL secret)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  startup:
    name: Original rtld reference execution (runner only, no IPA)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out pinned extraction tooling only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seedds/nxnative
          ref: 94a0944755da1a443f42651bf7ee49ab24ed5ee5
          path: startup-engine
          persist-credentials: false
          sparse-checkout: |
            dm/tools/nx_extract
            dm/tools/nx_extract_bin
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Stage startup payload 1
