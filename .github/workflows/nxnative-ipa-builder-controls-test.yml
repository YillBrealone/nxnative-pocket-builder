              inc = once(inc, '    udc_note_draw(pr);', '    lego_diag_draw(en, pr, dw, di);\n    udc_note_draw(pr);')
              hook = '    python3 "$IOS_SOURCE/tools/prepare_legacy_resources.py"'
              guard = '''    # LEGO-DIAG-v1: validate the final provisional/registered profile.
              LEGO_PROGRAM_ID=$(gp program_id)
              python3 -c 'import sys; sys.exit(0 if sys.argv[1] == "01006F600FFC8000" and int(sys.argv[2], 16) == 0x01006F600FFC8000 else "LEGO diagnostic final profile mismatch")' "$GAME" "$LEGO_PROGRAM_ID" ||
                die "LEGO diagnostic final profile guard failed"
          '''
              return inc, once(packer, hook, guard + hook)
          
          def apply(root, env):
              for key, value in {'DETECTED_TITLE_ID': TITLE, 'ENGINE_REV': ENGINE,
                                 'DEVICE_INPUT': DEVICE, 'CACHE_INPUT': 'false',
                                 'MODE_INPUT': 'Build IPA (Default)'}.items():
                  if env.get(key) != value:
                      raise ValueError('LEGO-DIAG: incorrect ' + key + '; no files changed')
              profile = env.get('DM_GAME')
              if profile not in (TITLE, 'DEFAULT'):
                  raise ValueError('LEGO-DIAG: unexpected preliminary profile')
              if profile == 'DEFAULT' and (root / 'dm/games' / TITLE).exists():
                  raise ValueError('LEGO-DIAG: DEFAULT conflicts with an existing profile')
              originals = {}
              for name, digest in EXPECTED.items():
                  data = (root / name).read_bytes()
                  if hashlib.sha256(data).hexdigest() != digest:
                      raise ValueError('LEGO-DIAG: unknown or already-patched source: ' + name)
                  originals[name] = data.decode('utf-8')
              for name in PAYLOADS:
                  if (root / name).exists():
                      raise ValueError('LEGO-DIAG: unexpected existing diagnostic file: ' + name)
              inc_name, pack_name = EXPECTED
              inc, pack = transform(originals[inc_name], originals[pack_name])
              changes = {inc_name: inc, pack_name: pack, **PAYLOADS}
              # All identities and anchors checked before any write.
              for name, text in changes.items():
                  (root / name).write_text(text, encoding='utf-8')
              return {'test': 'LEGO-DIAG-v1', 'title': TITLE, 'engine': ENGINE,
                      'before': EXPECTED, 'after': {n: hashlib.sha256(t.encode()).hexdigest() for n, t in changes.items()},
                      'apple_compiled_here': False, 'gameplay_verified': False,
                      'scope': 'Automatic bounded GPU binding metadata; no shader, draw, texture or storage behavior fix. Clear experiment not included.'}
          
          if __name__ == '__main__':
              report = apply(Path('.'), os.environ)
              print(json.dumps(report, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('## LEGO-DIAG-v1 diagnostic-only test\n- Exact title, engine, source and full-build guards passed.\n- Automatically saves Documents/LEGO-GPU-report.txt on the first observed replay PageFault.\n- Metadata only; no game/shader byte dump. No manual env.txt flags.\n- NOT a gameplay fix; Apple compilation and device report export still require testing.\n')
          PY_LEGO

      - name: Pre-build checks and summary
        env:
          DEVICE_INPUT: ${{ inputs.device }}
          MODE_INPUT: ${{ inputs.build_mode }}
          ROMFS_INPUT: ${{ inputs.romfs_mode }}
          CACHE_INPUT: ${{ inputs.shader_cache }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          game_dir = root / 'GameFiles'
          exts = {'.nsp', '.xci', '.nsz', '.xcz', '.nup'}
          packages = sorted(p for p in game_dir.iterdir() if p.is_file() and p.suffix.lower() in exts)
          if not packages:
              raise SystemExit('No supported game packages were prepared. Check the download links and archive contents.')
          keys = root / 'nxnative' / 'prod.keys'
          if any(p.suffix.lower() != '.nup' for p in packages) and (not keys.is_file() or not keys.stat().st_size):
              raise SystemExit('prod.keys is required for NSP/XCI/NSZ/XCZ packages. Set the Keys_URL secret.')
          free = shutil.disk_usage(root).free
          total = sum(p.stat().st_size for p in packages)
          profile = os.environ.get('DM_GAME', 'DEFAULT')
          profile_dir = Path('dm/games') / profile
          if profile != 'DEFAULT' and not profile_dir.is_dir():
              raise SystemExit(f'Profile {profile!r} was selected but its directory was not found. Check the profile override.')
          version_tags = sorted({m.group(1) for p in packages for m in re.finditer(r'\[v(\d+)\]', p.name, re.I)})
          version_note = ', '.join('v' + v for v in version_tags) if version_tags else 'Not reliably detected'
          def clean(text):
              return str(text).replace('`', '').replace('\n', ' ').replace('\r', ' ')
          lines = [
              '## Pre-build checks',
              f"- Title ID: `{clean(os.environ.get('DETECTED_TITLE_ID', 'unknown'))}`",
              f"- Profile: `{clean(profile)}`" + (' (fallback; game compatibility is not guaranteed)' if profile == 'DEFAULT' else ' (profile present; compatibility is not guaranteed)'),
              f"- Engine selection: {clean(os.environ.get('DEVICE_INPUT', 'unknown'))}",
              f"- Repository commit: `{clean(os.environ.get('ENGINE_REV', 'unknown'))}`",
              f"- Workflow revision: `{clean(os.environ.get('WORKFLOW_REV', 'unknown'))}`",
              f"- Prepared packages: {len(packages)}, {total / 1e9:.2f} GB total; filename version tags: {version_note} (not verified)",
              f"- Runner free space: {free / 1e9:.2f} GB at this point; extraction and shaders need additional space.",
              f"- Mode: {clean(os.environ.get('MODE_INPUT', 'unknown'))}; RomFS: {clean(os.environ.get('ROMFS_INPUT', 'unknown'))}",
              f"- Shared shader cache: {'opted in' if os.environ.get('CACHE_INPUT') == 'true' else 'off'}",
          ]
          if os.environ.get('NX2_UPSTREAM_PIN'):
              lines.append(f"- NX2Apple upstream pin: `{clean(os.environ['NX2_UPSTREAM_PIN'])}`; synced engine commit: `{clean(os.environ.get('NX2_ENGINE_REV', 'unknown'))}`")
          if free < 20 * 10**9:
              lines.append('- **Warning:** Less than 20 GB is free. Large games may need much more; this is an advisory, not a space guarantee.')
              print('::warning::Less than 20 GB free; large games can need substantially more space.')
          if profile == 'DEFAULT':
              print('::warning::No matching game profile selected. A fallback profile does not establish game compatibility.')
          if os.environ.get('CACHE_INPUT') == 'true':
              lines.append('- **Cache notice:** Game-derived shader data may be accessible to readers of a public repository. Never cache keys or complete game files.')
          lines += [
              '- **Sharing warning:** The IPA is uploaded as a GitHub artifact and, unless disabled, to a public GoFile link. A bundled IPA can contain game files; anyone with access to those outputs may obtain them.',
              '- Use repository secrets for private input links. Workflow-dispatch inputs may be visible to people who can view the run; log masking is not a security boundary.',
              '- To skip GoFile, set the repository Actions variable `GOFILE_UPLOAD` to `false` before dispatching. The GitHub artifact is still uploaded.',
          ]
          lines.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('Pre-build checks complete. Package and version checks are not proof of compatibility.')
          PY

      - name: Run fast 2-minute compatibility survey (Survey Only mode)
        if: inputs.build_mode == 'Survey Only (Fast 2-min compatibility check)'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          KEYS_ARGS=()
          if [[ -s "$WORK/prod.keys" ]]; then
            KEYS_ARGS=(-k "$WORK/prod.keys")
          fi

          SURVEY_HELP="$(python scripts/build_ipa_from_nsp.py --help 2>&1 || true)"
          SURVEY_ARGS=(--survey-only)
          # Use upstream stage/count output, not a custom parser or synthetic percentage.
          if grep -Eq -- '--progress[[:space:]]+[{][^}]*lines[,}]' <<< "$SURVEY_HELP"; then
            SURVEY_ARGS+=(--progress lines)
            echo "Build progress: upstream stage/count lines enabled."
          else
            echo "Build progress: engine does not advertise line mode; retaining its default output."
          fi
          if grep -q -- "--provisional" <<< "$SURVEY_HELP"; then
            SURVEY_ARGS+=(--provisional)
          fi

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            "${KEYS_ARGS[@]}" \
            "${SURVEY_ARGS[@]}"

          {
            echo "## 🔍 Compatibility Survey Report (\`$DETECTED_TITLE_ID\`)"
            if [[ -f "dm/games/$DETECTED_TITLE_ID/README.md" ]]; then
              echo "✅ **Official Profile Status:** Supported in \`dm/games/$DETECTED_TITLE_ID\`!"
              echo ""
              echo "<details><summary><b>View Official Profile Notes</b></summary>"
              echo ""
              cat "dm/games/$DETECTED_TITLE_ID/README.md"
              echo ""
              echo "</details>"
              echo ""
            else
              echo "ℹ️ **Official Profile Status:** No official profile yet (uses automatic provisional profile)."
              echo ""
            fi
            SURVEY_FILE="$(find "$GAME_DIR" -name "survey.md" -type f -print -quit)"
            if [[ -n "$SURVEY_FILE" && -f "$SURVEY_FILE" ]]; then
              cat "$SURVEY_FILE"
            else
              echo "_Survey completed (see job logs for details)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update shader toolchain lock and header
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          CACHE_DEVICE: ${{ inputs.device }}
          CACHE_ROMFS: ${{ inputs.romfs_mode }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"
          LOCK_SCRIPT="$(
            find . -name tool_lock.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          if [[ -n "$LOCK_SCRIPT" ]]; then
            python "$LOCK_SCRIPT" --update-lock
          else
            python "$CHAIN_SCRIPT" --update-lock
          fi

          python "$CHAIN_SCRIPT" --header

          # Fail before extraction/compilation if this older-device engine expects
          # a different legacy shader chain. Never relabel shader libraries.
          if [[ "$CACHE_DEVICE" == *"BC fallback"* ]]; then
            python - <<'PY'
          from pathlib import Path
          import re
          packer = Path('dm/ios/tools/build_ipa.sh')
          generated = Path('dm/gfx/nvn/dmsh_chain.h')
          legacy = Path('dm/gfx/nvn/legacy/dmsh_chain.h')
          def chain(path):
              if not path.is_file():
                  raise SystemExit(f'::error::Missing shader chain header: {path}')
              hits = re.findall(r'^#define\s+DMSH_CHAIN\s+"([a-fA-F0-9]+)"\s*$', path.read_text(), re.M)
              if len(hits) != 1:
                  raise SystemExit(f'::error::Invalid shader chain header: {path}')
              return hits[0]
          if not packer.is_file():
              raise SystemExit('::error::Missing iOS packer; cannot check shader compatibility')
          current = chain(generated)
          text = packer.read_text()
          if 'gfx/nvn/legacy/dmsh_chain.h' in text:
              expected = chain(legacy)
              if current != expected:
                  raise SystemExit(f'::error::Older-device shader chain mismatch before compilation: generated {current}, legacy renderer {expected}. Use a matching engine and translator; do not rename libraries.')
          print(f'Older-device shader chain preflight passed: {current}. Resource and gameplay compatibility are not established.')
          PY
          fi

          CHAIN_ID="$(python - <<'PY'
          import re
          from pathlib import Path
          p = Path('dm/gfx/nvn/dmsh_chain.h')
          text = p.read_text(encoding='utf-8', errors='replace') if p.is_file() else ''
          m = re.search(r'#define\s+DMSH_CHAIN\s+"([A-Za-z0-9._-]+)"', text)
          print(m.group(1) if m else 'not detected')
          PY
          )"
          echo "SHADER_CHAIN_ID=$CHAIN_ID" >> "$GITHUB_ENV"
          echo "- Generated source shader chain: \`$CHAIN_ID\`" >> "$GITHUB_STEP_SUMMARY"

          # Normalize dmsh_xlate_bin timestamps so shader cache keys stay identical across runners
          if [[ -d "dm/gfx/tools/dmsh_xlate_bin" ]]; then
            find dm/gfx/tools/dmsh_xlate_bin -exec touch -t 202601010000.00 {} +
          fi

          # Cache only by an exact fingerprint; never use broad restore keys.
          # Hash all prepared package bytes (base/update/DLC), patched engine sources,
          # selected device, workflow revision and the installed Apple toolchain.
          if [[ "${{ inputs.shader_cache }}" == "true" ]]; then
            SHADER_HASH="$(python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          h = hashlib.sha256()
          def add(name, data):
              n = name.encode(); h.update(len(n).to_bytes(8, 'big')); h.update(n)
              h.update(len(data).to_bytes(8, 'big')); h.update(data)
          def file_hash(path, label):
              fhash = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(4 * 1024 * 1024), b''):
                      fhash.update(chunk)
              add(label, fhash.digest())
          for key in ('ENGINE_REV', 'WORKFLOW_REV', 'NX2_UPSTREAM_PIN', 'DETECTED_TITLE_ID', 'DM_GAME'):
              add(key, os.environ.get(key, '').encode())
          add('device', os.environ['CACHE_DEVICE'].encode())
          add('romfs_mode', os.environ['CACHE_ROMFS'].encode())
          for command in (['xcodebuild', '-version'], ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], ['xcrun', '-sdk', 'iphoneos', 'metal', '--version'], ['python', '--version'], ['python', '-m', 'pip', 'freeze'], ['dotnet', '--version'], ['glslangValidator', '--version'], ['spirv-cross', '--version'], ['zstd', '--version']):
              try:
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
                  add(' '.join(command), str(result.returncode).encode() + b'\n' + result.stdout)
              except FileNotFoundError:
                  add(' '.join(command), b'not installed')
          for root in (Path('dm'), Path('scripts'), Path('tools'), Path('ref'), Path('patches')):
              if not root.is_dir():
                  continue
              for p in sorted(root.rglob('*')):
                  if any(x in {'.git', '__pycache__', '.DS_Store'} for x in p.parts):
                      continue
                  if p.is_file():
                      file_hash(p, str(p))
          game_dir = Path(os.environ['RUNNER_TEMP']) / 'GameFiles'
          packages = sorted(p for p in game_dir.iterdir() if p.is_file() and p.suffix.lower() in {'.nsp', '.xci', '.nsz', '.xcz', '.nup'})
          if not packages:
              raise SystemExit('Cannot fingerprint shader cache without game packages')
          for p in packages:
              file_hash(p, 'package/' + p.name)
          print(h.hexdigest())
          PY
            )"
            echo "SHADER_CACHE_HASH=$SHADER_HASH" >> "$GITHUB_ENV"
          fi

      - name: Restore compiled iOS shader cache (exact match only)
        id: shader_cache
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && inputs.shader_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/nxnative-shader-cache
          key: nxnative-shaders-v2-${{ env.SHADER_CACHE_HASH }}

      - name: Install guarded Final Fantasy disk-saving cleanup
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)' && env.DETECTED_TITLE_ID == '0100606026F12000'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          from pathlib import Path

          path = Path('scripts/build_ipa_from_nsp.py')
          text = path.read_text(encoding='utf-8')
          # The main builder changes this one language default before this step.
          normalized = text.replace("want_lang = language_code(lang_in) if lang_in else 'en-GB'", "want_lang = language_code(lang_in) if lang_in else 'en-US'")
          audited = {
              '030c713af1ca8c0dc9406b9a446dae555f44cc610f768b56ddaa6f16b31eb006',  # NX2 373930 / upstream 94a094
              '22bbe2e2cad6701dfe1676f7d2c24081d64ab1dba9f696bb34b8f084ce4aacc6',  # NX2 4ab27a / upstream 94a094
          }
          if hashlib.sha256(normalized.encode('utf-8')).hexdigest() not in audited:
              raise SystemExit('Disk-saving test: engine script differs from the audited revision; refusing the cleanup patch.')
          anchor = '        seen = seen_keys(g, sh, seen_logs(work, app)) if seen_shaders else None\n        ios = build_shaders(\n'
          if text.count(anchor) != 1:
              raise SystemExit('Disk-saving test: expected shader build location not found exactly once.')
          addition = '''        # Disk-saving test: only this audited game and disposable runner copies.
                  # All game versions and DLC have been extracted, and shader split completed.
                  # Skip DLC, multi-program, non-NSP and seeded builds (not audited).
                  if (app == 0x0100606026F12000 and not mac and not mac_pack
                          and from_seed_arg is None and not nup and not dump
                          and not fam.get('dlc') and not g.get('programs', '')
                          and not PROGRAM_INDEX and getattr(args, 'in_programs', None) is None):
                      package_root = Path(os.environ.get('RUNNER_TEMP', '')).resolve() / 'GameFiles'
                      original_paths = [fam.get('base')] + [p for _, p in fam.get('updates', [])]
                      candidates = list(dict.fromkeys(Path(p) for p in original_paths if p is not None))
                      safe = (bool(os.environ.get('RUNNER_TEMP')) and nsp_dir.resolve() == package_root
                              and fam.get('base') is not None and bool(candidates)
                              and all(not p.is_symlink() and p.is_file() and p.suffix.lower() == '.nsp'
                                      and p.parent.resolve() == package_root for p in candidates)
                              and (game / 'ExeFS' / 'main').is_file()
                              and Path(str(rfs.source(game))).is_file() and (sh / 'pkg').is_dir())
                      if safe:
                          before = shutil.disk_usage(package_root).free
                          total = sum(p.stat().st_size for p in candidates)
                          for p in candidates: p.unlink()
                          after = shutil.disk_usage(package_root).free
                          say(f'Disk-saving test: removed {len(candidates)} runner-local NSP copies ({total / 1e9:.2f} GB logical); free space {before / 1e9:.2f} -> {after / 1e9:.2f} GB. Extracted game and shaders kept.')
                      else:
                          say('Disk-saving test: safety checks did not match; package copies kept.')
                  else:
                      say('Disk-saving test: unsupported input combination; package copies kept.')
          '''
          text = text.replace(anchor, addition + anchor, 1)
          # This second insertion is after build_shaders has returned successfully.
          post_anchor = '    motion = MOTION if args.motion is None else args.motion\n'
          if text.count(post_anchor) != 1:
              raise SystemExit('Disk-saving test: post-shader cleanup location changed.')
          post = '''    # Release the disposable compile database only after the entire iOS shader
              # stage succeeds. Keep the finished iOS and Mac libraries and RomFS intact.
              # CACHE_INPUT=false explicitly opts out of saving or restoring this database.
              if (app == 0x0100606026F12000 and gfx == 'nvn' and not mac and not mac_pack
                      and from_seed_arg is None and not nup and not dump and not fam.get('dlc')
                      and not g.get('programs', '') and not PROGRAM_INDEX
                      and getattr(args, 'in_programs', None) is None
                      and os.environ.get('CACHE_INPUT', '').lower() == 'false'):
                  rt = os.environ.get('RUNNER_TEMP', '')
                  target_work = Path(rt).resolve() / 'GameFiles' / '0100606026F12000_build' if rt else None
                  cache_dir = sh / 'cache'
                  chain = chain_of(repo)
                  expected = target_work / 'shader' / 'cache' if target_work else None
                  ios_img = ios / f'b-{chain}.img'
                  safe = (expected is not None and work.resolve() == target_work and sh.resolve() == target_work / 'shader'
                          and not cache_dir.is_symlink() and cache_dir.is_dir() and cache_dir.resolve() == expected
                          and not ios.is_symlink() and ios.resolve() == target_work / 'shader' / 'ios'
                          and bool(re.fullmatch(r'[0-9a-f]{12}', chain or ''))
                          and not ios_img.is_symlink() and ios_img.is_file() and ios_img.stat().st_size > 0)
                  paths = [cache_dir / f'cas-{chain}.db{suffix}' for suffix in ('', '-wal', '-shm')] if safe else []
                  safe = safe and all(not p.is_symlink() and (not p.exists() or p.is_file()) for p in paths)
                  if safe:
                      before = shutil.disk_usage(cache_dir).free
                      removed = sum(p.stat().st_size for p in paths if p.is_file())
                      for p in paths: p.unlink(missing_ok=True)
                      after = shutil.disk_usage(cache_dir).free
                      say(f'Disk-saving test: removed completed shader compile database ({removed / 1e9:.2f} GB logical); free space {before / 1e9:.2f} -> {after / 1e9:.2f} GB. Finished libraries and game image kept.')
                  else:
                      say('Disk-saving test: shader database safety checks did not match; database kept.')
              elif app == 0x0100606026F12000:
                  say('Disk-saving test: shader database kept (shared cache enabled or input combination unsupported).')
          '''
          text = text.replace(post_anchor, post + post_anchor, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          print('Disk-saving test: guarded cleanup installed for this audited game and engine.')
          PYTHON

      - name: Extract and stage separate RomFS
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && startsWith(inputs.romfs_mode, 'separate')
        env:
          ROMFS_MODE_INPUT: ${{ inputs.romfs_mode }}
          LANG_INPUT: ${{ inputs.language }}
          SHOW_FPS_INPUT: ${{ inputs.show_fps }}
          DEVICE_INPUT: ${{ inputs.device }}
          CACHE_INPUT: ${{ inputs.shader_cache }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/$IPA_FILENAME"
          BUILD_DIR="$GAME_DIR/${DETECTED_TITLE_ID}_build"
          SHADER_CACHE="$RUNNER_TEMP/nxnative-shader-cache"

          HELP_TEXT="$(python scripts/build_ipa_from_nsp.py --help 2>&1 || true)"

          BUILD_ARGS=("$GAME_DIR" -o "$OUTPUT")
          # Use upstream stage/count output, not a custom parser or synthetic percentage.
          if grep -Eq -- '--progress[[:space:]]+[{][^}]*lines[,}]' <<< "$HELP_TEXT"; then
            BUILD_ARGS+=(--progress lines)
            echo "Build progress: upstream stage/count lines enabled."
          else
            echo "Build progress: engine does not advertise line mode; retaining its default output."
          fi
          if [[ -s "$WORK/prod.keys" ]]; then
            BUILD_ARGS+=(-k "$WORK/prod.keys")
          fi

          # Device-specific renderer & pipeline archive settings
          if [[ "$DEVICE_INPUT" == *"BC fallback"* ]]; then
            export DM_IOS_RENDERER=legacy
            export DM_LEGACY_TARGET=m2
            if grep -q -- "--gpu" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--gpu none)
            fi
          elif grep -q -- "--gpu" <<<"$HELP_TEXT"; then
            # Pre-compile Metal 4 pipeline archive for A19 Pro (g18p) on iPhone 17 Pro builds
            BUILD_ARGS+=(--gpu g18p)
          fi

          # RomFS mode: bundle (full all-in-one IPA, delete extracted files after packing)
          # or separate (IPA without bundled RomFS; size varies by game)
          if [[ "$ROMFS_MODE_INPUT" == separate* ]]; then
            export DM_COPY_ROMFS=NO
            if grep -q -- "--romfs" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--romfs separate)
            fi
          else
            export DM_FULL_ROMFS=1
            export DM_COPY_ROMFS=YES
            if grep -q -- "--no-keep-extracted" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--no-keep-extracted)
            fi
          fi

          # Optional default game language (unlocked in Start Screen)
          if [[ -n "${LANG_INPUT// /}" ]]; then
            BUILD_ARGS+=(-l "${LANG_INPUT// /}")
          fi

          # Default FPS counter toggle (unlocked in Start Screen)
          if [[ "$SHOW_FPS_INPUT" == "false" ]] && grep -q -- "--no-show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--no-show-fps)
          elif grep -q -- "--show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--show-fps)
          fi

          if ! grep -q -- "--romfs" <<<"$HELP_TEXT"; then
            echo "::error::This engine does not support the verified separate RomFS handoff. No image was uploaded."
            exit 1
          fi
          python - <<'PYTHON'
          import os, re, textwrap
          from pathlib import Path

          p = Path('scripts/build_ipa_from_nsp.py')
          text = p.read_text(encoding='utf-8')
          matches = list(re.finditer(r'(?m)^([ ]+)game = dirs\[pkg_ver\]\n', text))
          if len(matches) != 1 or 'NX_ROMFS_HANDOFF_V1' in text:
              raise SystemExit('Separate RomFS handoff: unsupported engine script; no image uploaded. Bundle mode is unchanged.')
          code = r"""    # NX_ROMFS_HANDOFF_V1: act only in the separate-mode CI two-pass build.
              # The selected package version is the one the IPA uses, not an arbitrary
              # first image from a multi-version extraction. Never copy credentials.
              if os.environ.get('NX_ROMFS_PHASE') in ('stage', 'resume'):
                  import hashlib as _handoff_hashlib, json as _handoff_json
                  _handoff_phase = os.environ['NX_ROMFS_PHASE']
                  _handoff_rt = Path(os.environ['RUNNER_TEMP']).resolve()
                  _handoff_root = work.resolve()
                  _handoff_image = game / 'RomFS.img'
                  _handoff_meta = _handoff_rt / 'nxnative-romfs-handoff.json'
                  if (romfs_mode != 'separate' or work.is_symlink()
                      or work.parent.resolve() != (_handoff_rt / 'GameFiles').resolve()
                      or not re.fullmatch(r'[A-Za-z0-9_-]+', g.id) or work.name != g.id + '_build'
                          or not re.fullmatch(r'[0-9A-F]{16}', f'{app:016X}')
                          or _handoff_image.is_symlink() or not _handoff_image.is_file()
                          or _handoff_image.stat().st_size <= 0
                          or not _handoff_image.resolve().is_relative_to((_handoff_root / 'extract').resolve())
                          or g.get('programs', '') or globals().get('PROGRAM_INDEX', 0)
                          or getattr(args, 'in_programs', None) is not None):
                      raise BuildError('Separate RomFS handoff: unsupported or unsafe image, work folder or multi-program game; no image published.')
                  _handoff_sha = _handoff_hashlib.sha256()
                  with _handoff_image.open('rb') as _handoff_file:
                      for _handoff_chunk in iter(lambda: _handoff_file.read(4 * 1024 * 1024), b''):
                          _handoff_sha.update(_handoff_chunk)
                  _handoff_data = {'title': f'{app:016X}', 'package_version': str(pkg_ver),
                                   'path': str(_handoff_image.resolve()), 'size': _handoff_image.stat().st_size,
                                   'sha256': _handoff_sha.hexdigest()}
                  if _handoff_phase == 'stage':
                      _handoff_meta.write_text(_handoff_json.dumps(_handoff_data), encoding='utf-8')
                      say('Separate RomFS extracted and checked; pausing before shader compilation for artifact upload.')
                      raise SystemExit(0)
                  if not _handoff_meta.is_file() or _handoff_json.loads(_handoff_meta.read_text(encoding='utf-8')) != _handoff_data:
                      raise BuildError('Separate RomFS handoff: selected image changed after upload; refusing to build an IPA against the wrong image.')
                  say('Separate RomFS: selected image matches the staged artifact (SHA-256 verified).')
          """
          match = matches[0]
          code = textwrap.indent(textwrap.dedent(code), match.group(1))
          text = text[:match.end()] + code + text[match.end():]
          compile(text, str(p), 'exec')
          p.write_text(text, encoding='utf-8')
          print('Installed guarded separate-RomFS handoff in engine script.')
          PYTHON
          NX_ROMFS_PHASE=stage python scripts/build_ipa_from_nsp.py "${BUILD_ARGS[@]}"
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          rt = Path(os.environ['RUNNER_TEMP']).resolve()
          meta = rt / 'nxnative-romfs-handoff.json'
          if not meta.is_file(): raise SystemExit('Separate RomFS staging did not produce a handoff record; nothing uploaded.')
          data = json.loads(meta.read_text(encoding='utf-8'))
          p = Path(data['path'])
          root = rt / 'GameFiles'
          if (not re.fullmatch(r'[0-9A-F]{16}', data['title']) or data['title'] != os.environ['DETECTED_TITLE_ID']
                  or p.name != 'RomFS.img' or p.is_symlink() or not p.is_file()
                  or p.parents[1].name != 'extract' or not p.parents[2].name.endswith('_build')
                  or p.parents[2].is_symlink() or p.parents[2].parent.resolve() != root.resolve()
                  or not p.resolve().is_relative_to(root.resolve()) or p.stat().st_size != data['size']
                  or not re.fullmatch(r'[0-9a-f]{64}', data['sha256'])):
              raise SystemExit('Separate RomFS handoff record failed safety checks; nothing uploaded.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('ROMFS_IMAGE_PATH=' + str(p) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Separate RomFS image\n')
              f.write(f'- Title: `{data["title"]}`; package version: `{data["package_version"]}`\n')
              f.write(f'- Size: {data["size"]:,} bytes; SHA-256: `{data["sha256"]}`\n')
              f.write('- The image contains game data; artifact access is not private in a public repository.\n')
          PYTHON

      - name: Upload separate RomFS image
        id: romfs_artifact
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && startsWith(inputs.romfs_mode, 'separate')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NxNative-RomFS-${{ env.DETECTED_TITLE_ID }}
          path: ${{ env.ROMFS_IMAGE_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report separate RomFS download
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && startsWith(inputs.romfs_mode, 'separate')
        env:
          ARTIFACT_URL: ${{ steps.romfs_artifact.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$ARTIFACT_URL" ]] || { echo "::error::RomFS artifact URL is missing."; exit 1; }
          echo "## RomFS artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download the separate RomFS artifact]($ARTIFACT_URL) (GitHub ZIP; retained for 1 day; appropriate access required)." >> "$GITHUB_STEP_SUMMARY"
          echo '- Extract the ZIP and rename RomFS.img to romfs.img; copy it into this game’s Documents folder after installing the matching IPA.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Keep this image and the IPA from this run together. The image alone is not an app, and an uploaded image does not mean the IPA build succeeded.' >> "$GITHUB_STEP_SUMMARY"
          echo '- DLC remains handled by the engine and is not included in this base/update RomFS artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish temporary separate RomFS GoFile download
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && startsWith(inputs.romfs_mode, 'separate') && vars.GOFILE_UPLOAD != 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os, re, subprocess, tempfile, time
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          output = Path(os.environ['ROMFS_IMAGE_PATH'])
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          api = 'https://api.gofile.io'
          token = None
          folder = None
          expiry = None
          published = False

          # Never print the account token or raw API responses to the public job log.
          def call(method, path, body, credential=None):
              payload = json.dumps(body).encode('utf-8')
              headers = {'Content-Type': 'application/json'}
              if credential: headers['Authorization'] = 'Bearer ' + credential
              req = Request(api + path, data=payload, headers=headers, method=method)
              with urlopen(req, timeout=40) as response:
                  result = json.load(response)
              if result.get('status') != 'ok': raise RuntimeError('GoFile API rejected a request')
              return result.get('data', {})

          def valid_uuid(s):
              return isinstance(s, str) and re.fullmatch(r'[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}', s) is not None

          def set_expiry(when):
              data = call('PUT', '/contents/' + folder + '/update',
                          {'attribute': 'expiry', 'attributeValue': when}, token)
              if data.get('expire') != when: raise RuntimeError('GoFile did not confirm expiry')

          try:
              # The old anonymous upload also created a guest account per upload. Here it
              # is created first so the folder can expire BEFORE any file is uploaded.
              account = call('POST', '/accounts', {})
              token, root = account.get('token'), account.get('rootFolder')
              if not isinstance(token, str) or not token or '\n' in token or '\r' in token or not valid_uuid(root):
                  raise RuntimeError('GoFile guest account response was incomplete')
              created = call('POST', '/contents/createFolder',
                             {'parentFolderId': root, 'folderName': 'NxNative temporary RomFS', 'public': True}, token)
              folder = created.get('id')
              if not valid_uuid(folder): raise RuntimeError('GoFile folder response was incomplete')
              expiry = int(time.time()) + 5 * 60 * 60
              set_expiry(expiry)  # fail closed: never upload into a folder without a confirmed expiry
              with tempfile.TemporaryDirectory(prefix='nx-gofile-', dir=os.environ['RUNNER_TEMP']) as tmp:
                  config = Path(tmp) / 'curl.conf'
                  response_path = Path(tmp) / 'response.json'
                  # Token is in a mode-0600 file, not the process arguments or console.
                  fd = os.open(config, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, 'w', encoding='utf-8') as f:
                      f.write('header = ' + json.dumps('Authorization: Bearer ' + token) + '\n')
                      f.write('form = ' + json.dumps('folderId=' + folder) + '\n')
                      f.write('form = ' + json.dumps('file=@' + str(output)) + '\n')
                  data = None
                  for endpoint in ('https://upload-ap-sgp.gofile.io/uploadfile', 'https://upload.gofile.io/uploadfile'):
                      response_path.unlink(missing_ok=True)
                      result = subprocess.run(['curl', '--silent', '--show-error', '--fail', '--connect-timeout', '30',
                                               '--max-time', '3600', '--config', str(config), '--output', str(response_path), endpoint],
                                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if result.returncode == 0 and response_path.is_file():
                          try:
                              candidate = json.loads(response_path.read_text(encoding='utf-8'))
                              d = candidate.get('data', {})
                              if candidate.get('status') == 'ok' and d.get('parentFolder') == folder:
                                  data = d; break
                          except (OSError, ValueError, TypeError, AttributeError): pass
                  if not data: raise RuntimeError('GoFile upload failed')
                  url = data.get('downloadPage', '')
                  parts = urlsplit(url)
                  if (parts.scheme != 'https' or parts.netloc != 'gofile.io' or parts.query or parts.fragment
                          or not re.fullmatch(r'/d/[A-Za-z0-9_-]{4,}', parts.path)):
                      raise RuntimeError('GoFile download page was invalid')
              # Prefer five hours from the completed upload; the earlier verified expiry
              # remains a safe upper bound if this refresh fails.
              try:
                  later_expiry = int(time.time()) + 5 * 60 * 60
                  set_expiry(later_expiry)
                  expiry = later_expiry
              except Exception:
                  print('::warning::Could not refresh GoFile expiry after upload; the earlier confirmed expiry still applies.')
              published = True
              when = time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime(expiry))
              print('GoFile RomFS download page:', url)
              with summary.open('a', encoding='utf-8') as f:
                  f.write('\n## Temporary GoFile RomFS download\n')
                  f.write(f'- [Open the RomFS download page]({url})\n')
                  f.write(f'- Folder expiry requested and confirmed by GoFile: {when} (about 5 hours).\n')
                  f.write('- Public until expiry; anyone with access may download and keep a copy. The GoFile page is not a guaranteed direct file URL.\n')
                  f.write('- This image is uploaded before shader compilation; it may expire before a long build finishes. Keep it with the IPA from this run.\n')
                  f.write('- Rename the image to `romfs.img` and place it in this game app’s Documents folder. The image alone is not an app.\n')
          except Exception:
              # Never print exceptions: a server response could contain a credential.
              print('::warning::GoFile upload or expiry setup failed; check the one-day GitHub RomFS artifact instead.')
          finally:
              if not published and token and valid_uuid(folder):
                  try:
                      call('DELETE', '/contents', {'contentsId': folder}, token)
                  except Exception:
                      # If deletion fails, a previously confirmed folder expiry still applies.
                      print('::warning::GoFile cleanup could not be confirmed; any created folder may remain until its expiry.')
          PYTHON

      - name: Build unsigned IPA
        id: ipa_build
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          ROMFS_MODE_INPUT: ${{ inputs.romfs_mode }}
          LANG_INPUT: ${{ inputs.language }}
          SHOW_FPS_INPUT: ${{ inputs.show_fps }}
          DEVICE_INPUT: ${{ inputs.device }}
          CACHE_INPUT: ${{ inputs.shader_cache }}
        shell: bash
        run: |
          set -euo pipefail
          IPA_BUILD_START=$SECONDS
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/$IPA_FILENAME"
          BUILD_DIR="$GAME_DIR/${DETECTED_TITLE_ID}_build"
          SHADER_CACHE="$RUNNER_TEMP/nxnative-shader-cache"

          if [[ "$CACHE_INPUT" == "true" && -d "$SHADER_CACHE/shader" ]]; then
            echo "Restoring exact-match cached iOS shaders for $DETECTED_TITLE_ID..."
            mkdir -p "$BUILD_DIR"
            cp -a "$SHADER_CACHE/shader" "$BUILD_DIR/shader"
          fi

          HELP_TEXT="$(python scripts/build_ipa_from_nsp.py --help 2>&1 || true)"

          BUILD_ARGS=("$GAME_DIR" -o "$OUTPUT")
          # Use upstream stage/count output, not a custom parser or synthetic percentage.
          if grep -Eq -- '--progress[[:space:]]+[{][^}]*lines[,}]' <<< "$HELP_TEXT"; then
            BUILD_ARGS+=(--progress lines)
            echo "Build progress: upstream stage/count lines enabled."
          else
            echo "Build progress: engine does not advertise line mode; retaining its default output."
          fi
          if [[ -s "$WORK/prod.keys" ]]; then
            BUILD_ARGS+=(-k "$WORK/prod.keys")
          fi

          # Device-specific renderer & pipeline archive settings
          if [[ "$DEVICE_INPUT" == *"BC fallback"* ]]; then
            export DM_IOS_RENDERER=legacy
            export DM_LEGACY_TARGET=m2
            if grep -q -- "--gpu" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--gpu none)
            fi
          elif grep -q -- "--gpu" <<<"$HELP_TEXT"; then
            # Pre-compile Metal 4 pipeline archive for A19 Pro (g18p) on iPhone 17 Pro builds
            BUILD_ARGS+=(--gpu g18p)
          fi

          # RomFS mode: bundle (full all-in-one IPA, delete extracted files after packing)
          # or separate (IPA without bundled RomFS; size varies by game)
          if [[ "$ROMFS_MODE_INPUT" == separate* ]]; then
            export DM_COPY_ROMFS=NO
            if grep -q -- "--romfs" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--romfs separate)
            fi
          else
            export DM_FULL_ROMFS=1
            export DM_COPY_ROMFS=YES
            if grep -q -- "--no-keep-extracted" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--no-keep-extracted)
            fi
          fi

          # Optional default game language (unlocked in Start Screen)
          if [[ -n "${LANG_INPUT// /}" ]]; then
            BUILD_ARGS+=(-l "${LANG_INPUT// /}")
          fi

          # Default FPS counter toggle (unlocked in Start Screen)
          if [[ "$SHOW_FPS_INPUT" == "false" ]] && grep -q -- "--no-show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--no-show-fps)
          elif grep -q -- "--show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--show-fps)
          fi

          if [[ "$ROMFS_MODE_INPUT" == separate* ]]; then
            NX_ROMFS_PHASE=resume python scripts/build_ipa_from_nsp.py "${BUILD_ARGS[@]}"
          else
            python scripts/build_ipa_from_nsp.py "${BUILD_ARGS[@]}"
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          if [[ "$CACHE_INPUT" == "true" && -d "$BUILD_DIR/shader" ]]; then
            echo "Staging compiled iOS shaders for the opted-in GitHub Actions cache..."
            rm -rf "$SHADER_CACHE"
            mkdir -p "$SHADER_CACHE/shader"
            python - "$BUILD_DIR/shader" "$SHADER_CACHE/shader" <<'PYTHON'
          import shutil, sys
          from pathlib import Path
          src, dst = map(Path, sys.argv[1:])
          blocked = {'prod.keys', 'keys.txt', 'env.txt'}
          def copy(src, dst):
              if src.is_symlink() or src.name.lower() in blocked or src.suffix.lower() in {'.p12', '.pfx'}:
                  print('Skipping a symlink or credential-like cache entry.')
              elif src.is_dir():
                  dst.mkdir(parents=True, exist_ok=True)
                  for child in src.iterdir(): copy(child, dst / child.name)
              elif src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          for name in ('ios', 'cache', 'pso_pairs.tsv'):
              copy(src / name, dst / name)
          PYTHON
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"
          echo "IPA_BUILD_SECONDS=$((SECONDS - IPA_BUILD_START))" >> "$GITHUB_ENV"

      - name: Report cache outcomes and build timings
        if: always()
        continue-on-error: true
        env:
          PYTHON_DOWNLOAD_CACHE: ${{ vars.PYTHON_DOWNLOAD_CACHE }}
          PYTHON_CACHE_HIT: ${{ steps.python_download_cache.outputs.cache-hit }}
          PYTHON_CACHE_OUTCOME: ${{ steps.python_download_cache.outcome }}
          SHADER_CACHE_ENABLED: ${{ inputs.shader_cache }}
          SHADER_CACHE_HIT: ${{ steps.shader_cache.outputs.cache-hit }}
          SHADER_CACHE_OUTCOME: ${{ steps.shader_cache.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency_install.outcome }}
          IPA_BUILD_OUTCOME: ${{ steps.ipa_build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_CACHE'
          import json
          import os
          from pathlib import Path
          import re

          root = Path(os.environ['RUNNER_TEMP'])
          def seconds(name):
              value = os.environ.get(name, '')
              return int(value) if re.fullmatch(r'[0-9]{1,8}', value) else None

          def outcome(name):
              value = os.environ.get(name, '')
              return value if value in {'success', 'failure', 'cancelled', 'skipped'} else 'unknown'

          def cache_status(enabled, hit, result):
              if not enabled:
                  return 'disabled'
              if result != 'success':
                  return 'unavailable'
              return 'exact hit' if hit == 'true' else 'miss'

          record = {
              'schema': 1,
              'dependency_step_seconds': seconds('DEPENDENCY_SECONDS'),
              'ipa_build_step_seconds': seconds('IPA_BUILD_SECONDS'),
              'dependency_step_outcome': outcome('DEPENDENCY_OUTCOME'),
              'ipa_build_step_outcome': outcome('IPA_BUILD_OUTCOME'),
              'python_download_cache': cache_status(os.environ.get('PYTHON_DOWNLOAD_CACHE') != 'false', os.environ.get('PYTHON_CACHE_HIT'), outcome('PYTHON_CACHE_OUTCOME')),
              'shader_cache': cache_status(os.environ.get('SHADER_CACHE_ENABLED') == 'true', os.environ.get('SHADER_CACHE_HIT'), outcome('SHADER_CACHE_OUTCOME')),
              'meaning': 'A cache hit means an archive was restored, not that every shader was reused. Build-step time excludes download, fingerprint, publication and queue time. This is not a device test.',
          }
          (root / 'nxnative-build-metrics.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n## Cache and build timing\n')
              summary.write('- Python package downloads: '+record['python_download_cache']+'; install and smoke checks are never skipped.\n')
              summary.write('- Shader cache: '+record['shader_cache']+'; restored data is not proof of actual shader reuse.\n')
              for label, key in [('Dependency installation', 'dependency_step_seconds'), ('IPA build step', 'ipa_build_step_seconds')]:
                  value = record[key]
                  summary.write('- '+label+': '+(str(value)+' seconds' if value is not None else 'not recorded (step did not finish successfully)')+'.\n')
              summary.write('Compare matching successful runs and test the IPA on-device. Include download, hashing, cache transfer and upload time when judging total savings.\n')
          print('Recorded cache outcomes and completed-step durations; no game paths, URLs or keys exported.')
          PY_CACHE

      - name: Verify Downwell capture and iOS patch before publication
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && env.DETECTED_TITLE_ID == '010093D00C726000' && inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_DOWNWELL'
          """Build evidence gate v2, not a gameplay test. Runs before IPA publication."""
          import os
          from pathlib import Path
          import plistlib
          import re
          import zipfile

          ROUTE = b'Downwell test: dynamic ShowApplicationError routed to host'
          MESSAGE = b'Downwell test: application error code='
          STOP = b'received SIGTERM: graceful exit'
          DONE = b'graceful exit done'

          def verify(root, ipa):
              logs = list(root.glob('**/logs/gl_capture.log'))
              if len(logs) != 1:
                  raise ValueError(f'Downwell test: expected one fresh GL capture log, found {len(logs)}')
              data = logs[0].read_bytes()
              if re.search(rb'CRASH\s+sig\s*=', data):
                  raise ValueError('Downwell test: Mac capture still crashed; refusing IPA publication. Inspect build logs.')
              if ROUTE not in data:
                  raise ValueError('Downwell test: capture did not select the patched host handler; inspect build logs')
              if not re.search(rb'\[gl\] frame [1-9][0-9]*:', data):
                  raise ValueError('Downwell test: capture has no recorded GL frame progress; inspect build logs')
              if STOP not in data or DONE not in data or data.rfind(DONE) < data.rfind(STOP):
                  raise ValueError('Downwell test: orderly capture shutdown not recorded; inspect build logs')
              # Resolving the function at startup and invoking it later are separate events.
              # A capture that stops normally before the dialog is shown is not a routing failure.
              warning_logged = MESSAGE in data
              with zipfile.ZipFile(ipa) as z:
                  plists = [n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n)]
                  if len(plists) != 1:
                      raise ValueError('Downwell test: unexpected IPA app layout')
                  info = plistlib.loads(z.read(plists[0]))
                  exe = info['CFBundleExecutable']
                  if not isinstance(exe, str) or '/' in exe or exe in ('', '.', '..'):
                      raise ValueError('Downwell test: invalid IPA executable name')
                  binary = z.read(plists[0].rsplit('/', 1)[0] + '/' + exe)
                  if ROUTE not in binary or MESSAGE not in binary:
                      raise ValueError('Downwell test: patched handler markers missing from iOS executable')
              print('Downwell test v2: host route selected, GL frame progress and orderly capture shutdown recorded, iOS patch markers present')
              if warning_logged:
                  print('Downwell test: application error argument was logged during capture')
              else:
                  print('::warning::Downwell test: application error argument was not logged during capture; runtime handler execution is not verified by this capture')
              print('This does NOT establish full shader coverage, rendered visuals or working iPhone gameplay.')
              return warning_logged

          if __name__ == '__main__':
              root = Path(os.environ['RUNNER_TEMP'])
              warning_logged = verify(root / 'GameFiles', root / os.environ['IPA_FILENAME'])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('\n## Downwell startup test: capture check v2\n'
                          '- Mac dynamic lookup selected the patched host handler.\n'
                          '- GL frame progress and orderly capture shutdown recorded; no crash signature in that log.\n'
                          '- iOS executable contains the patched route and warning markers.\n')
                  f.write('- Application error argument logged during capture.\n' if warning_logged else
                          '- **Not exercised/verified:** application error argument was not logged during capture.\n')
                  f.write('- **Still required:** iPhone startup, warning-path and gameplay tests. Rendered visuals and full shader coverage are not established.\n')
          PY_DOWNWELL

      - name: Verify A Short Hike iOS workaround before publication
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && env.DETECTED_TITLE_ID == '01004890117B2000' && inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_SHORT_HIKE'
          """Verify A Short Hike integration identity in an IPA, not gameplay."""
          import hashlib
          import os
          from pathlib import Path
          import plistlib
          import zipfile

          MARKERS = (b'[ASH-MSAA-v1] %s requested=8 actual=', b'[ASH-MSAA-v1] pass actual=',
                     b'[ASH-MSAA-v1] pipeline actual=', b'[ASH-MSAA-v1] resolve actual=',
                     b'per-sample shader reads are NOT proven safe')


          def verify(path):
              with zipfile.ZipFile(path) as z:
                  infos = [n for n in z.namelist() if n.startswith('Payload/') and n.count('/') == 2 and n.endswith('.app/Info.plist')]
                  if len(infos) != 1:
                      raise ValueError('A Short Hike: expected one app Info.plist')
                  info = plistlib.loads(z.read(infos[0]))
                  name = info['CFBundleExecutable']
                  if not isinstance(name, str) or '/' in name or name in ('.', '..'):
                      raise ValueError('A Short Hike: invalid executable name')
                  binary = z.read(infos[0].rsplit('/', 1)[0] + '/' + name)
                  if not all(marker in binary for marker in MARKERS):
                      raise ValueError('A Short Hike: MSAA workaround markers missing; refusing publication')
              return hashlib.sha256(binary).hexdigest()


          if __name__ == '__main__':
              digest = verify(Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME'])
              print('A Short Hike: IPA workaround markers verified. Executable SHA256: ' + digest)
              print('Packaging identity check only; not proof of A12Z rendering or gameplay.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('- A Short Hike workaround markers found in the IPA executable. Device verification of this build remains pending.\n')
          PY_SHORT_HIKE

      - name: Verify LEGO diagnostic marker before publication
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && env.DETECTED_TITLE_ID == '01006F600FFC8000' && inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_LEGO'
          """Verify test marker in the actual IPA executable; not proof of gameplay."""
          import hashlib
          import os
          from pathlib import Path
          import plistlib
          import zipfile
          
          MARKER = b'[LEGO-DIAG-v1] automatic GPU binding report enabled; diagnostic only'
          
          def verify(path):
              with zipfile.ZipFile(path) as z:
                  infos = [n for n in z.namelist() if n.startswith('Payload/') and n.count('/') == 2 and n.endswith('.app/Info.plist')]
                  if len(infos) != 1:
                      raise ValueError('LEGO: expected one app Info.plist')
                  info = plistlib.loads(z.read(infos[0]))
                  name = info['CFBundleExecutable']
                  if not isinstance(name, str) or '/' in name or name in ('', '.', '..'):
                      raise ValueError('LEGO: invalid executable name')
                  binary = z.read(infos[0].rsplit('/', 1)[0] + '/' + name)
                  if MARKER not in binary:
                      raise ValueError('LEGO: diagnostic marker missing; refusing publication')
              return hashlib.sha256(binary).hexdigest()
          
          if __name__ == '__main__':
              digest = verify(Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME'])
              print('LEGO: diagnostic marker found. Executable SHA256: ' + digest)
              print('Packaging identity only; not proof of A12Z rendering or gameplay.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('- LEGO-DIAG-v1 marker found in the IPA executable. Device verification remains pending.\n')
          PY_LEGO

      - name: Report IPA identity, size, hash and RomFS requirements
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          ROMFS_INPUT: ${{ inputs.romfs_mode }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, plistlib, re, zipfile
          from pathlib import Path
          ipa = Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME']
          sha = hashlib.sha256()
          with ipa.open('rb') as f:
              for block in iter(lambda: f.read(4 * 1024 * 1024), b''):
                  sha.update(block)
          lines = ['## Built IPA', f'- File: `{ipa.name}`', f'- Size: {ipa.stat().st_size:,} bytes ({ipa.stat().st_size / 1e9:.2f} GB)', f'- SHA-256: `{sha.hexdigest()}`']
          try:
              with zipfile.ZipFile(ipa) as z:
                  prohibited = {'prod.keys', 'keys.txt'}
                  sensitive = [i.filename for i in z.infolist() if Path(i.filename).name.lower() in prohibited or Path(i.filename).suffix.lower() in {'.p12', '.pfx'}]
                  if sensitive:
                      raise SystemExit('IPA contains a file with a credential-like name. Publishing stopped; inspect the IPA locally before sharing.')
                  infos = [i for i in z.infolist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', i.filename) and i.file_size <= 1024 * 1024]
                  if len(infos) == 1:
                      info = plistlib.loads(z.read(infos[0]))
                      for key, label in [('CFBundleIdentifier', 'Bundle ID'), ('MinimumOSVersion', 'Minimum iOS'), ('DMCommit', 'IPA-reported engine commit'), ('DMChain', 'IPA-reported shader chain')]:
                          v = info.get(key)
                          if isinstance(v, (str, int, float)):
                              lines.append(f'- {label}: `{str(v).replace("`", "").replace(chr(10), " ").replace(chr(13), " ")}`')
                  # Decode the generated host settings, including JSON-escaped characters.
                  # This is a targeted audit, not a full game or runtime UI inspection.
                  han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
                  for entry in z.infolist():
                      if re.fullmatch(r'Payload/[^/]+\.app/dm/(?:p\d+/)?launcher\.json', entry.filename) and entry.file_size <= 2_000_000:
                          try:
                              settings = json.loads(z.read(entry).decode('utf-8'))
                          except (ValueError, UnicodeError):
                              raise SystemExit('Could not read generated launcher settings for the English UI audit; publishing stopped.')
                          if han.search(json.dumps(settings, ensure_ascii=False)):
                              raise SystemExit('Generated host launcher settings contain Han characters; publishing stopped for review. Game UI was not audited.')
                  names = [i.filename for i in z.infolist()]
                  bundled = any(re.match(r'Payload/[^/]+\.app/romfs(?:/|\.img$)', name, re.I) for name in names)
                  if os.environ.get('ROMFS_INPUT', '').startswith('separate'):
                      lines.append('- IPA contains a conventional bundled RomFS path.' if bundled else '- No conventional bundled RomFS path was found in the IPA (this is not a complete content audit).')
                      ids = [i for i in z.infolist() if re.fullmatch(r'Payload/[^/]+\.app/romfs\.id', i.filename, re.I) and i.file_size <= 4096]
                      if len(ids) == 1:
                          identity = z.read(ids[0]).decode('utf-8', 'replace').strip().replace('`', '').replace('\n', ' ').replace('\r', ' ')
                          lines.append(f'- RomFS identity recorded in IPA: `{identity}`')
                      else:
                          lines.append('- No unique RomFS identity was found in the IPA; check the engine build logs for requirements.')
                  else:
                      lines.append('- A conventional game-data path was found inside the IPA (not a complete content audit).' if bundled else '- A conventional game-data path was not found inside the IPA; check the build logs (not a complete content audit).')
          except (zipfile.BadZipFile, OSError, ValueError, plistlib.InvalidFileException) as e:
              raise SystemExit(f'Could not inspect IPA metadata ({type(e).__name__}); publishing stopped. Check the build logs.')
          if os.environ.get('ROMFS_INPUT', '').startswith('separate'):
              lines += ['- Separate mode: download the RomFS artifact from this run, extract it, and rename the image to `romfs.img`.', '- Place it in this game app’s Documents folder; the location depends on your sideloader. The image contains game data.']
          else:
              lines.append('- Bundle mode was requested; check build logs if the selected engine uses different packaging rules.')
          lines.append('')
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(text)
          PY

      - name: Publish temporary GoFile download page
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && vars.GOFILE_UPLOAD != 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os, re, subprocess, tempfile, time
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          output = Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME']
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          api = 'https://api.gofile.io'
          token = None
          folder = None
          expiry = None
          published = False

          # Never print the account token or raw API responses to the public job log.
          def call(method, path, body, credential=None):
              payload = json.dumps(body).encode('utf-8')
              headers = {'Content-Type': 'application/json'}
              if credential: headers['Authorization'] = 'Bearer ' + credential
              req = Request(api + path, data=payload, headers=headers, method=method)
              with urlopen(req, timeout=40) as response:
                  result = json.load(response)
              if result.get('status') != 'ok': raise RuntimeError('GoFile API rejected a request')
              return result.get('data', {})

          def valid_uuid(s):
              return isinstance(s, str) and re.fullmatch(r'[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}', s) is not None

          def set_expiry(when):
              data = call('PUT', '/contents/' + folder + '/update',
                          {'attribute': 'expiry', 'attributeValue': when}, token)
              if data.get('expire') != when: raise RuntimeError('GoFile did not confirm expiry')

          try:
              # The old anonymous upload also created a guest account per upload. Here it
              # is created first so the folder can expire BEFORE any file is uploaded.
              account = call('POST', '/accounts', {})
              token, root = account.get('token'), account.get('rootFolder')
              if not isinstance(token, str) or not token or '\n' in token or '\r' in token or not valid_uuid(root):
                  raise RuntimeError('GoFile guest account response was incomplete')
              created = call('POST', '/contents/createFolder',
                             {'parentFolderId': root, 'folderName': 'NxNative temporary IPA', 'public': True}, token)
              folder = created.get('id')
              if not valid_uuid(folder): raise RuntimeError('GoFile folder response was incomplete')
              expiry = int(time.time()) + 5 * 60 * 60
              set_expiry(expiry)  # fail closed: never upload into a folder without a confirmed expiry
              with tempfile.TemporaryDirectory(prefix='nx-gofile-', dir=os.environ['RUNNER_TEMP']) as tmp:
                  config = Path(tmp) / 'curl.conf'
                  response_path = Path(tmp) / 'response.json'
                  # Token is in a mode-0600 file, not the process arguments or console.
                  fd = os.open(config, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, 'w', encoding='utf-8') as f:
                      f.write('header = ' + json.dumps('Authorization: Bearer ' + token) + '\n')
                      f.write('form = ' + json.dumps('folderId=' + folder) + '\n')
                      f.write('form = ' + json.dumps('file=@' + str(output)) + '\n')
                  data = None
                  for endpoint in ('https://upload-ap-sgp.gofile.io/uploadfile', 'https://upload.gofile.io/uploadfile'):
                      response_path.unlink(missing_ok=True)
                      result = subprocess.run(['curl', '--silent', '--show-error', '--fail', '--connect-timeout', '30',
                                               '--max-time', '3600', '--config', str(config), '--output', str(response_path), endpoint],
                                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if result.returncode == 0 and response_path.is_file():
                          try:
                              candidate = json.loads(response_path.read_text(encoding='utf-8'))
                              d = candidate.get('data', {})
                              if candidate.get('status') == 'ok' and d.get('parentFolder') == folder:
                                  data = d; break
                          except (OSError, ValueError, TypeError, AttributeError): pass
                  if not data: raise RuntimeError('GoFile upload failed')
                  url = data.get('downloadPage', '')
                  parts = urlsplit(url)
                  if (parts.scheme != 'https' or parts.netloc != 'gofile.io' or parts.query or parts.fragment
                          or not re.fullmatch(r'/d/[A-Za-z0-9_-]{4,}', parts.path)):
                      raise RuntimeError('GoFile download page was invalid')
              # Prefer five hours from the completed upload; the earlier verified expiry
              # remains a safe upper bound if this refresh fails.
              try:
                  later_expiry = int(time.time()) + 5 * 60 * 60
                  set_expiry(later_expiry)
                  expiry = later_expiry
              except Exception:
                  print('::warning::Could not refresh GoFile expiry after upload; the earlier confirmed expiry still applies.')
              published = True
              when = time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime(expiry))
              print('GoFile download page:', url)
              with summary.open('a', encoding='utf-8') as f:
                  f.write('\n## Temporary GoFile IPA download\n')
                  f.write(f'- [Open the IPA download page]({url})\n')
                  f.write(f'- Folder expiry requested and confirmed by GoFile: {when} (about 5 hours).\n')
                  f.write('- Public until expiry; anyone with access may download and keep a copy. The GoFile page is not a guaranteed direct file URL.\n')
          except Exception:
              # Never print exceptions: a server response could contain a credential.
              print('::warning::GoFile upload or expiry setup failed; check the one-day GitHub IPA artifact instead.')
          finally:
              if not published and token and valid_uuid(folder):
                  try:
                      call('DELETE', '/contents', {'contentsId': folder}, token)
                  except Exception:
                      # If deletion fails, a previously confirmed folder expiry still applies.
                      print('::warning::GoFile cleanup could not be confirmed; any created folder may remain until its expiry.')
          PYTHON

      - name: Upload IPA
        id: ipa_artifact
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ runner.temp }}/${{ env.IPA_FILENAME }}
          if-no-files-found: error
          retention-days: 1

      - name: Report IPA artifact fallback
        if: always() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && steps.ipa_artifact.outcome != 'skipped'
        env:
          ARTIFACT_OUTCOME: ${{ steps.ipa_artifact.outcome }}
          ARTIFACT_URL: ${{ steps.ipa_artifact.outputs.artifact-url }}
        shell: bash
        run: |
          if [[ "$ARTIFACT_OUTCOME" == "success" && -n "$ARTIFACT_URL" ]]; then
            echo "## GitHub artifact fallback" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Download the IPA artifact]($ARTIFACT_URL) (GitHub provides a ZIP, retained for 1 day, and requires appropriate access)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::IPA artifact upload failed. Check its step log."
            echo "IPA artifact upload failed; check the upload step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare redacted build logs
        if: always()
        env:
          INPUT_GAME_URL: ${{ inputs.game_url }}
          INPUT_UPDATE_URL: ${{ inputs.update_url }}
          INPUT_DLC_URL: ${{ inputs.dlc_url }}
          SECRET_GAME_URL: ${{ secrets.Game_URL }}
          SECRET_UPDATE_URL: ${{ secrets.Update_URL }}
          SECRET_DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os, re
          from pathlib import Path
          from urllib.parse import parse_qsl, unquote, urlsplit
          root = Path(os.environ['RUNNER_TEMP'])
          game = root / 'GameFiles'
          out = root / 'nxnative-redacted-logs'
          out.mkdir(parents=True, exist_ok=True)
          sensitive = set()
          for name in ('INPUT_GAME_URL', 'INPUT_UPDATE_URL', 'INPUT_DLC_URL', 'SECRET_GAME_URL', 'SECRET_UPDATE_URL', 'SECRET_DLC_URL', 'KEYS_URL'):
              value = os.environ.get(name, '').strip()
              for token in re.split(r'[\s,;]+', value):
                  if len(token) >= 6:
                      sensitive.add(token)
                      sensitive.add(unquote(token))
                      try:
                          parts = urlsplit(token)
                      except ValueError:
                          continue
                      for _, val in parse_qsl(parts.query):
                          if len(val) >= 6: sensitive.add(val)
                      for part in parts.path.split('/'):
                          if re.fullmatch(r'[-A-Za-z0-9_]{20,}', part): sensitive.add(part)
          keyfile = root / 'nxnative' / 'prod.keys'
          key_names = set()
          if keyfile.is_file() and keyfile.stat().st_size <= 2_000_000:
              for line in keyfile.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' in line:
                      name, value = line.split('=', 1)
                      if re.fullmatch(r'[A-Za-z0-9_]+', name.strip()): key_names.add(name.strip())
                      value = value.strip()
                      if len(value) >= 6: sensitive.add(value)
                      sensitive.update(re.findall(r'(?i)\b[0-9a-f]{16,}\b', value))
          values = sorted((s for s in sensitive if len(s) >= 6), key=len, reverse=True)
          key_pattern = re.compile(r'(?<![A-Za-z0-9_])(?:' + '|'.join(re.escape(k) for k in key_names) + r')(?![A-Za-z0-9_])', re.I) if key_names else None
          count = 0
          if game.is_dir():
              for folder in list(game.glob('*_build/logs')) + list(game.glob('*_survey')):
                  if not folder.is_dir() or folder.is_symlink(): continue
                  for p in folder.rglob('*'):
                      if not p.is_file() or p.is_symlink() or p.suffix.lower() not in {'.log', '.txt', '.md'} or p.stat().st_size > 25_000_000:
                          continue
                      text = p.read_text(encoding='utf-8', errors='replace')
                      for value in values: text = text.replace(value, '[REDACTED]')
                      text = re.sub(r'https?://[^\s<>"\']+', '[REDACTED URL]', text, flags=re.I)
                      if key_pattern:
                          text = '\n'.join('[REDACTED KEY LINE]' if key_pattern.search(line) else line for line in text.split('\n'))
                      # Avoid copying original paths or filenames, which may themselves
                      # contain private links, account names or other sensitive data.
                      label = 'build_ipa' if p.name == 'build_ipa.log' else 'log'
                      target = out / f'{count + 1:03d}-{label}{p.suffix.lower()}'
                      target.write_text(text, encoding='utf-8')
                      count += 1
          print(f'Prepared {count} text log(s) with best-effort redaction; binary and oversized files were skipped.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\nBuild-log artifacts use best-effort redaction. Review them before sharing; no automatic redactor can guarantee removal of all sensitive data.\n')
          PYTHON

      - name: Upload redacted build logs if available
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NxNative-Build-Logs
          path: ${{ runner.temp }}/nxnative-redacted-logs/
          if-no-files-found: ignore
