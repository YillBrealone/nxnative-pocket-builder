      - name: Explain experimental and game-dependent settings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_REVIEW'
          """Presentation-only annotations, applied AFTER guarded Pocket source checks."""
          from pathlib import Path

          NOTES = {
              'DM_RENDER_SCALE': ('Render scale (experimental)', 'Effect depends on the game and renderer; internal resolution may not change. Restart before comparing. Lower values do not guarantee less heat or higher FPS.'),
              'DM_DYNAMIC_RESOLUTION': ('Dynamic resolution (game-dependent)', 'Requires game support. A visible toggle may have no effect. Restart before comparing; leave off if the game is already smooth.'),
              'DM_FRAMEGEN': ('Frame generation (experimental)', 'Game and renderer support varies. Interpolated pictures do not increase game simulation speed; artifacts and extra GPU work are possible. Restart before comparing.'),
              'DM_FPS_TARGET': (None, 'A target is not a performance guarantee. Higher values may affect game speed and heat. Restart before comparing; use the working default first.'),
          }

          def annotate(text):
              rows = []
              seen = set()
              for line in text.splitlines():
                  parts = line.split('\t')
                  key = parts[0]
                  if key in NOTES:
                      if key in seen or len(parts) < 8:
                          raise ValueError('Settings guidance: duplicate or malformed row for '+key)
                      seen.add(key)
                      label, note = NOTES[key]
                      if label is not None:
                          parts[6] = label
                      # Preserve engine-specific advice as well as our caution. Idempotent.
                      if note not in parts[7]:
                          # Remove the old generic guarantee, not engine-specific details.
                          parts[7] = parts[7].replace('Lowers resolution to keep the device cool and save battery.', '').strip()
                          parts[7] = (note+' '+parts[7]).strip()
                      line = '\t'.join(parts)
                  rows.append(line)
              if not {'DM_RENDER_SCALE', 'DM_DYNAMIC_RESOLUTION'}.issubset(seen):
                  raise ValueError('Settings guidance: expected display settings were not found')
              return '\n'.join(rows)+'\n'

          path = Path('dm/games/settings.tsv')
          original = path.read_text(encoding='utf-8')
          updated = annotate(original)
          # Never change options, defaults, visibility, groups or metadata.
          before, after = original.splitlines(), updated.splitlines()
          assert len(before) == len(after)
          for old, new in zip(before, after):
              a, b = old.split('\t'), new.split('\t')
              assert len(a) == len(b)
              assert all(x == y for i, (x, y) in enumerate(zip(a, b)) if i not in (6, 7))
          path.write_text(updated, encoding='utf-8')
          print('Added English settings support notes; defaults, gates, renderer and game fixes are unchanged.')
          PY_REVIEW

