name: NxNative - Controls Editor Test

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose engine (layout editor currently NX2Apple only)"
        required: true
        type: choice
        default: "iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)"
        options:
          - "iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
          - "iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)"
      build_mode:
        description: "Build full IPA or run a fast 2-minute compatibility survey"
        required: true
        type: choice
        default: "Build IPA (Default)"
        options:
          - "Build IPA (Default)"
          - "Survey Only (Fast 2-min compatibility check)"
      romfs_mode:
        description: "Bundle game files inside IPA or use a separate RomFS"
        required: true
        type: choice
        default: "bundle (Full all-in-one IPA - Default)"
        options:
          - "bundle (Full all-in-one IPA - Default)"
          - "separate (IPA without bundled RomFS; size varies)"
      shader_cache:
        description: "Opt in to GitHub shader cache (may contain game-derived data accessible in a public repo)"
        required: false
        type: boolean
        default: false
      game_url:
        description: "Base Game (.nsp/.xci/.nsz/.xcz/.nup) Google Drive or direct HTTP link (blank = Game_URL secret)"
        required: false
        type: string
        default: ""
      update_url:
        description: "Update Google Drive or direct HTTP link (optional; leave blank if none)"
        required: false
        type: string
        default: ""
      dlc_url:
        description: "DLC Google Drive or direct HTTP link (optional; leave blank if none)"
        required: false
        type: string
        default: ""
      language:
        description: "Default game language (optional, e.g. en-US, ja, fr, es, zh-Hans; unlocked in Start Screen)"
        required: false
        type: string
        default: ""
      show_fps:
        description: "Enable FPS counter by default on Start Screen (stays unlocked in menu)"
        required: false
        type: boolean
        default: true
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 / iOS 27 SDK: nxnative main uses CMMotionManager.deviceMotionBody
    # (iOS 27); the macos-26 image tops out at Xcode 26.x and cannot compile it
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
      PYTHONHOME: ""
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Select and verify the reference Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_XCODE="27.1"
          PREFERRED="/Applications/Xcode_${EXPECTED_XCODE}.app/Contents/Developer"
          if [[ -d "$PREFERRED" ]]; then export DEVELOPER_DIR="$PREFERRED"; fi
          XCODE_VERSION="$(xcodebuild -version)"
          ACTUAL="${XCODE_VERSION%%$'\n'*}"
          if [[ "$ACTUAL" != "Xcode $EXPECTED_XCODE" ]]; then
            echo "::error::This update was prepared for Xcode $EXPECTED_XCODE; runner selected $ACTUAL. Review the toolchain before changing the version check."
            exit 1
          fi
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-$(xcode-select -p)}" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Free up runner disk space for large games
        shell: bash
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf \
            /Library/Frameworks/Mono.framework \
            /usr/local/share/android-sdk \
            /usr/local/lib/android \
            "$HOME/Library/Android" \
            "$HOME/.ghcup" \
            "$HOME/.rustup" \
            "$HOME/.cargo" \
            "$HOME/.gradle" \
            "$HOME/.m2" 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /
          FREE_KB="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$FREE_KB" =~ ^[0-9]+$ ]] && (( FREE_KB < 20000000 )); then
            echo "::warning::Less than about 20 GB is free before downloads. Large games may require much more space."
          fi

      - name: Checkout NX2Apple patched engine (Default)
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LNPANDY/NX2Apple
          persist-credentials: false
          # Audited for the experimental editor patch; main remains unpinned.
          ref: 4ab27a53ccb25545fc72dde841320ce5010c399d

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seedds/nxnative
          persist-credentials: false
          ref: 20b59b6e59a9b8f060c19cd3894dacf4e5f4d68a

      - name: Checkout Metal 3 + BC fallback version (2020 iPad Pro / iPhone 15 or older)
        if: inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: widmonstertony/nxnative
          persist-credentials: false
          # Keep this renderer and its translator together, as in the main workflow.
          ref: b5ac83de5c3c01ab30b3e0dbac8eaf32fe2f9b14

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Sync NX2Apple engine patches
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        shell: bash
        run: |
          set -euo pipefail
          python tools/engine.py sync
          echo "NX2_ENGINE_REV=$(git -C engine rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NX2_UPSTREAM_PIN=$(tr -d '\r\n' < .upstream-ref)" >> "$GITHUB_ENV"
          for dir in dm scripts docs ref; do
            if [[ -e "engine/$dir" ]]; then
              rm -rf "$dir"
              cp -a "engine/$dir" "$dir"
            fi
          done
          rm -rf engine

      - name: Apply experimental NX2Apple touch editor
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        shell: bash
        run: |
          set -euo pipefail
          # The editor originated in the contributor's MIT-licensed NX2Apple fork.
          # Pin both the fork revision and the patch bytes; do not fetch a moving branch.
          PATCH_FILE="$RUNNER_TEMP/nxnative-touch-editor.patch"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/bagasromadon/NX2Apple/ba882e3f571caef2f4f0f4f58c572f13d26ca6e4/patches/0056-ios-edit-the-touch-controls-from-the-in-game-men.patch" \
            -o "$PATCH_FILE"
          python - "$PATCH_FILE" <<'PYTHON'
          import hashlib, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          if hashlib.sha256(data).hexdigest() != 'ee64410e35249d930cf446126d0aa258efd92e2a45ec147218cbc4d3dd3daa21':
              raise SystemExit('Editor patch failed its SHA-256 check; no changes were applied.')
          PYTHON
          # Apply only the audited geometry, gamepad, and geometry-test files.
          # The friend's Swift menu/header hunks differ from this engine; the
          # declarations and our existing nested-menu entry are added separately.
          git apply --check --include='dm/ios/Sources/DmGamepad.m' \
            --include='dm/ios/Sources/DmPadGeometry.h' \
            --include='dm/ios/tests/pad_geometry/pad_geometry_check.m' "$PATCH_FILE"
          git apply --whitespace=nowarn --include='dm/ios/Sources/DmGamepad.m' \
            --include='dm/ios/Sources/DmPadGeometry.h' \
            --include='dm/ios/tests/pad_geometry/pad_geometry_check.m' "$PATCH_FILE"
          python - <<'PYTHON'
          from pathlib import Path
          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'Control editor: {label} did not match exactly once; refusing to build.')
              return text.replace(old, new, 1)
          header = Path('dm/ios/Sources/DmGameMenu.h')
          h = header.read_text(encoding='utf-8')
          h = once(h, 'void dm_pad_layout_set(int layout);', 'bool dm_pad_edit_offered(void);\nvoid dm_pad_edit_begin(void);\nvoid dm_pad_layout_set(int layout);', 'menu declarations')
          pad = Path('dm/ios/Sources/DmGamepad.m')
          p = pad.read_text(encoding='utf-8')
          # Keep the newer editor's single-line labels and adaptive card width,
          # but never reintroduce latching or turbo modes.
          p = once(p,
              '_modeSeg = [[UISegmentedControl alloc] initWithItems:@[@"Hold", @"Toggle", @"Turbo"]];',
              '_modeSeg = [[UISegmentedControl alloc] initWithItems:@[@"Hold"]];', 'macro options')
          p = once(p,
              '_modeSeg.selectedSegmentIndex = (mode >= DM_PAD_MACRO_HOLD && mode <= DM_PAD_MACRO_TURBO) ? mode : DM_PAD_MACRO_HOLD;',
              '_modeSeg.selectedSegmentIndex = DM_PAD_MACRO_HOLD;', 'macro selection')
          p = once(p, 'if (macroText && dm_pad_macros_parse(macroText.UTF8String, &m)) _macros = m;',
              'if (macroText && dm_pad_macros_parse(macroText.UTF8String, &m)) {\n        for (int set = 0; set < DM_PAD_SET_N; set++) for (int i = 0; i < DM_PAD_MACRO_MAX; i++) m.items[set][i].mode = DM_PAD_MACRO_HOLD;\n        _macros = m;\n    }', 'saved macro modes')
          p = once(p, 'm->mode = (mode >= DM_PAD_MACRO_HOLD && mode <= DM_PAD_MACRO_TURBO) ? mode : DM_PAD_MACRO_HOLD;',
              'm->mode = DM_PAD_MACRO_HOLD;', 'macro mode save')
          for required in ('edit_one_line', 'edit_capped_font', 'minimumUsableWidth', 'edit_flat_label'):
              if required not in p:
                  raise SystemExit('Control editor readability check failed: ' + required)
          if 'initWithItems:@[@"Hold", @"Toggle", @"Turbo"]' in p:
              raise SystemExit('Control editor must offer hold-only combinations.')
          header.write_text(h, encoding='utf-8')
          pad.write_text(p, encoding='utf-8')
          print('Editor source applied. Combination buttons are active only while held; tap-to-latch and turbo are not offered.')
          PYTHON
          rm -f "$PATCH_FILE"

      - name: Record engine revision and runner tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ENGINE_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WORKFLOW_REV=${GITHUB_WORKFLOW_SHA:-unknown}" >> "$GITHUB_ENV"
          echo "Selected repository commit: $(git rev-parse HEAD)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - name: Prepare isolated Python download cache
        id: python_cache_key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_CACHE'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import sysconfig

          # Same requirements as the existing installation, not newly chosen version pins.
          REQUIREMENTS = 'lz4\ncapstone>=5,<6\nfonttools\nbackports.zstd\ngdown\nnsz\nzbic\n'
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'nxnative-python-requirements.txt').write_text(REQUIREMENTS, encoding='utf-8')
          identity = {
              'schema': 1, 'requirements': REQUIREMENTS,
              'python': sys.version, 'pip': importlib.metadata.version('pip'),
              'platform': sysconfig.get_platform(), 'macos': platform.mac_ver()[0],
              'architecture': platform.machine(),
              'workflow_revision': os.environ.get('WORKFLOW_REV', 'unknown'),
          }
          key = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('key='+key+'\n')
          print('Prepared public Python-package download cache identity; installation and dependency checks still run.')
          PY_CACHE

      - name: Restore public Python package downloads
        id: python_download_cache
        if: vars.PYTHON_DOWNLOAD_CACHE != 'false'
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          # Share downloaded responses only, never locally compiled wheels.
          path: ${{ runner.temp }}/nxnative-python-download-cache/http-v2
          key: nxnative-pip-downloads-v1-${{ steps.python_cache_key.outputs.key }}

      - name: Install dependencies
        id: dependency_install
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/nxnative-python-download-cache
          PYTHON_DOWNLOAD_CACHE: ${{ vars.PYTHON_DOWNLOAD_CACHE }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        shell: bash
        run: |
          set -euo pipefail
          DEPENDENCY_START=$SECONDS
          brew install xcodegen zstd spirv-cross unar glslang
          PIP_ARGS=(-q -r "$RUNNER_TEMP/nxnative-python-requirements.txt")
          if [[ "$PYTHON_DOWNLOAD_CACHE" == "false" ]]; then
            PIP_ARGS+=(--no-cache-dir)
          fi
          if ! python -m pip install "${PIP_ARGS[@]}"; then
            echo "::warning::Python installation failed; retrying once without the download cache."
            python -m pip install --no-cache-dir "${PIP_ARGS[@]}"
          fi

          # Xcode 26/27 runners ship the Metal shader compiler
          # as a separate on-demand component; the build script requires
          # `xcrun -sdk iphoneos metal` to work.
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal toolchain not installed; downloading it..."
            xcodebuild -runFirstLaunch || true
            xcodebuild -downloadComponent MetalToolchain \
              || sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version | head -1
          echo "DEPENDENCY_SECONDS=$((SECONDS - DEPENDENCY_START))" >> "$GITHUB_ENV"

      - name: Check dependencies and bundled shader tools before downloads
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_PREFLIGHT'
          """Read-only early checks for the four pinned builder variants; no game inputs."""
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import tempfile

          # Filled from the reviewed pinned sources by the delivery generator.
          SOURCE_SETS = {'b5ac83de5c3c01ab30b3e0dbac8eaf32fe2f9b14': {'label': 'Legacy Metal 3 + BC fallback', 'upstream': None, 'files': {'dm/gfx/tools/tool_lock.py': 'ef55d09a97fb00712b9c8b795fc6b36fd5059da3cc058faf77c3dfbf79dcca4c', 'dm/gfx/tools/dmsh_chain.py': '31c47e9dc676bf63060010447816578e9540e2d981beba166a8a6d584ac78014', 'dm/gfx/tools/dmsh_chain.lock': '0e23a2d9f38f103bec9c756bef1227c5d58896f809677c6c88bb01b3fa02a2e8'}}, '20b59b6e59a9b8f060c19cd3894dacf4e5f4d68a': {'label': 'Standard engine', 'upstream': None, 'files': {'dm/gfx/tools/tool_lock.py': '8ef0fa855054a17d7df53a591dcfc6c1adf6d71a6bcf7bf9d90f11df8189a231', 'dm/gfx/tools/dmsh_chain.py': 'b7f5d6fd9d6d064cf75480a2a7099b0261a533f4c844f4500528dea0c5969efc', 'dm/gfx/tools/dmsh_chain.lock': '3c202b29aed97b19646f991d2301162fa97bf54510ff008a260c7f3c1db6bdf8'}}, '3739300556114bcb51937a62c7392464b1196939': {'label': 'NX2Apple regular builder', 'upstream': '94a0944755da1a443f42651bf7ee49ab24ed5ee5', 'files': {'dm/gfx/tools/tool_lock.py': '8ef0fa855054a17d7df53a591dcfc6c1adf6d71a6bcf7bf9d90f11df8189a231', 'dm/gfx/tools/dmsh_chain.py': '3cf5d272feb7c24bbe54eeb1a337107d3b63ee0a8433cd5c6eb89c8c61fe8bc5', 'dm/gfx/tools/dmsh_chain.lock': '936adec476e350cfee6655fbef37c06cc128e359a0354ad50eeb7146e06d7364'}}, '4ab27a53ccb25545fc72dde841320ce5010c399d': {'label': 'NX2Apple Controls Editor', 'upstream': '94a0944755da1a443f42651bf7ee49ab24ed5ee5', 'files': {'dm/gfx/tools/tool_lock.py': '8ef0fa855054a17d7df53a591dcfc6c1adf6d71a6bcf7bf9d90f11df8189a231', 'dm/gfx/tools/dmsh_chain.py': '3cf5d272feb7c24bbe54eeb1a337107d3b63ee0a8433cd5c6eb89c8c61fe8bc5', 'dm/gfx/tools/dmsh_chain.lock': '936adec476e350cfee6655fbef37c06cc128e359a0354ad50eeb7146e06d7364'}}}
          EXPECTED_XCODE = 'Xcode 27.1'
          MODULES = ('lz4.block', 'capstone', 'fontTools', 'backports.zstd', 'gdown', 'nsz', 'zbic')
          DEPENDENCY_CODE = '''import importlib, sys
          assert sys.version_info >= (3, 12)
          for name in sys.argv[1:]: importlib.import_module(name)
          import capstone, lz4.block
          from backports import zstd
          assert capstone.__version__.split('.')[0] == '5'
          cs = capstone.Cs(capstone.CS_ARCH_ARM64, capstone.CS_MODE_ARM)
          assert next(cs.disasm(bytes.fromhex('c0035fd6'), 0)).mnemonic == 'ret'
          data = b'NXNative dependency smoke test' * 4
          assert lz4.block.decompress(lz4.block.compress(data)) == data
          assert zstd.decompress(zstd.compress(data)) == data
          '''
          TOOL_CODE = '''import sys, json, subprocess
          sys.path.insert(0, sys.argv[1])
          import tool_lock
          subprocess.run([tool_lock.SPIRV_CROSS, '--revision'], check=True, capture_output=True, timeout=30)
          print(json.dumps({'actual': tool_lock.tools_now(), 'source': tool_lock.xlate_source_sha()}))
          '''


          def command(argv, label, *, cwd=None, timeout=45):
              try:
                  result = subprocess.run(argv, cwd=cwd, capture_output=True, text=True, timeout=timeout, check=False)
              except (OSError, subprocess.SubprocessError) as error:
                  raise ValueError(label + ' could not complete (' + type(error).__name__ + '). See TROUBLESHOOTING.md.') from None
              if result.returncode:
                  # Do not echo arbitrary child output/environment or secrets into Actions.
                  raise ValueError(label + ' failed (exit ' + str(result.returncode) + '). See TROUBLESHOOTING.md.')
              return result.stdout.strip()


          def parse_lock(text):
              result = {}
              for line in text.splitlines():
                  if not line or line.startswith('#'): continue
                  key, sep, value = line.partition('\t')
                  if not sep or key in result or not value:
                      raise ValueError('Invalid or duplicate shader lock record')
                  result[key] = value
              return result


          def validate_tools(want, actual, source):
              if set(actual) != set(want):
                  raise ValueError('Shader-tool fingerprint inventory differs from the reviewed lock')
              for key in want:
                  if key.startswith('metal_'):
                      if not isinstance(actual[key], str) or not actual[key].startswith('Apple metal version '):
                          raise ValueError('Metal compiler unavailable: ' + key)
                  elif actual[key] != want[key]:
                      raise ValueError('Bundled shader tool failed its committed fingerprint check: ' + key)
              if actual.get('xlate_source') != source:
                  raise ValueError('Translator embedded source does not match repository source')
              return all(actual[k] == want[k] for k in ('metal_macosx', 'metal_iphoneos'))


          def verify_source(root, spec):
              snapshots = {}
              for name, expected in spec['files'].items():
                  p = root / name
                  if not p.is_file() or p.is_symlink():
                      raise ValueError('Missing or symbolic shader-tool input: ' + name)
                  data = p.read_bytes()
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise ValueError('Shader-tool source/lock differs from the pinned revision: ' + name)
                  snapshots[name] = data
              return snapshots


          def preflight(root, env):
              revision = env.get('ENGINE_REV', '')
              if revision not in SOURCE_SETS:
                  raise ValueError('Unknown engine revision; review the preflight inventory before changing engine pins')
              spec = SOURCE_SETS[revision]
              if spec.get('upstream') and env.get('NX2_UPSTREAM_PIN') != spec['upstream']:
                  raise ValueError('NX2Apple upstream pin differs from the reviewed revision')
              if sys.version_info < (3, 12): raise ValueError('Python 3.12 or newer is required')
              before = verify_source(root, spec)
              version = command(['xcodebuild', '-version'], 'Xcode selection').splitlines()
              if not version or version[0] != EXPECTED_XCODE:
                  raise ValueError('This delivery retains the reference Xcode 27.1 requirement')
              runtimes = command(['dotnet', '--list-runtimes'], '.NET runtime')
              if not re.search(r'^Microsoft\.NETCore\.App 10\.', runtimes, re.M):
                  raise ValueError('.NET 10 runtime is missing')
              for name in ('xcodegen', 'zstd', 'glslangValidator', 'unar', 'gdown', 'nsz'):
                  if shutil.which(name) is None: raise ValueError('Required command is missing: ' + name)
              for name in ('xcodegen', 'zstd', 'glslangValidator'):
                  command([name, '--version'], name + ' smoke check')
              # Isolated interpreter, empty scratch cwd; no game files/keys needed or printed.
              with tempfile.TemporaryDirectory(prefix='nxnative-smoke-', dir=env['RUNNER_TEMP']) as td:
                  command([sys.executable, '-I', '-B', '-c', DEPENDENCY_CODE, *MODULES],
                          'Python package/native-library smoke check', cwd=td, timeout=90)
              for sdk in ('macosx', 'iphoneos'):
                  command(['xcrun', '--sdk', sdk, '--show-sdk-path'], sdk + ' SDK')
                  text = command(['xcrun', '--sdk', sdk, 'metal', '--version'], sdk + ' Metal compiler')
                  if not text.startswith('Apple metal version '): raise ValueError('Unrecognized Metal version output: ' + sdk)
              tools = root / 'dm/gfx/tools'
              response = command([sys.executable, '-I', '-B', '-c', TOOL_CODE, str(tools.resolve())],
                                 'Bundled translator/SPIRV-Cross check', timeout=150)
              try:
                  data = json.loads(response)
                  want = parse_lock(before['dm/gfx/tools/dmsh_chain.lock'].decode())
                  recorded_metal = validate_tools(want, data['actual'], data['source'])
              except (KeyError, TypeError, json.JSONDecodeError):
                  raise ValueError('Invalid shader-tool check response') from None
              if verify_source(root, spec) != before:
                  raise ValueError('Shader-tool inputs changed during the read-only check')
              # Do not run --update-lock/--header here, and do not import own_compilers:
              # upstream lock compiler strings can differ from the existing 27.1 CI policy.
              report = {'schema': 1, 'engine_revision': revision, 'variant': spec['label'],
                        'python': '.'.join(map(str, sys.version_info[:3])), 'xcode': version[0],
                        'python_smoke_passed': True, 'both_metal_sdks_available': True,
                        'bundled_nonmetal_fingerprints_verified': True,
                        'translator_source_verified': True, 'source_files_changed': False,
                        'metal_matches_committed_lock': recorded_metal,
                        'compiler_policy': 'Existing strict Xcode 27.1 selection and later lock/header preparation retained; no new compiler override.',
                        'device_compatibility_verified': False}
              return report


          if __name__ == '__main__':
              try:
                  report = preflight(Path.cwd(), os.environ)
                  print('Early dependency and bundled shader-tool checks passed; no game data required.')
                  if not report['metal_matches_committed_lock']:
                      print('Note: selected Xcode 27.1 Metal differs from the committed upstream lock. Existing later lock/header preparation remains unchanged; this is not proof of upstream compiler equivalence.')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                      f.write('## Early build checks\n- Python imports, compression round-trips and ARM64 disassembly smoke check passed.\n- .NET 10, utility probes and macOS/iPhoneOS Metal SDK checks passed.\n- Bundled translator/SPIRV-Cross fingerprints and translator source verified before downloads; no source or lock rewritten by this step.\n')
                      f.write('- Metal matches the committed upstream lock: **' + ('yes' if report['metal_matches_committed_lock'] else 'no; existing strict Xcode 27.1 CI policy retained') + '**.\n')
                      f.write('- Build checks are not a device/gameplay compatibility test.\n')
              except ValueError as error:
                  print('::error::Early build check: ' + str(error))
                  raise SystemExit(1)
          PY_PREFLIGHT

      - name: Record dependency versions for future tested locks
        id: build_environment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_REVIEW'
          """Version-only inventory; never export pip URLs, paths, keys or the environment."""
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys

          def probe(argv):
              try:
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=45, check=False)
                  return result.stdout.strip() if result.returncode == 0 else ''
              except (OSError, subprocess.SubprocessError):
                  return ''

          def version(value):
              return value if re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+!() -]{0,159}', value) else 'unavailable'

          def revision(name):
              value = os.environ.get(name, '')
              return value if re.fullmatch(r'[0-9a-f]{40}', value) else 'unavailable'

          def number(name):
              value = os.environ.get(name, '')
              return value if re.fullmatch(r'[0-9]{1,30}', value) else 'unavailable'

          packages = {}
          for dist in importlib.metadata.distributions():
              name = dist.metadata.get('Name', '')
              if re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', name):
                  packages[name] = version(dist.version)
          brew = {}
          for line in probe(['brew', 'list', '--formula', '--versions']).splitlines():
              fields = line.split()
              if len(fields) >= 2 and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9@+._-]{0,127}', fields[0]):
                  brew[fields[0]] = [version(v) for v in fields[1:]]
          xcode = probe(['xcodebuild', '-version']).splitlines()
          metal_output = probe(['xcrun', '-sdk', 'iphoneos', 'metal', '--version'])
          metal = re.search(r'\b(\d+(?:\.\d+){1,4}(?:\.\d+)?)\b', metal_output)
          record = {
              'schema': 1,
              'purpose': 'Observed build environment, not a tested dependency lock or proof of build success.',
              'run_id': number('GITHUB_RUN_ID'),
              'run_attempt': number('GITHUB_RUN_ATTEMPT'),
              'workflow_revision': revision('WORKFLOW_REV'),
              'engine_revision': revision('ENGINE_REV'),
              'nx2_engine_revision': revision('NX2_ENGINE_REV'),
              'nx2_upstream_pin': revision('NX2_UPSTREAM_PIN'),
              'python': version(platform.python_version()),
              'macos': version(platform.mac_ver()[0]),
              'architecture': version(platform.machine()),
              'xcode': [version(line) for line in xcode[:2]],
              'iphoneos_sdk': version(probe(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'])),
              'metal_version': metal.group(1) if metal else 'unavailable',
              'dotnet_sdk': version(probe(['dotnet', '--version'])),
              'python_packages': dict(sorted(packages.items())),
              'homebrew_formulae': dict(sorted(brew.items())),
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'nxnative-build-environment.json'
          path.write_text(json.dumps(record, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          # Draft constraints are evidence for later testing, never applied automatically.
          # This snapshots all observed Python distributions, not just the direct requirements.
          candidate = [
              '# CANDIDATE ONLY - NOT A TESTED LOCK; no package integrity hashes included.',
              '# Includes all observed Python distributions; review scope before pinning.',
              '# Run ID: '+record['run_id']+'; attempt: '+record['run_attempt'],
              '# Match a successful full build and device test, then repeat-build before promotion.',
          ]
          for name, value in sorted(packages.items()):
              if value != 'unavailable' and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.!+_-]{0,159}', value):
                  candidate.append(name+'=='+value)
          (Path(os.environ['RUNNER_TEMP']) / 'nxnative-python-constraints-candidate.txt').write_text('\n'.join(candidate)+'\n', encoding='utf-8')
          print('Recorded version-only build environment; check the final Actions result before treating this run as successful.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n## Build environment\nThe NxNative-Build-Environment artifact records tool/package versions (one-day retention). It is not a dependency lock or a build-success certificate. Save it alongside a successful full-build run before proposing dependency pins.\n')
          PY_REVIEW

      - name: Download game files and keys
        env:
          INPUT_GAME_URL: ${{ inputs.game_url }}
          INPUT_UPDATE_URL: ${{ inputs.update_url }}
          INPUT_DLC_URL: ${{ inputs.dlc_url }}
          SECRET_GAME_URL: ${{ secrets.Game_URL }}
          SECRET_UPDATE_URL: ${{ secrets.Update_URL }}
          SECRET_DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          # Inputs can be visible in GitHub's dispatch UI: use secrets for private URLs.
          # Masking is a best-effort safeguard, not a security boundary.
          mask_value() {
            local value="$1"
            [[ -z "$value" ]] && return 0
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            printf '::add-mask::%s\n' "$value"
          }

          # If game_url is provided in the "Run workflow" popup, use the popup
          # inputs for game/update/dlc so old Update_URL or DLC_URL secrets from
          # a previous game do not get mixed in. Otherwise fall back to secrets.
          if [[ -n "${INPUT_GAME_URL// /}" ]]; then
            echo "Using game links from Run workflow popup inputs."
            GAME_URL="$INPUT_GAME_URL"
            UPDATE_URL="${INPUT_UPDATE_URL:-}"
            DLC_URL="${INPUT_DLC_URL:-}"
          else
            echo "Using game links from repository secrets."
            GAME_URL="${SECRET_GAME_URL:-}"
            UPDATE_URL="${INPUT_UPDATE_URL:-${SECRET_UPDATE_URL:-}}"
            DLC_URL="${INPUT_DLC_URL:-${SECRET_DLC_URL:-}}"
          fi

          download_file() {
            local url="$1"
            local output="$2"
            local parsed_items item kind target_id

            if [[ -z "${url// /}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            mask_value "$url"

            parsed_items="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          raw = sys.argv[1].strip()
          tokens = [t.strip() for t in re.split(r"[\s,;]+", raw) if t.strip()]
          results = []

          for token in tokens:
              parsed = urlparse(token)
              query = parse_qs(parsed.query)
              file_id = None
              kind = "file"

              if "google.com" in parsed.netloc.lower():
                  folder_match = re.search(r"/folders/([^/?#]+)", parsed.path)
                  file_match = re.search(r"/(?:file/d|d)/([^/?#]+)", parsed.path)
                  if folder_match:
                      file_id = folder_match.group(1)
                      kind = "folder"
                  elif file_match:
                      file_id = file_match.group(1)
                  elif query.get("id"):
                      file_id = query["id"][0]

              if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", token):
                  file_id = token

              if file_id:
                  results.append(f"{kind}:{file_id}:{token}")
              elif parsed.scheme.lower() in ("http", "https"):
                  # Direct HTTP/HTTPS URL (Pixeldrain, HuggingFace, Gofile direct, etc.)
                  results.append(f"direct:{token}")

          if not results:
              raise SystemExit(
                  "Could not extract a Google Drive ID or direct HTTP/HTTPS URL."
              )

          print("\n".join(results))
          PY
          )"

            while IFS= read -r item; do
              [[ -z "$item" ]] && continue
              kind="${item%%:*}"
              local rest="${item#*:}"
              if [[ "$kind" == "direct" ]]; then
                target_id="$rest"
                mask_value "$target_id"
              else
                target_id="${rest%%:*}"
                local raw_token="${rest#*:}"
                mask_value "$target_id"
                mask_value "$raw_token"
              fi
            done <<< "$parsed_items"

            (
              local gdown_home="$WORK/gdown_home_$(basename "$output")"
              mkdir -p "$gdown_home"
              chmod 700 "$gdown_home"
              local download_log="$gdown_home/download.log"
              local idx=0
              while IFS= read -r item; do
                [[ -z "$item" ]] && continue
                idx=$((idx + 1))
                kind="${item%%:*}"
                local rest="${item#*:}"
                if [[ "$kind" == "direct" ]]; then
                  target_id="$rest"
                else
                  target_id="${rest%%:*}"
                fi
                echo "Downloading $(basename "$output") item #$idx ($kind)..."
                if [[ "$kind" == "folder" ]]; then
                  mkdir -p "$output"
                  if ! HOME="$gdown_home" gdown --folder "$target_id" -O "$output" >"$download_log" 2>&1; then
                    echo "::error::Google Drive folder download failed. Check sharing and access."
                    exit 1
                  fi
                  if [[ ! -d "$output" ]] || [[ -z "$(ls -A "$output" 2>/dev/null)" ]]; then
                    echo "::error::Downloaded Google Drive folder is empty."
                    exit 1
                  fi
                elif [[ "$(basename "$output")" == "prod.keys" ]]; then
                  if [[ "$kind" == "direct" ]]; then
                    if ! curl -fsSL --retry 3 -o "$output" "$target_id" >"$download_log" 2>&1; then
                      echo "::error::Keys download failed. Check the Keys_URL secret and file sharing."
                      exit 1
                    fi
                  else
                    if ! HOME="$gdown_home" gdown "$target_id" -O "$output" >"$download_log" 2>&1; then
                      echo "::error::Keys download failed. Check the Keys_URL secret and file sharing."
                      exit 1
                    fi
                  fi
                  if [[ ! -s "$output" ]]; then
                    echo "::error::Downloaded prod.keys file is empty."
                    exit 1
                  fi
                elif [[ "$kind" == "direct" ]]; then
                  mkdir -p "$output"
                  if ! (cd "$output" && curl -fsSL --retry 3 -O -J "$target_id") >"$download_log" 2>&1; then
                    echo "::error::Direct download failed. Check the link, file access and expiry."
                    exit 1
                  fi
                  if [[ -z "$(ls -A "$output" 2>/dev/null)" ]]; then
                    echo "::error::Downloaded direct URL directory is empty."
                    exit 1
                  fi
                else
                  # Download into a directory (-O "$output/") so gdown preserves the
                  # original Google Drive filename (including [TitleID] and [vVersion]
                  # tags required by standard-crypto / ticketless NSPs and updates).
                  mkdir -p "$output"
                  if ! HOME="$gdown_home" gdown "$target_id" -O "$output/" >"$download_log" 2>&1; then
                    echo "::error::Google Drive download failed. Check the link and sharing permissions."
                    exit 1
                  fi
                  if [[ -z "$(ls -A "$output" 2>/dev/null)" ]]; then
                    echo "::error::Downloaded file directory is empty."
                    exit 1
                  fi
                fi
              done <<< "$parsed_items"
              echo "Finished downloading $(basename "$output")."
            ) &
            DOWNLOAD_PIDS+=("$!")
          }

          DOWNLOAD_PIDS=()
          download_file "$GAME_URL" "$WORK/game.download"

          if [[ -n "${KEYS_URL// /}" ]]; then
            download_file "$KEYS_URL" "$WORK/prod.keys"
          else
            echo "No KEYS_URL configured (only Switch 2 .nup packages can build without prod.keys)."
          fi

          if [[ -n "${UPDATE_URL// /}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL// /}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          for pid in "${DOWNLOAD_PIDS[@]}"; do
            wait "$pid"
          done

          if [[ -f "$WORK/prod.keys" ]]; then
            chmod 600 "$WORK/prod.keys"
            # Register key values for masking before invoking extraction/build tools.
            # This protects common accidental log output, not transformed fragments.
            python - "$WORK/prod.keys" <<'PYTHON'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          if p.stat().st_size > 2_000_000:
              raise SystemExit('The downloaded keys file is unexpectedly large; check Keys_URL.')
          def mask(s):
              s = s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::add-mask::' + s)
          for line in p.read_text(encoding='utf-8', errors='replace').splitlines():
              if '=' in line:
                  value = line.split('=', 1)[1].strip()
                  if len(value) >= 6:
                      mask(value)
                  for token in re.findall(r'(?i)\b[0-9a-f]{16,}\b', value):
                      mask(token)
          PYTHON
          fi

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import struct
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          keys_path = work / "prod.keys"
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz", ".nup"
          }
          archive_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
              b"PK\x03\x04",
              b"7z\xbc\xaf\x27\x1c",
          )

          def pfs0_entries(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []
                      count, string_size = struct.unpack_from("<II", header, 4)
                      if count > 100000 or string_size > 100000000:
                          return []
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
                      if len(entries) != count * 0x18:
                          return []
                      names = []
                      for i in range(count):
                          offset = struct.unpack_from("<I", entries, i * 0x18 + 0x10)[0]
                          if offset >= len(strings):
                              continue
                          end = strings.find(b"\0", offset)
                          if end < 0:
                              continue
                          names.append(strings[offset:end].decode(errors="replace"))
                      return names
              except (OSError, struct.error):
                  return []

          def detect_package_extension(path):
              with path.open("rb") as f:
                  header = f.read(0x104)
              if header[:4] == b"NUP\x01":
                  return ".nup"
              if header[:4] == b"PFS0":
                  names = [n.lower() for n in pfs0_entries(path)]
                  if any(n.endswith(".ncz") for n in names):
                      return ".nsz"
                  return ".nsp"
              if len(header) >= 0x104 and header[0x100:0x104] == b"HEAD":
                  if path.suffix.lower() == ".xcz":
                      return ".xcz"
                  return ".xci"
              return None

          def validate_package(path):
              with path.open("rb") as f:
                  header = f.read(0x104)

              suffix = path.suffix.lower()

              if suffix == ".nup" and header[:4] != b"NUP\x01":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".nsp", ".nsz") and header[:4] != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and (
                  len(header) < 0x104 or header[0x100:0x104] != b"HEAD"
              ):
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def package_sha256(path):
              # Stream only on filename/size collisions; do not load large packages into RAM.
              import hashlib
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(4 * 1024 * 1024), b""):
                      digest.update(chunk)
              return digest.digest()

          def add_package(source, label):
              # Validate even when a file looks like a duplicate.
              validate_package(source)
              target = game_dir / source.name
              incoming_hash = None
              for candidate in (target, game_dir / f"{label}_{source.name}"):
                  if not candidate.exists() and not candidate.is_symlink():
                      target = candidate
                      break
                  if not candidate.is_file() or candidate.is_symlink():
                      raise SystemExit("Package filename conflict: destination is not a regular file. Rename the incoming package and retry.")
                  if candidate.stat().st_size == source.stat().st_size:
                      if incoming_hash is None:
                          incoming_hash = package_sha256(source)
                      if package_sha256(candidate) == incoming_hash:
                          print(
                              f"Skipping content-verified duplicate package ({label}): {candidate.name} "
                              f"({candidate.stat().st_size:,} bytes)"
                          )
                          return
              else:
                  raise SystemExit(
                      "Package filename conflict: both the original and label-prefixed names "
                      "contain different data. Rename the incoming package and retry; no existing package was overwritten."
                  )

              shutil.move(str(source), str(target))
              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def extract_and_add(archive_path, label):
              extract_dir = work / f"extracted-{label}-{archive_path.stem}"
              extract_dir.mkdir(parents=True, exist_ok=True)
              print(f"{label}: archive detected ({archive_path.name}); extracting.")
              subprocess.run(
                  ["unar", "-o", str(extract_dir), str(archive_path)],
                  check=True,
              )
              # Free archive disk space immediately after extraction
              archive_path.unlink(missing_ok=True)
              found = False
              for p in sorted(extract_dir.rglob("*")):
                  if not p.is_file() or p.name.startswith("._") or "__MACOSX" in p.parts:
                      continue
                  if p.suffix.lower() in package_extensions:
                      add_package(p, label)
                      found = True
                  else:
                      ext = detect_package_extension(p)
                      if ext:
                          renamed = p.with_name(f"{p.name}{ext}")
                          p.rename(renamed)
                          add_package(renamed, label)
                          found = True
              shutil.rmtree(extract_dir, ignore_errors=True)
              if not found:
                  raise SystemExit(
                      f"No NSP/XCI/NSZ/XCZ/NUP packages found in {label} archive."
                  )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              if source.is_dir():
                  print(f"{label}: scanning downloaded files.")
                  found_any = False
                  for item in sorted(source.rglob("*")):
                      if not item.is_file() or item.name.startswith("._") or "__MACOSX" in item.parts:
                          continue
                      with item.open("rb") as f:
                          sig = f.read(8)
                      if any(sig.startswith(m) for m in archive_signatures):
                          extract_and_add(item, label)
                          found_any = True
                      elif item.suffix.lower() in package_extensions:
                          add_package(item, label)
                          found_any = True
                      else:
                          ext = detect_package_extension(item)
                          if ext:
                              renamed = item.with_name(f"{item.name}{ext}")
                              item.rename(renamed)
                              add_package(renamed, label)
                              found_any = True
                  shutil.rmtree(source, ignore_errors=True)
                  if not found_any:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ/NUP packages found in {label} download."
                      )
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_archive = any(
                  signature.startswith(magic)
                  for magic in archive_signatures
              )

              if is_archive:
                  extract_and_add(source, label)
              else:
                  print(
                      f"{label}: not an archive; "
                      "checking as a direct package."
                  )

                  extension = detect_package_extension(source)
                  if not extension:
                      raise SystemExit(
                          f"{label} is not a recognized RAR/ZIP/7Z archive "
                          "or direct NSP/XCI/NSZ/XCZ/NUP package."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.move(str(source), str(target))
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          # Decompress any .nsz or .xcz packages to .nsp / .xci so both
          # standard and BC-fallback builds work seamlessly with NSZ/XCZ.
          compressed = sorted(
              p for p in game_dir.iterdir()
              if p.is_file() and p.suffix.lower() in (".nsz", ".xcz")
          )
          if compressed:
              if not keys_path.is_file() or keys_path.stat().st_size == 0:
                  raise SystemExit("prod.keys is required to decompress NSZ/XCZ packages. Set the Keys_URL secret and start a new workflow run.")
              nsz_tmp = work / "nsz_tmp"
              nsz_tmp.mkdir(parents=True, exist_ok=True)
              keys_link = nsz_tmp / "keys.txt"
              if not keys_link.exists():
                  keys_link.symlink_to(keys_path.resolve())
              for pkg in compressed:
                  out_ext = ".nsp" if pkg.suffix.lower() == ".nsz" else ".xci"
                  print(f"Decompressing {pkg.name} -> {pkg.stem}{out_ext} ...")
                  subprocess.run(
                      [
                          sys.executable,
                          "-c",
                          "import sys; sys.argv[0]='nsz'; from nsz import main; main()",
                          "-D",
                          "-o",
                          str(game_dir),
                          str(pkg.resolve()),
                      ],
                      cwd=str(nsz_tmp),
                      check=True,
                  )
                  pkg.unlink()

          # Ensure every prepared NSP/XCI package has either a .tik inside or a
          # [TitleID] tag in its filename so ticketless (standard-crypto) NSPs
          # and XCIs work across both standard and BC-fallback nxnative versions.
          import re
          header_key_hex = None
          if keys_path.is_file():
              for line in keys_path.read_text(errors="replace").splitlines():
                  m = re.match(r"^\s*header_key\s*=\s*([0-9A-Fa-f]{64})\s*$", line)
                  if m:
                      header_key_hex = m.group(1)
                      break

          def probe_nca_title_id(pkg_path):
              if not header_key_hex:
                  return None
              try:
                  from nsz.nut import aes128
                  xts_key = bytes.fromhex(header_key_hex)
                  with pkg_path.open("rb") as f:
                      h = f.read(16)
                      if len(h) != 16 or h[:4] != b"PFS0":
                          return None
                      count, str_size = struct.unpack_from("<II", h, 4)
                      entries = f.read(count * 0x18)
                      strings = f.read(str_size)
                      data_base = 16 + count * 0x18 + str_size
                      meta_tids, other_tids = [], []
                      for i in range(count):
                          d_off, d_sz, s_off = struct.unpack_from("<QQI", entries, i * 0x18)
                          end = strings.find(b"\0", s_off)
                          name = strings[s_off:end].decode(errors="replace") if end >= 0 else ""
                          if not name.lower().endswith(".nca") or d_sz < 0x400:
                              continue
                          f.seek(data_base + d_off + 0x200)
                          sec1 = f.read(0x200)
                          if len(sec1) != 0x200:
                              continue
                          dec = aes128.AESXTS(xts_key, sector=1).decrypt(sec1)
                          if dec[:4] in (b"NCA3", b"NCA2"):
                              ctype = dec[0x05]
                              tid = struct.unpack_from("<Q", dec, 0x10)[0]
                              if ctype == 1:
                                  meta_tids.append(tid)
                              else:
                                  other_tids.append(tid)
                      if meta_tids:
                          return min(meta_tids)
                      if other_tids:
                          return min(other_tids)
              except Exception as exc:
                  print(f"Warning: NCA header title ID probe failed for {pkg_path.name}: {exc}")
              return None

          for pkg in sorted(game_dir.iterdir()):
              if not pkg.is_file() or pkg.suffix.lower() not in (".nsp", ".xci"):
                  continue
              has_tik = any(
                  re.fullmatch(r"[0-9A-Fa-f]{32}\.tik", n)
                  for n in pfs0_entries(pkg)
              )
              has_tag = bool(re.search(r"\[[0-9A-Fa-f]{16}\]", pkg.name))
              if not has_tik and not has_tag:
                  tid = probe_nca_title_id(pkg)
                  if tid is not None:
                      new_name = f"{pkg.stem} [{tid:016X}]{pkg.suffix}"
                      new_path = pkg.with_name(new_name)
                      pkg.rename(new_path)
                      print(f"Tagged ticketless package with NCA Title ID: {new_path.name}")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          needs_keys = any(p.suffix.lower() in (".nsp", ".xci", ".nsz", ".xcz") for p in packages)
          if needs_keys and (not keys_path.is_file() or keys_path.stat().st_size == 0):
              raise SystemExit("prod.keys is required for NSP/XCI/NSZ/XCZ packages.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

      - name: Detect game title ID, IPA filename, and apply iPhone 17 Pro upgrades
