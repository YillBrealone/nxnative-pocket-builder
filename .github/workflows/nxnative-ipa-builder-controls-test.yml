      - name: Verify Downwell capture and iOS patch before publication
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && env.DETECTED_TITLE_ID == '010093D00C726000' && inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_DOWNWELL'
          """Build evidence gate v2, not a gameplay test. Runs before IPA publication."""
          import os
          from pathlib import Path
          import plistlib
          import re
          import zipfile

          ROUTE = b'Downwell test: dynamic ShowApplicationError routed to host'
          MESSAGE = b'Downwell test: application error code='
          STOP = b'received SIGTERM: graceful exit'
          DONE = b'graceful exit done'

          def verify(root, ipa):
              logs = list(root.glob('**/logs/gl_capture.log'))
              if len(logs) != 1:
                  raise ValueError(f'Downwell test: expected one fresh GL capture log, found {len(logs)}')
              data = logs[0].read_bytes()
              if re.search(rb'CRASH\s+sig\s*=', data):
                  raise ValueError('Downwell test: Mac capture still crashed; refusing IPA publication. Inspect build logs.')
              if ROUTE not in data:
                  raise ValueError('Downwell test: capture did not select the patched host handler; inspect build logs')
              if not re.search(rb'\[gl\] frame [1-9][0-9]*:', data):
                  raise ValueError('Downwell test: capture has no recorded GL frame progress; inspect build logs')
              if STOP not in data or DONE not in data or data.rfind(DONE) < data.rfind(STOP):
                  raise ValueError('Downwell test: orderly capture shutdown not recorded; inspect build logs')
              # Resolving the function at startup and invoking it later are separate events.
              # A capture that stops normally before the dialog is shown is not a routing failure.
              warning_logged = MESSAGE in data
              with zipfile.ZipFile(ipa) as z:
                  plists = [n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n)]
                  if len(plists) != 1:
                      raise ValueError('Downwell test: unexpected IPA app layout')
                  info = plistlib.loads(z.read(plists[0]))
                  exe = info['CFBundleExecutable']
                  if not isinstance(exe, str) or '/' in exe or exe in ('', '.', '..'):
                      raise ValueError('Downwell test: invalid IPA executable name')
                  binary = z.read(plists[0].rsplit('/', 1)[0] + '/' + exe)
                  if ROUTE not in binary or MESSAGE not in binary:
                      raise ValueError('Downwell test: patched handler markers missing from iOS executable')
              print('Downwell test v2: host route selected, GL frame progress and orderly capture shutdown recorded, iOS patch markers present')
              if warning_logged:
                  print('Downwell test: application error argument was logged during capture')
              else:
                  print('::warning::Downwell test: application error argument was not logged during capture; runtime handler execution is not verified by this capture')
              print('This does NOT establish full shader coverage, rendered visuals or working iPhone gameplay.')
              return warning_logged

          if __name__ == '__main__':
              root = Path(os.environ['RUNNER_TEMP'])
              warning_logged = verify(root / 'GameFiles', root / os.environ['IPA_FILENAME'])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('\n## Downwell startup test: capture check v2\n'
                          '- Mac dynamic lookup selected the patched host handler.\n'
                          '- GL frame progress and orderly capture shutdown recorded; no crash signature in that log.\n'
                          '- iOS executable contains the patched route and warning markers.\n')
                  f.write('- Application error argument logged during capture.\n' if warning_logged else
                          '- **Not exercised/verified:** application error argument was not logged during capture.\n')
                  f.write('- **Still required:** iPhone startup, warning-path and gameplay tests. Rendered visuals and full shader coverage are not established.\n')
          PY_DOWNWELL

      - name: Verify A Short Hike iOS workaround before publication
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && env.DETECTED_TITLE_ID == '01004890117B2000' && inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_SHORT_HIKE'
          """Verify A Short Hike integration identity in an IPA, not gameplay."""
          import hashlib
          import os
          from pathlib import Path
          import plistlib
          import zipfile

          MARKERS = (b'[ASH-MSAA-v1] %s requested=8 actual=', b'[ASH-MSAA-v1] pass actual=',
                     b'[ASH-MSAA-v1] pipeline actual=', b'[ASH-MSAA-v1] resolve actual=',
                     b'per-sample shader reads are NOT proven safe')


          def verify(path):
              with zipfile.ZipFile(path) as z:
                  infos = [n for n in z.namelist() if n.startswith('Payload/') and n.count('/') == 2 and n.endswith('.app/Info.plist')]
                  if len(infos) != 1:
                      raise ValueError('A Short Hike: expected one app Info.plist')
                  info = plistlib.loads(z.read(infos[0]))
                  name = info['CFBundleExecutable']
                  if not isinstance(name, str) or '/' in name or name in ('.', '..'):
                      raise ValueError('A Short Hike: invalid executable name')
                  binary = z.read(infos[0].rsplit('/', 1)[0] + '/' + name)
                  if not all(marker in binary for marker in MARKERS):
                      raise ValueError('A Short Hike: MSAA workaround markers missing; refusing publication')
              return hashlib.sha256(binary).hexdigest()


          if __name__ == '__main__':
              digest = verify(Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME'])
              print('A Short Hike: IPA workaround markers verified. Executable SHA256: ' + digest)
              print('Packaging identity check only; not proof of A12Z rendering or gameplay.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('- A Short Hike workaround markers found in the IPA executable. Device verification of this build remains pending.\n')
          PY_SHORT_HIKE

