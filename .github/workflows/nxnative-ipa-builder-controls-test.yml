l value\',\n        \'partition_order\':\'alias then stack then heap; capacities preserved, stack/heap positions shift with alias growth\',\n        \'source_before\':EXPECTED,\'source_after\':{}}\nfor name,text in outputs.items():\n    Path(name).write_text(text);report[\'source_after\'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()\nPath(os.environ[\'RUNNER_TEMP\']).joinpath(\'disco-legacy-source.json\').write_text(json.dumps(report,indent=2)+\'\\n\')\nprint(\'[disco-legacy-v1] checked Legacy port installed; renderer, physical pool policy and other games unchanged\')\n', 'compact': '"""Choose a fixed, checked +256 MiB Disco alias extension, without fallback."""\nimport hashlib,json,os\nfrom pathlib import Path\np=Path(\'dm/host/hle_svc.c\');s=p.read_text()\nassert hashlib.sha256(p.read_bytes()).hexdigest()==\'a024e23e570320e7125b548770f450d2dab8243bffb80e51d82987d5a6f8e3d4\', \'Unexpected Legacy port source\'\nassert s.count(\'\\n#if TARGET_OS_IPHONE\\n    /* Disco 1.0.13 test fix: enlarge the alias region and total reservation equally.\\n     * Preserve Legacy partition order; following stack/heap addresses shift. Do not alter the reported pool, heap/stack partitions,\\n     * SDK alignment, physical mapping policy or allocation return values.\\n     * The workflow separately verifies this title\\\'s exact main/SDK builds.\\n     */\\n    if (DM_GAME_PROGRAM_ID == UINT64_C(0x01006C5015E84000)) {\\n        if (RESERVE != UINT64_C(0x140000000) ||\\n            DM_GAME_MEM_ALIAS != UINT64_C(0x118000000) ||\\n            DM_GAME_MEM_STACK != UINT64_C(0x10000000) ||\\n            alias != UINT64_C(0x118000000) ||\\n            g_reserve != UINT64_C(0x140000000))\\n            die("[disco-legacy-v1] unsupported runtime memory layout; test fix not applied");\\n        alias += UINT64_C(0x40000000);\\n        g_reserve += UINT64_C(0x40000000);\\n        LOG("[disco-legacy-v1] CONFIGURED virtual_reserve=%#llx alias_capacity=%#llx reported_app_pool=%#llx; physi