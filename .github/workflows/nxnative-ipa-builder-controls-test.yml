x118000000) ||\\n            DM_GAME_MEM_STACK != UINT64_C(0x10000000) ||\\n            alias != UINT64_C(0x118000000) ||\\n            g_reserve != UINT64_C(0x140000000))\\n            die("[disco-legacy-compact-v1] unsupported runtime memory layout; test fix not applied");\\n        alias += UINT64_C(0x10000000);\\n        g_reserve += UINT64_C(0x10000000);\\n        LOG("[disco-legacy-compact-v1] CONFIGURED virtual_reserve=%#llx alias_capacity=%#llx reported_app_pool=%#llx; physical pages remain demand-mapped",\\n            (unsigned long long)g_reserve, (unsigned long long)alias,\\n            (unsigned long long)DM_GAME_APP_POOL);\\n    }\\n#endif\\n\',1).replace(\'[disco-legacy-v1] ACTIVE\',\'[disco-legacy-compact-v1] ACTIVE\')\nassert hashlib.sha256(s.encode()).hexdigest()==\'5223149963b36528800ecda7f6556a9356729407306f5e7e0b9838918189c344\', \'Unexpected compact source result\'\np.write_text(s)\nresult={\'test\':\'disco-legacy-compact-v1\',\'before_sha256\':\'a024e23e570320e7125b548770f450d2dab8243bffb80e51d82987d5a6f8e3d4\',\'after_sha256\':\'5223149963b36528800ecda7f6556a9356729407306f5e7e0b9838918189c344\',\'reserve\':\'0x150000000\',\'alias\':\'0x128000000\',\'heap\':\'0x8000000\',\'stack\':\'0x10000000\',\'status\':\'Fixed +256 MiB virtual alias extension; no fallback. Device gameplay unverified.\'}\n(Path(os.environ[\'RUNNER_TEMP\'])/\'disco-compact-source.json\').write_text(json.dumps(result,indent=2)+\'\\n\')\nprint(\'[disco-legacy-compact-v1] fixed 5.25 GiB reservation, 4.625 GiB alias; renderer and physical pool unchanged\')\n', 'nxdiag': '"""Install Disco-only diagnostic logging into the pinned engine checkout.\nNo network, no game-data modifications, no memory-profile changes.\n"""\nimport ast, hashlib, json, os\nfrom pathlib import Path\n\nEXPECTED = {\n    \'dm/host/hle_svc.c\': \'bf6f23b96fad2366591721a3d5e30f8eb5a8f314216d6437d9bc600d29c448ce\',\n    \'dm/tools/patch_nso.py\': \'840fc5bf2e959b3599532e7ce3ffd2d78afc23590ff2d9f727ece770502c2bd4\',\n}\ndef once(s, old, new):\n    if s.count(old) != 1:\n        raise SystemExit(\'Diagnostic source anchor mismatch; refusing to modify engine: \' + old[:90])\n    return s.replace(old, new, 1)\n\nfor name, sha in EXPECTED.items():\n    if hashlib.sha256(Path(name).read_bytes()).hexdigest() != sha:\n        raise SystemExit(\'Diagnostic source fingerprint mismatch: \' + name)\n\nCALLBACKS = \'\\n/* Disco allocation diagnostic v1. Observation only; no guest register writes.\\n * Exact SDK 11.4.9 / Disco 1.0.13 layout, guarded by rewriter build IDs/opcodes.\\n * Failure snapshot runs before VammManager releases its own mutex.\\n */\\n#define DISCO_DIAG_TAG "[disco-alloc-v1]"\\nstatic _Thread_local uint64_t disco_diag_manager;\\nstatic _Thread_local uint32_t disco_diag_metadata_result;\\nstatic _Thread_local unsigned disco_diag_failures;\\nstatic int disco_diag_read(uint64_t a, void *out, size_t n) {\\n    vm_size_t got = 0;\\n    if (!a || a > UINT64_MAX - n) return 0;\\n    return !vm_read_overwrite(mach_task_self(), (vm_address_t)a, n,\\n                             (vm_address_t)out, &got) && got == n;\\n}\\nstatic void disco_diag_begin(uint64_t *r) {\\n    disco_diag_manager = r[0];\\n    disco_diag_metadata_result = 0;\\n    static _Atomic int announced;\\n    if (!atomic_exchange(&announced, 1))\\n        LOG(DISCO_DIAG_TAG " ARMED main=7c463c12553bab2d98dd6d579d60af07 sdk=5bb30f7980902b19b8babdc891061ef2 gates=%d,%d,%d observation-only",\\n            gate_obs_present(27), gate_obs_present(28), gate_obs_present(29));\\n}\\nstatic void disco_diag_metadata(uint64_t *r, int param) {\\n    (void)param;\\n    disco_diag_metadata_result = (uint32_t)r[0];\\n    LOG(DISCO_DIAG_TAG " METADATA_MAP_FAIL result=%#x page_bytes=0x1000", (unsigned)r[0]);\\n}\\nstatic void disco_diag_tree(uint64_t manager, uint64_t request) {\\n    uint64_t region = 0, root = 0, stack[64], cur, previous_end = 0;\\n    uint64_t largest_raw = 0, largest_aligned = 0, largest_at = 0, reserved = 0;\\n    uint64_t alignment = request < 0x200000 ? 0x10000 : 0x200000;\\n    unsigned depth = 0, nodes = 0, gaps = 0, fits = 0, have_prev = 0;\\n    int complete = 1;\\n    if (!disco_diag_read(manager + 0x40, &region, 8) ||\\n        !disco_diag_read(region + 0x10, &root, 8) || !root) {\\n        LOG(DISCO_DIAG_TAG " TREE unavailable: safe read failed or empty root"); return;\\n    }\\n    uint64_t bounds[2] = {0, 0};\\n    if (!disco_diag_read(region, bounds, sizeof bounds)) {\\n        LOG(DISCO_DIAG_TAG " TREE unavailable: bounds unreadable"); return;\\n    }\\n    LOG(DISCO_DIAG_TAG " TREE alias=%#llx capacity=%#llx alignment=%#llx guard_each=0x1000",\\n        (unsigned long long)bounds[0], (unsigned long long)bounds[1], (unsigned long long)alignment);\\n    cur = root;\\n    while (cur || depth) {\\n        while (cur) {\\n            uint64_t left;\\n            if (depth == 64 || nodes >= 8192 || !disco_diag_read(cur, &left, 8)) { complete = 0; goto finish; }\\n            stack[depth++] = cur; cur = left;\\n        }\\n        cur = stack[--depth];\\n        uint64_t node[6];\\n        if (!disco_diag_read(cur, node, sizeof node)) { complete = 0; break; }\\n        uint64_t base = node[4], size = node[5];\\n        if (base > UINT64_MAX - size || (have_prev && base < previous_end)) { complete = 0; break; }\\n        nodes++;\\n        if (nodes <= 128)\\n            LOG(DISCO_DIAG_TAG " REGION base=%#llx size=%#llx", (unsigned long long)base, (unsigned long long)size);\\n        if (reserved > UINT64_MAX - size) { complete = 0; break; }\\n        reserved += size;\\n        if (have_prev) {\\n            uint64_t raw = base - previous_end;\\n            if (raw > largest_raw) largest_raw = raw;\\n            if (raw >= 0x2000 && previous_end <= UINT64_MAX - 0x1000 - (alignment - 1)) {\\n                uint64_t start = (previous_end + 0x1000 + alignment - 1) & ~(alignment - 1);\\n                uint64_t end = base - 0x1000;\\n                if (end >= start) {\\n                    uint64_t available = end - start;\\n                    gaps++;\\n                    if (available > largest_aligned) { largest_aligned = available; largest_at = start; }\\n                    if (available >= request) fits++;\\n                }\\n            }\\n        }\\n        previous_end = base + size; have_prev = 1; cur = node[1];\\n        if (nodes >= 8192 && (cur || depth)) { complete = 0; break; }\\n    }\\nfinish:\\n    LOG(DISCO_DIAG_TAG " TREE_SUMMARY complete=%d nodes=%u listed=%u reserved=%#llx gaps=%u largest_raw=%#llx largest_aligned=%#llx largest_at=%#llx fitting_gaps=%u requested=%#llx",\\n        complete, nodes, nodes < 128 ? nodes : 128, (unsigned long long)reserved, gaps,\\n        (unsigned long long)largest_raw, (unsigned long long)largest_aligned,\\n        (unsigned long long)largest_at, fits, (unsigned long long)request);\\n}\\nstatic void disco_diag_failure(uint64_t *r, int param) {\\n    (void)param;\\n    if (disco_diag_failures++ >= 4) return;\\n    LOG(DISCO_DIAG_TAG " RESERVE_FAIL sdk_result=%#x request=%#llx caller=%s metadata_result=%#x map_limit=%d",\\n        (unsigned)r[21], (unsigned long long)t_rgn_size, t_rgn_who,\\n        disco_diag_metadata_result, dm_profile()->mem_map_limit);\\n    uint64_t region = 0, node_area[3] = {0, 0, 0};\\n    int node_ok = disco_diag_read(disco_diag_manager + 0x40, &region, 8) &&\\n                  disco_diag_read(region + 0x18, node_area, sizeof node_area);\\n    LOG(DISCO_DIAG_TAG " NODE_STATE readable=%d start=%#llx mapped_end=%#llx reserve_end=%#llx",\\n        node_ok, (unsigned long long)node_area[0], (unsigned long long)node_area[1], (unsigned long long)node_area[2]);\\n    if ((uint32_t)r[21] == 0x1803) disco_diag_tree(disco_diag_manager, t_rgn_size);\\n}\\nstatic void disco_diag_provider(uint64_t *r, int param) {\\n    (void)param;\\n    /* gate block pushes x29/x30 (16 bytes); regs[99] is its stack pointer. */\\n    uint64_t provider_sp = r[99] + 16, result = 0, sdk_result = 0;\\n    uint32_t error_class = 0;\\n    if (!disco_diag_read(provider_sp + 8, &result, 8)) {\\n        LOG(DISCO_DIAG_TAG " PROVIDER unreadable output"); return;\\n    }\\n    if (result) return;\\n    int ok = disco_diag_read(provider_sp + 0x38, &sdk_result, 8) &&\\n             disco_diag_read(provider_sp + 0x48, &error_class, 4);\\n    LOG(DISCO_DIAG_TAG " PROVIDER_ZERO readable=%d raw_error=%#llx error_class=%#x block_bytes=%#llx",\\n        ok, (unsigned long long)sdk_result, error_class, (unsigned long long)r[22]);\\n}\\n\'\nGATES = "# Disco allocation diagnostic v1: fail closed on a different guest build.\\ndisco_expected = {\'main\': \'7c463c12553bab2d98dd6d579d60af07\',\\n                  \'sdk\': \'5bb30f7980902b19b8babdc891061ef2\'}\\nif NAME in disco_expected:\\n    if BUILD_ID != disco_expected[NAME]:\\n        raise RuntimeError(\'Disco diagnostic requires the inspected 1.0.13 main and SDK; wrong \' + NAME + \' build: \' + BUILD_ID)\\n    disco_sites = {\\n        \'main\': [(0x895edc, 29, \'f94007f4\', \'Disco diagnostic v1: provider return before error overwrite\')],\\n        \'sdk\': [(0x34e5e8, 27, \'aa1303e0\', \'Disco diagnostic v1: SDK allocation failure before unlock\'),\\n                (0x34f480, 28, \'12002008\', \'Disco diagnostic v1: bookkeeping map failure\')],\\n    }\\n    obs += disco_sites[NAME]\\n    print(\'[disco-alloc-v1] installing checked observation gates for \' + NAME)\\n"\n\nsvc = Path(\'dm/host/hle_svc.c\').read_text()\nsvc = once(svc, \'static void region_ask(uint64_t *r, int param) {\', CALLBACKS + \'\\nstatic void region_ask(uint64_t *r, int param) {\')\nsvc = once(svc, \'    t_rgn_size = r[2]; guest_caller(r, t_rgn_who, sizeof t_rgn_who, &t_rgn_via);\',\n           \'    disco_diag_begin(r);\\n    t_rgn_size = r[2]; guest_caller(r, t_rgn_who, sizeof t_rgn_who, &t_rgn_via);\')\nsvc = once(svc, \'__attribute__((constructor)) static void regions_attach(void) {\',\n           \'__attribute__((