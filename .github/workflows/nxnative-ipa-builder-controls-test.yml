          """Downwell-only legacy source patch. Invoked inline by the delivered test workflow.
          No game data, keys, environment flags or shader changes. Refuse unknown inputs.
          """
          import hashlib
          import os
          from pathlib import Path

          TITLE = '010093D00C726000'
          ENGINE = 'b5ac83de5c3c01ab30b3e0dbac8eaf32fe2f9b14'
          DEVICE = 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
          SYMBOL = '_ZN2nn3err20ShowApplicationErrorERKNS0_19ApplicationErrorArgE'
          EXPECTED = {'dm/host/hle_ro.c': '1b96856597f14af87a4f631a98d8ac106c30a0d725b6471bbddddfcfafb8983d', 'dm/host/hle_offline.c': '7083a678e60f5e99dae9dcfcb8a0ed135dfca3d699199374bd235f770a032cbb', 'dm/host/hle.h': 'c75806fef578937d596b9cf52d3a35ed1429a80fdec6db7418e6c12d9c23e2f3'}

          OLD_LOOKUP = '    void *p = name ? guest_sym(name) : NULL;'
          NEW_LOOKUP = '''    // Downwell test v1: this ONE dynamic export must use its existing host handler.
              // This source change is installed only for the Downwell legacy test build.
              extern void *dm_downwell_application_error_handler(void);
              void *p;
              if (name && !strcmp(name, "_ZN2nn3err20ShowApplicationErrorERKNS0_19ApplicationErrorArgE")) {
                  p = dm_downwell_application_error_handler();
                  LOG("Downwell test: dynamic ShowApplicationError routed to host");
              } else {
                  p = name ? guest_sym(name) : NULL;
              }'''
          OLD_HANDLER = '''HLE_FORCE("_ZN2nn3err20ShowApplicationErrorERKNS0_19ApplicationErrorArgE", "application error applet; the host only logs it", void, h_err_ShowApp, const void *arg) { DM_APPLET("error"); (void)arg; LOG("game asks to show an application error (ApplicationErrorArg)"); }'''
          NEW_HANDLER = '''HLE_FORCE("_ZN2nn3err20ShowApplicationErrorERKNS0_19ApplicationErrorArgE", "application error applet; the host only logs it", void, h_err_ShowApp, const void *arg) {
              DM_APPLET("error");
              LOG("game asks to show an application error (ApplicationErrorArg)");
              // Layout verified against Downwell 1.0.0's SDK 5.4 getters. Do not guess other SDKs.
              if (arg && dm_sdk_major() == 5) {
                  const unsigned char *a = arg;
                  uint32_t code;
                  memcpy(&code, a + 8, sizeof code);
                  // The dialog field starts at +0x14 and holds 0x800 bytes. Limit output to
                  // 255 bytes and sanitize line/control characters. Never treat it as a format.
                  char message[256];
                  size_t n = 0;
                  while (n < sizeof message - 1 && a[0x14 + n]) {
                      unsigned char c = a[0x14 + n];
                      message[n++] = c < 32 || c == 127 ? ' ' : (char)c;
                  }
                  message[n] = 0;
                  LOG("Downwell test: application error code=%u dialog=%s", (unsigned)code, message);
              } else {
                  LOG("Downwell test: error argument not decoded (null or SDK other than 5)");
              }
          }
          // Return the SAME handler registered by HLE_FORCE, preserving its applet lifecycle.
          // No general change to guest_sym, LookupModuleSymbol, or other dynamic exports.
          void *dm_downwell_application_error_handler(void) { return (void *)h_err_ShowApp; }'''


          def apply(root, env):
              if env.get('DETECTED_TITLE_ID') != TITLE:
                  raise ValueError('Downwell test: wrong title; no files changed')
              if env.get('DEVICE_INPUT') != DEVICE or env.get('ENGINE_REV') != ENGINE:
                  raise ValueError('Downwell test requires the pinned Metal 3 + BC fallback engine, even on iPhone 17 Pro')
              if env.get('CACHE_INPUT') != 'false':
                  raise ValueError('Downwell test requires shader_cache unchecked for a fresh capture')
              originals = {}
              for name, expected in EXPECTED.items():
                  data = (root / name).read_bytes()
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise ValueError(f'Downwell test: source hash mismatch or patch already applied: {name}; no files changed')
                  originals[name] = data.decode('utf-8')
              changes = {}
              for name, old, new in [('dm/host/hle_ro.c', OLD_LOOKUP, NEW_LOOKUP),
                                     ('dm/host/hle_offline.c', OLD_HANDLER, NEW_HANDLER)]:
                  if originals[name].count(old) != 1:
                      raise ValueError(f'Downwell test: expected exactly one source anchor in {name}; no files changed')
                  changes[name] = originals[name].replace(old, new)
              # All source/anchor checks finish before either source is written.
              for name, text in changes.items():
                  (root / name).write_text(text, encoding='utf-8')
              print('Downwell test v1: guarded source patch applied to Mac capture and iOS shared host sources')

          if __name__ == '__main__':
              apply(Path('.'), os.environ)
          PY_DOWNWELL

