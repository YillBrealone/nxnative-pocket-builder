              # Do not edit files that this update only reads/guards.
              return matches, {p: s for p,s in result.items() if s != original[p]}


          def apply(root):
              matches, changes = make_changes(root)
              # All anchors and input hashes checked before the first write.
              for p, text in changes.items():
                  (root / p).write_text(text, encoding='utf-8')
              print('Pocket update applied:', ', '.join(matches), ';', len(changes), 'files')
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as f:
                      f.write('## Pocket settings and motion update\n'
                              '- Audited source set: ' + ', '.join(matches) + '.\n'
                              '- Settings notes/dependencies and override guards; phone-heading recenter action.\n'
                              '- Auto/30 is profile-limited on modern engines; legacy pacing unchanged.\n'
                              '- Source checks are not Xcode or device/gameplay validation.\n\n')


          if __name__ == '__main__':
              apply(Path.cwd())
          POCKET_PY

