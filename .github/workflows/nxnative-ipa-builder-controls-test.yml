      - name: Verify Legacy Nintendo touch before publication
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_VERIFY_NINTENDO'
          import hashlib,json,os,plistlib,re,zipfile
          from pathlib import Path
          expected={'dm/ios/Sources/DmGamepad.m':'b5e6bf86897aa24464cb3b51ddb193ca54a75a401097a834da7748922d434cdc','dm/ios/Sources/DmNintendoFace.h':'a5d3ee69c1dedab7191e9205af6822c3dcefe131f56cc1fb2b34a57b16dcb7bb','dm/ios/Sources/DmFaceLayout.h':'80becee7bd70ed897f4b9b26a631bb390d8052a406c84fc7559401f3b1cd7042'}
          for name,digest in expected.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest()!=digest: raise SystemExit('Legacy Nintendo source changed: '+name)
          root=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/os.environ['IPA_FILENAME']) as z:
              infos=[n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist',n)]
              if len(infos)!=1: raise SystemExit('Legacy Nintendo: expected one app')
              info=plistlib.loads(z.read(infos[0]));name=info.get('CFBundleExecutable')
              if not isinstance(name,str) or not name or '/' in name: raise SystemExit('Invalid executable name')
              if info.get('DMCommit') not in ('b5ac83de5c3c','b5ac83de5c3c+dirty'): raise SystemExit('Legacy Nintendo: wrong engine stamp')
              b=z.read(infos[0].rsplit('/',1)[0]+'/'+name)
              if b'[legacy-nintendo-v1] Nintendo touch default' not in b: raise SystemExit('Legacy Nintendo: packaged marker missing')
          result={'test':'legacy-nintendo-v1','source_hashes':expected,'executable_sha256':hashlib.sha256(b).hexdigest(),'scope':'Source and marker verification; on-device touch/physical input test still required'}
          (root/'legacy-nintendo-verification.json').write_text(json.dumps(result,indent=2)+'\n')
          print('[legacy-nintendo-v1] checked touch geometry source and packaged marker')
          PY_VERIFY_NINTENDO

